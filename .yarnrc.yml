compressionLevel: mixed

enableGlobalCache: false

logFilters:
  - code: YN0002
    level: discard

nodeLinker: node-modules

# false is default since yarn 4.14, do NOT change this. Instead add an exception to root package.json dependenciesMeta
enableScripts: false

# empty [] is the default value (packages are to be installed only from npm). Add a repo here only in exceptional cases.
approvedGitRepositories: []

# Allow only packages older than 14 days (in minutes). Schema declares that "14d" can be entered, but that doesn't have any effect.
npmMinimalAgeGate: 20160
# Skip age gate for experimental, rapidly changing packages
npmPreapprovedPackages:
  - "@types/invity-api@*"
  # 16.0.1 (the newest gate-passing release) pins vulnerable axios 1.16.1; 16.1.0 pins patched 1.18.0
  - "@stellar/stellar-sdk@16.1.0"

yarnPath: .yarn/releases/yarn-4.14.1.cjs
