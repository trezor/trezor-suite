[package]
name = "trezor-bluetooth"
version = "0.4.3"
edition = "2021"

[profile.release]
opt-level = "z"       # prioritize size over speed
lto = true            # link-time optimization
codegen-units = 1     # better optimization, smaller binary
strip = "symbols"     # built-in strip

[dependencies]
futures = "^0.3.31"
hyper = {version="^1.6.0",features = ["server", "http1"]}
hyper-tungstenite = "^0.17.0"
hyper-util = "0.1.11"
http-body-util = "0.1.3"
log = "0.4.27"
pretty_env_logger = "0.5.0"
serde = {version = "1.0.219", features = ["derive"] }
serde_json = "^1.0.140"
tokio = { version = "^1.44.0", features = ["sync", "rt", "macros", "rt-multi-thread", "io-util"] }
thiserror = "^2.0.16"

btleplug = { git = "https://github.com/trezor/btleplug", rev="f66eb37ca293bea1708264a319ec02b14e7935ab" }
# btleplug = "0.11.8"
dashmap = "6.1.0"
uuid = "1.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = {version = "0.9.7", features = ["vendored"]}
dbus-crossroads="0.5.3"
dbus-tokio = "0.7.6"
bluez-async = "0.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Devices_Bluetooth", "Devices_Enumeration"] }
