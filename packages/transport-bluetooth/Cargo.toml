[package]
name = "trezor-bluetooth"
version = "0.5.0"
edition = "2021"

[profile.release]
opt-level = "z"       # prioritize size over speed
lto = true            # link-time optimization
codegen-units = 1     # better optimization, smaller binary
strip = "symbols"     # built-in strip

[dependencies]
futures = "^0.3.34"
hyper = {version="^1.11.1",features = ["server", "http1"]}
hyper-tungstenite = "^0.30.0"
hyper-util = "0.1.20"
http-body-util = "0.1.5"
log = "0.4.34"
pretty_env_logger = "0.5.0"
serde = {version = "1.0.219", features = ["derive"] }
serde_json = "^1.0.151"
tokio = { version = "^1.53.1", features = ["sync", "rt", "macros", "rt-multi-thread", "io-util"] }
thiserror = "^2.0.20"

btleplug = { git = "https://github.com/trezor/btleplug", rev="45936a243a99221e427c11a0a2568d831eeb987a" }
# btleplug = "0.13.2"
# btleplug = { path="../../../trezor-btleplug", version = "0.13.2", features = ["serde"] }
dashmap = "6.2.1"
uuid = "1.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = {version = "0.9.12", features = ["vendored"]}
dbus-crossroads="0.5.3"
dbus-tokio = "0.7.6"
bluez-async = "0.8.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration"] }
