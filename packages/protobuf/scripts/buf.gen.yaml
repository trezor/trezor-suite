version: v2
clean: true
plugins:
    - local: protoc-gen-es
      out: ../src/definitions
      opt:
          - target=js
          - json_types=true

    - local: ./protoc-gen-plugin.ts
      out: ../src/definitions
      opt:
          - target=ts+dts
          - types=messages-thp
          # `messages-debug.proto` not implemented in `@trezor/connect` codebase, however we still want to have _dict.ts definitions available
          # `messages.proto` and `options.proto` does not produce any output
          - skipTypeBox=messages-debug+messages+options
          # `messages.proto` MessageType monolith is broken down to each corresponding dict file.
          - skipDict=messages
