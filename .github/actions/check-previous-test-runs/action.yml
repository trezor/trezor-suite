name: "Check Previous Runs"
description: "Check if a previous run of a job was successful to skip tests"
inputs:
  github_token:
    description: "GitHub token for accessing the API"
    required: true
  pr_branch:
    description: "The branch of the pull request"
    required: true
  pr_created:
    description: "The ISO 8601 timestamp when the PR was created"
    required: true
  repo:
    description: "The repository name"
    required: true
  workflow_name:
    description: "The workflow name to filter runs"
    required: true
  run_attempt:
    description: "The run attempt number"
    required: true
outputs:
  skip_tests:
    description: "Indicates whether tests should be skipped"
    value: ${{ steps.check-previous-runs.outputs.skip_tests }}
  previous_run_id:
    description: "The ID of the previous completed run"
    value: ${{ steps.check-previous-runs.outputs.previous_run_id }}
  previous_run_attempt:
    description: "The attempt number of the previous run"
    value: ${{ steps.check-previous-runs.outputs.previous_run_attempt }}
runs:
  using: "composite"
  steps:
    - name: Check Previous Test Runs
      id: check-previous-runs
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      shell: bash
      run: |
        PR_BRANCH="${{ inputs.pr_branch }}"
        PR_CREATED_TIMESTAMP="${{ inputs.pr_created }}"
        REPO="${{ inputs.repo }}"
        WORKFLOW_NAME="${{ inputs.workflow_name }}"
        RUN_ATTEMPT="${{ inputs.run_attempt }}"

        if [ "${RUN_ATTEMPT}" -gt 1 ]; then
          echo "Manually triggered re-run. Running all tests as usual"
          echo "skip_tests=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Fetch workflow ID
        WORKFLOW_ID=$(gh workflow list \
          --repo "$REPO" \
          --json id,name \
          --limit 100 \
          --jq ".[] | select(.name == \"${WORKFLOW_NAME}\") | .id")

        # Fetch previous PR runs
        PREVIOUS_RUN_RESPONSE=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/$REPO/actions/workflows/${WORKFLOW_ID}/runs?event=pull_request&branch=${PR_BRANCH}&created=%3E%3D${PR_CREATED_TIMESTAMP}&status=completed&per_page=1")

        PREVIOUS_RUN_ID=$(echo "$PREVIOUS_RUN_RESPONSE" | jq -r '.workflow_runs[0].id // ""')
        PREVIOUS_RUN_ATTEMPT=$(echo "$PREVIOUS_RUN_RESPONSE" | jq -r '.workflow_runs[0].run_attempt // ""')
        PREVIOUS_RUN_CONCLUSION=$(echo "$PREVIOUS_RUN_RESPONSE" | jq -r '.workflow_runs[0].conclusion')  

        if [ -z "${PREVIOUS_RUN_ID}" ]; then
          echo "No previous runs found. Running all tests as usual"
          echo "skip_tests=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Check if the previous run was successful
        if [ "${PREVIOUS_RUN_CONCLUSION}" != "success" ]; then
          echo "Previous run was not successful. Rerunning only failed tests"
          echo "skip_tests=false" >> $GITHUB_OUTPUT
          echo "previous_run_id=${PREVIOUS_RUN_ID}" >> $GITHUB_OUTPUT
          echo "previous_run_attempt=${PREVIOUS_RUN_ATTEMPT}" >> $GITHUB_OUTPUT

          echo "${PREVIOUS_RUN_RESPONSE}"
          echo "skip_tests=false"
          echo "previous_run_id=${PREVIOUS_RUN_ID}"
          echo "previous_run_attempt=${PREVIOUS_RUN_ATTEMPT}" 
          exit 0
        fi

        echo "Previous successful job found: ${SUCCESSFUL_JOB_URL} - no need to run tests again"
        echo "skip_tests=true" >> $GITHUB_OUTPUT
