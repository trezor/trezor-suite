name: "Install Node and Yarn Dependencies without build"
description: >
  Installs Node.js and its dependencies without building most of the dependencies, which is significantly faster.
  Only those whitelisted in the root package.json are built. It's not recommended to use these actions for building production versions, as they can produce some unwanted behavior. However, it's sufficient for running validation checks, tests, etc.
inputs:
  focus:
    description: "Arguments for `yarn workspaces focus`. Empty installs every workspace with `yarn --immutable`."
    required: false
    default: ""
  disable-hardened-mode:
    description: "Append `enableHardenedMode: false` to .yarnrc.yml before installing."
    required: false
    default: "false"
  safedep:
    description: "Install SafeDep PMG so that it wraps the Yarn install."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version-file: ".nvmrc"

    - name: Restore develop Yarn cache
      uses: ./.github/actions/restore-yarn-cache

    - name: Disable Yarn hardened mode
      if: inputs.disable-hardened-mode == 'true'
      shell: bash
      run: |
        echo -e "\nenableHardenedMode: false" >> .yarnrc.yml

    - name: Install SafeDep PMG
      if: inputs.safedep == 'true'
      uses: safedep/pmg@961499c36c98afbafec10a257ff27fb464073c86 # v0.30.0
      continue-on-error: true
      with:
        version: v0.32.0
        config-file: .github/pmg-config.yml

    - name: Install dependencies using Yarn
      shell: bash
      env:
        FOCUS: ${{ inputs.focus }}
      run: |
        if [ -n "$FOCUS" ]; then
          yarn workspaces focus $FOCUS
        else
          yarn --immutable
        fi
