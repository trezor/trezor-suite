name: "Determine changed scopes"
description: "Keep JavaScript checks enabled unless only other scopes files changed."
outputs:
  javascript:
    description: "Requires JavaScript checks"
    value: ${{ steps.changes.outputs.javascript }}
  rust:
    description: "Requires Rust checks"
    value: ${{ steps.changes.outputs.rust }}
  docs:
    description: "Requires Docs checks"
    value: ${{ steps.changes.outputs.docs }}
runs:
  using: "composite"
  steps:
    - name: Classify changed files
      id: changes
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      with:
        # PRs use their base branch; pushes compare against the previous commit on the same branch.
        base: ${{ github.ref }}
        predicate-quantifier: some-with-excludes
        # Keep the javascript excludes in sync with the other lists.
        filters: |
          docs:
            - '**/*.md'
            - 'docs/**'
            - '.github/ISSUE_TEMPLATE/**'
          rust:
            - 'packages/transport-bluetooth/**/*.rs'
            - 'packages/transport-bluetooth/Cargo.{toml,lock}'
            - 'packages/transport-bluetooth/scripts/{Dockerfile,build.sh}'
          javascript:
            - '**'
            # docs excludes
            - '!**/*.md'
            - '!docs/**'
            - '!.github/ISSUE_TEMPLATE/**'
            # rust excludes
            - '!packages/transport-bluetooth/**/*.rs'
            - '!packages/transport-bluetooth/Cargo.{toml,lock}'
            - '!packages/transport-bluetooth/scripts/{Dockerfile,build.sh}'
            # dev - not used by any CI job.
            - '!**/*.nix'
            - '!.nix/**'
            - '!nixos-fix-binaries.sh'
            - '!.husky/**'
            - '!.vscode/**'
            - '!CODEOWNERS'
