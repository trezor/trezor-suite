name: "Display testFiles-artifacts links"
description: "Builds a summary index for easier link between test artifacts and test files."
# Required permissions: actions: write, contents: read

inputs:
  github-token:
    description: "Token to call the Actions API"
    required: true

runs:
  using: "composite"

  steps:
    - name: Download shard artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: shard-*
        path: ./shards
        merge-multiple: false

    - name: Build summary from shards
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        SUMMARY="$GITHUB_STEP_SUMMARY"

        if [ ! -d ./shards ] || [ -z "$(ls -A ./shards 2>/dev/null || true)" ]; then
          {
            echo "## Android test index"
            echo
            echo "_No shard artifacts found (pattern: shard-*)_"
          } >> "$SUMMARY"
          exit 0
        fi

        # Map artifact name -> id (to build deep links)
        curl -fsSL \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
          -o artifacts.json
        jq '.artifacts | map({key: .name, value: (.id|tostring)}) | from_entries' artifacts.json > artifacts_map.json

        # Header
        {
          echo "## Android tests → artifact links"
          echo
          echo "| Test file | Artifact |"
          echo "|---|---|"
        } >> "$SUMMARY"

        shopt -s nullglob
        for dir in ./shards/shard-*; do
          shard_name="$(basename "$dir")"              # e.g., shard-1
          shard_idx="${shard_name#shard-}"            # e.g., 1
          main_artifact="android-tests-${shard_idx}"

          art_id="$(jq -r --arg n "$main_artifact" '.[$n] // empty' artifacts_map.json)"
          if [ -n "$art_id" ]; then
            dl_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${art_id}"
            art_md="[$main_artifact](${dl_url})"
          else
            art_md="${main_artifact} _(unavailable)_"
          fi

          shard_file="$dir/shard.txt"
          [ -s "$shard_file" ] || continue

          # One row per test file; keep it readable (basename)
          while IFS= read -r p || [ -n "$p" ]; do
            [ -n "$p" ] || continue
            p="${p%$'\r'}"
            name="$(basename "$p")"
            echo "| ${name} | ${art_md} |" >> "$SUMMARY"
          done < "$shard_file"
        done

    - name: Delete shard artifacts
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        curl -fsSL \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
          -o artifacts.json
        jq -r '.artifacts[] | select(.name | startswith("shard-")) | .id' artifacts.json | while read -r id; do
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
          || echo "Failed to delete artifact ${id}" >&2
        done
