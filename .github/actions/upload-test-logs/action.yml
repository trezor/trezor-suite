name: "Extract and Upload test environment Logs"
description: "Extracts Docker Compose logs, redacts wallet credentials supplied through TEST_ENV_LOG_PASSPHRASE, TEST_ENV_LOG_PASSPHRASE_LIVE and TEST_ENV_LOG_MNEMONIC, then uploads them to GitHub or Currents"
inputs:
  destination:
    description: "github uploads an artifact; currents attaches a zip to the run and reads CURRENTS_RECORD_KEY, CURRENTS_PROJECT_ID, CURRENTS_CI_BUILD_ID and CURRENTS_MACHINE_ID"
    required: false
    default: "github"
  currents-workspace:
    description: "Workspace that provides the currents CLI, required by the currents destination"
    required: false
    default: ""
  target:
    description: "Target environment for which logs are being extracted (e.g., desktop, web), used by the github destination"
    required: false
    default: ""
  test-group:
    description: "Test group name for artifact naming, used by the github destination"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Extract logs from test environment
      shell: bash
      run: |
        mkdir -p test-env-logs
        docker compose cp trezor-user-env-unix:/trezor-user-env/logs/debugging.log test-env-logs/trezor-user-env-debugging.log || true
        docker compose cp trezor-user-env-unix:/trezor-user-env/logs/emulator_bridge.log test-env-logs/tenv-emulator-bridge-debugging.log || true
        docker compose cp trezor-user-env-unix:/trezor-user-env/logs/tropic_model.log test-env-logs/trezor-user-env-tropic_model.log || true
        for service in $(docker compose ps --all --services); do
          docker compose logs --no-color "$service" > "test-env-logs/$service.log" 2>&1 || true
        done

    # Callers supply private wallet credentials; public test data remains useful for debugging.
    # Both upload destinations require successful redaction of the copied files and Docker stdout.
    - name: Redact secrets from the logs
      id: redact
      continue-on-error: true
      shell: bash
      run: node ./scripts/ci/redact-test-env-logs.ts test-env-logs

    - name: Upload logs of testing environment
      if: inputs.destination == 'github' && steps.redact.outcome == 'success'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      continue-on-error: true
      with:
        name: test-env-logs-${{ github.job }}-${{ github.run_attempt }}-${{ inputs.target }}-${{ inputs.test-group }}
        path: test-env-logs/
        retention-days: 30

    - name: Attach logs of testing environment to the Currents run
      if: inputs.destination == 'currents' && steps.redact.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        CURRENTS_WORKSPACE: ${{ inputs.currents-workspace }}
      run: |
        ZIP_PATH="$PWD/test-env-logs-$CURRENTS_MACHINE_ID.zip"
        # Windows runners ship 7-Zip, not zip.
        if command -v zip > /dev/null; then
          zip -j -q "$ZIP_PATH" test-env-logs/*
        else
          (cd test-env-logs && 7z a -bso0 "$ZIP_PATH" ./*)
        fi
        yarn workspace "$CURRENTS_WORKSPACE" exec currents run attach --caption "Test environment logs" "$ZIP_PATH"
