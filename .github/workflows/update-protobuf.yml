name: "[Bot] update protobuf definitions"

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  update-protobuf:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run update-protobuf
        run: yarn update-protobuf

      - name: Get firmware commit hash
        id: firmware
        run: |
          commit=$(git -C ../trezor-firmware-probuf-update rev-parse HEAD)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to fetch firmware commit: $commit"
            exit 1
          fi
          echo "commit=$commit" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App token
        if: steps.check.outputs.has_changes == 'true'
        id: trezor-bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.trezor-bot-token.outputs.token }}
          commit-message: "chore(protobuf): update protobuf definitions"
          branch: chore/update-protobuf-definitions
          title: "Update protobuf definitions"
          body: |
            **Firmware commit:** [`${{ steps.firmware.outputs.commit }}`](https://github.com/trezor/trezor-firmware/commit/${{ steps.firmware.outputs.commit }})
          base: develop
          delete-branch: true
          labels: ci, connect, no-project
