name: "[Bot] update protobuf definitions"

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  update-protobuf:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: develop

      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install
        with:
          safedep: "false"

      - name: Run update-protobuf
        run: yarn update-protobuf

      - name: Get firmware commit hash
        id: firmware
        run: |
          commit=$(git -C ../trezor-firmware-probuf-update rev-parse HEAD)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to fetch firmware commit: $commit"
            exit 1
          fi
          echo "commit=$commit" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App token
        if: steps.check.outputs.has_changes == 'true'
        id: trezor-bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          token: ${{ steps.trezor-bot-token.outputs.token }}
          commit-message: "chore(protobuf): update protobuf definitions"
          branch: chore/update-protobuf-definitions
          title: "Update protobuf definitions"
          body: |
            ## Description

            **Firmware commit:** [`${{ steps.firmware.outputs.commit }}`](https://github.com/trezor/trezor-firmware/commit/${{ steps.firmware.outputs.commit }})
          base: develop
          delete-branch: true
          labels: ci, connect, no-project
