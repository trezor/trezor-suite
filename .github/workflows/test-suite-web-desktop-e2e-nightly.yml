name: "[Test] Nightly Suite Web & Desktop e2e tests"
# TEMPORARY (tmp/pr-34361-t3t1-sign-verify): runs only the sign-and-verify specs from PR 34361
# on desktop with the PR-all config, so the T3T1 project runs them too. Not for merging.
run-name: "tmp: PR 34361 sign-and-verify on T3T1 + T3W1 (desktop)"

permissions:
  id-token: write # for fetching the OIDC token
  contents: read # for actions/checkout

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-app:
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/build-suite-desktop-e2e.yml

  run-e2e-suite-desktop-tests:
    if: github.repository == 'trezor/trezor-suite'
    needs:
      - build-app
    strategy:
      fail-fast: false
      matrix:
        TEST_GROUP: [1]
    uses: ./.github/workflows/template-suite-run-e2e.yml
    with:
      target: "desktop"
      pw-config: "./playwright-config/playwright-desktop-pr-all.config.ts"
      test-group: ${{ matrix.TEST_GROUP }}
      caller-job-id: ${{ github.job }}
      fail-fast: "false"
      currents-project-id: "4ytF0E"
      currents-ci-build-id: "tmp-pr-34361-desktop-run-${{ github.run_id }}-${{ github.run_attempt }}"
      download-artifact-name: "desktop-app-build-e2e"
      spec-list: "suite/e2e/tests/wallet/sign-and-verify.test.ts,suite/e2e/tests/wallet/sign-and-verify-eth.test.ts"
    secrets:
      currents-record-key: ${{ secrets.CURRENTS_RECORD_KEY }}
      e2e-passphrase: ${{ secrets.E2E_TEST_PASSPHRASE }}
      e2e-passphrase-live: ${{ secrets.E2E_TEST_PASSPHRASE_LIVE }}
