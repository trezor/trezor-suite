name: "[Build] suite-desktop apps"

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "suite-native/**"
      - "docs/**"
      - "docker/**"
      - "ci/**"
      - ".vscode/**"
      - ".maestro/**"
      - "**.md"
  pull_request:
    types: [labeled]
  workflow_dispatch:

env:
  DESKTOP_APP_NAME: "Trezor-Suite"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # An optimization needed to save RAM on the macOS runner, which is most constrained: build the Webpack Renderer bundle only once in Linux.
  # The Renderer bundle is the heaviest part of the build, and also the only part which can be safely shared (not platform dependent).
  build-and-cache-renderer:
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-desktop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && (github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private')
    name: Build and cache Elecron Renderer process bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true
      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
      - name: Install SafeDep PMG
        uses: safedep/pmg@be0a93f10fbec6a5c94dd78bc722abf1b7fbfc2d # v0.26.0
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install deps and build libs
        # not installing @trezor/suite-desktop and @trezor/suite-desktop-core, because this is only the renderer process
        run: |
          yarn workspaces focus trezor-suite @trezor/suite-desktop-ui @trezor/suite-build @trezor/suite-data @trezor/transport-bridge @suite-common/message-system
          yarn message-system-sign-config
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/transport-bridge build:lib
      - name: Build Electron Renderer bundle
        run: yarn workspace @trezor/suite-build build:desktop
      - name: Cache Electron renderer bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: packages/suite-desktop/build
          key: renderer-bundle-${{ github.sha }}

  suite-desktop:
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-desktop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && (github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private')
    name: Build suite-desktop-${{ matrix.platform }}
    needs: build-and-cache-renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: mac
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true
      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Restore Electron renderer bundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: packages/suite-desktop/build
          key: renderer-bundle-${{ github.sha }}
          fail-on-cache-miss: true

      # safedep/pmg not available on macOS (that's ok, it already guards the `build-and-cache-renderer` job)
      - name: Install deps and build libs
        run: |
          yarn workspaces focus trezor-suite @trezor/suite-desktop @trezor/suite-desktop-ui @trezor/suite-desktop-core @trezor/suite-build @trezor/suite-data @trezor/transport-bridge @suite-common/message-system
          yarn message-system-sign-config
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Build ${{ matrix.platform }} suite-desktop
        env:
          CSC_FOR_PULL_REQUEST: ${{ matrix.platform == 'mac' && 'true' || 'false' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          yarn workspace @trezor/suite-desktop build:app
          yarn workspace @trezor/suite-desktop build:app:electron:${{ matrix.platform }}
          bash packages/suite-desktop-core/scripts/gnupg-sign.sh
          mv packages/suite-desktop/build-electron/* .

      - name: Upload suite-desktop production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: suite-desktop-${{ matrix.platform }}
          path: |
            Trezor-Suite*
            latest*.yml
          retention-days: 3

      - name: Upload suite-desktop mac-arm artifact
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: suite-desktop-mac-arm-dmg
          path: |
            Trezor-Suite-*-mac-arm64.dmg
          retention-days: 3

  suite-desktop-win:
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-desktop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && (github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private')
    name: Build suite-desktop-win
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      platform: win
    container:
      image: electronuserland/builder:22-wine
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true
      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@be0a93f10fbec6a5c94dd78bc722abf1b7fbfc2d # v0.26.0
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install deps and build libs
        run: |
          yarn workspaces focus trezor-suite @trezor/suite-desktop @trezor/suite-desktop-ui @trezor/suite-desktop-core @trezor/suite-build @trezor/suite-data @trezor/transport-bridge @suite-common/message-system
          yarn message-system-sign-config

      - name: Build libs
        run: |
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Build ${{env.platform}} suite-desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        # Caching would be beneficial here as well, maybe not possible: the container interferes actions/cache (even in docker root mode).
        run: |
          yarn workspace @trezor/suite-desktop build:${{env.platform}}
          bash packages/suite-desktop-core/scripts/gnupg-sign.sh
          mv packages/suite-desktop/build-electron/* .

      - name: Upload suite-desktop production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: suite-desktop-${{env.platform}}
          path: |
            Trezor-Suite*
            latest*.yml
          retention-days: 3
