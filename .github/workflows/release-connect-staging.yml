name: "[Release] connect staging"

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      major: ${{ steps.set-version.outputs.major }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Extract connect version
        id: set-version
        run: |
          VERSION="$(node ./scripts/ci/get-connect-version.js)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

  check-version-match:
    runs-on: ubuntu-latest
    needs: [extract-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check connect version match
        uses: ./.github/actions/check-connect-version-match
        with:
          branch_ref: "${{ github.ref }}"
          extracted_version: "${{ needs.extract-version.outputs.version }}"

  # This job deploys to staging-connect.trezor.io/<major>.x.x
  deploy-staging-semantic-version:
    permissions:
      id-token: write
      contents: read
    needs: [extract-version, check-version-match]
    environment: staging-connect
    name: "Deploying to staging-connect.trezor.io/${{ needs.extract-version.outputs.version }}"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/connect/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: release/connect/${{  needs.extract-version.outputs.version }}

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Build and deploy to staging-connect.trezor.io/${{ needs.extract-version.outputs.version }}
        uses: ./.github/actions/release-connect
        with:
          awsRoleToAssume: "arn:aws:iam::538326561891:role/gh_actions_connect_staging_deploy"
          awsRegion: "eu-central-1"
          serverHostname: "staging-connect.trezor.io"
          serverPath: ${{ needs.extract-version.outputs.version }}
          buildArtifacts: "true"
          uploadArtifacts: "true"
          nodeEnv: "production"

  # This job deploys to staging-connect.trezor.io/<major>
  deploy-staging-latest:
    permissions:
      id-token: write
      contents: read
    needs: [extract-version, check-version-match]
    environment: staging-connect
    name: "Deploying to staging-connect.trezor.io/${{ needs.extract-version.outputs.major }}"
    runs-on: ubuntu-latest
    # Only stable releases update the floating /<major> alias; prereleases only publish /<version>.
    if: ${{ startsWith(github.ref, 'refs/heads/release/connect/') && !contains(needs.extract-version.outputs.version, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: release/connect/${{  needs.extract-version.outputs.version }}

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Build and deploy to staging-connect.trezor.io/${{ needs.extract-version.outputs.major }}
        uses: ./.github/actions/release-connect
        with:
          awsRoleToAssume: "arn:aws:iam::538326561891:role/gh_actions_connect_staging_deploy"
          awsRegion: "eu-central-1"
          serverHostname: "staging-connect.trezor.io"
          serverPath: ${{ needs.extract-version.outputs.major }}
          nodeEnv: "production"
          # don't upload artifacts in both jobs, this causes a conflict
          buildArtifacts: "false"
          uploadArtifacts: "false"
