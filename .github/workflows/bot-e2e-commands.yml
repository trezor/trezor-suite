name: "[Bot] E2E Comment Commands"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  dispatch:
    name: Dispatch E2E command handler
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request != '' && 
      startsWith(github.event.comment.body, '/e2e') && 
      github.repository == 'trezor/trezor-suite'
    steps:
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('pr_branch', pr.head.ref);
            core.setOutput('pr_sha', pr.head.sha);
            return pr;

      - name: Dispatch bot handler on PR branch
        uses: actions/github-script@v7
        env:
          PR_BRANCH: ${{ steps.pr-details.outputs.pr_branch }}
          PR_SHA: ${{ steps.pr-details.outputs.pr_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
        with:
          script: |
            const prBranch = process.env.PR_BRANCH;
            const prSha = process.env.PR_SHA;
            const prNumber = process.env.PR_NUMBER.toString();
            const commentBody = process.env.COMMENT_BODY;
            const commenter = process.env.COMMENTER;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot-e2e-commands-dispatch.yml',
              ref: prBranch,
              inputs: {
                pr_number: prNumber,
                pr_branch: prBranch,
                pr_sha: prSha,
                comment_body: commentBody,
                commenter: commenter
              }
            });

      - name: Confirm dispatch
        run: echo "Dispatched bot-e2e-commands-dispatch.yml on branch ${{ steps.pr-details.outputs.pr_branch }}"
