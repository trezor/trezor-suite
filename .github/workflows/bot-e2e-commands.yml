name: "[Bot] E2E Comment Commands"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  handle-command:
    name: Handle E2E command
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request != '' && 
      startsWith(github.event.comment.body, '/e2e') && 
      github.repository == 'trezor/trezor-suite'
    steps:
      - name: Check if user is collaborator
        id: check-permission
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login
              });
              
              const allowed = ['admin', 'write', 'maintain'].includes(permission.permission);
              core.setOutput('allowed', allowed);
              
              if (!allowed) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `@${context.payload.comment.user.login} You don't have permission to run E2E commands. Only repository collaborators can use this feature.`
                });
              }
              return allowed;
            } catch (error) {
              core.setFailed(`Permission check failed: ${error.message}`);
              return false;
            }

      - name: Checkout
        if: steps.check-permission.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Get PR details
        if: steps.check-permission.outputs.allowed == 'true'
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('pr_branch', pr.head.ref);
            core.setOutput('pr_sha', pr.head.sha);
            return pr;

      - name: Parse and execute command
        if: steps.check-permission.outputs.allowed == 'true'
        uses: actions/github-script@v7
        env:
          PR_BRANCH: ${{ steps.pr-details.outputs.pr_branch }}
          PR_SHA: ${{ steps.pr-details.outputs.pr_sha }}
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const prBranch = process.env.PR_BRANCH;
            const prSha = process.env.PR_SHA;

            // Parse command: /e2e <action> <target> [args...]
            const match = comment.match(/^\/e2e\s+(dismiss|run|rerun)\s+(web|desktop)(?:\s+(.+))?$/);

            if (!match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Invalid command format. Usage:
                - \`/e2e dismiss web\` or \`/e2e dismiss desktop\`
                - \`/e2e run web [@tag1 @tag2]\` or \`/e2e run desktop [@tag1 @tag2]\`
                - \`/e2e rerun web\` or \`/e2e rerun desktop\``
              });
              return;
            }

            const [_, action, target, args] = match;

            if (action === 'dismiss') {
              // Mark tests as dismissed for this commit
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **${target}** e2e test skip dismissed for commit \`${prSha.substring(0, 7)}\`\n\nThe artificial failure will be cleared. Tests will be checked again on the next push.`
              });
              
              // Add label to mark dismissal
              const dismissLabel = `e2e-dismiss-${target}-${prSha.substring(0, 7)}`;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [dismissLabel]
              });
              
              // Trigger re-check of the workflow to clear the failure
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: target === 'web' ? 'test-suite-web-e2e-pr.yml' : 'test-suite-desktop-e2e-pr.yml',
                ref: prBranch
              });
              
            } else if (action === 'run') {
              // Trigger custom test run
              const tags = args ? args.trim() : '';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🚀 Starting custom **${target}** e2e tests${tags ? ` with tags: ${tags}` : ''}...\n\nCheck the [Actions tab](${context.payload.repository.html_url}/actions) for progress.`
              });
              
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: target === 'web' ? 'test-suite-web-e2e-custom.yml' : 'test-suite-desktop-e2e-custom.yml',
                ref: prBranch,
                inputs: {
                  pr_number: context.issue.number.toString(),
                  tags: tags,
                  triggered_by: context.payload.comment.user.login
                }
              });
              
            } else if (action === 'rerun') {
              // Trigger rerun of failed tests
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🔄 Starting rerun of **${target}** e2e tests...\n\nOnly failed tests from the previous run will be executed.\n\nCheck the [Actions tab](${context.payload.repository.html_url}/actions) for progress.`
              });
              
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: target === 'web' ? 'test-suite-web-e2e-rerun.yml' : 'test-suite-desktop-e2e-rerun.yml',
                ref: prBranch,
                inputs: {
                  pr_number: context.issue.number.toString(),
                  triggered_by: context.payload.comment.user.login
                }
              });
            }

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Failed to execute E2E command. Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`
            });
