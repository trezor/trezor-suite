name: "Reusable Prepare Suite E2E Dependencies"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: ${{ hashFiles('.github/actions/yarn-cache/action.yml') == '' && 'yarn' || '' }}
      - name: Restore shared Yarn downloads
        if: hashFiles('.github/actions/yarn-cache/action.yml') != ''
        uses: ./.github/actions/yarn-cache
      - name: Restore shared installed dependencies
        if: hashFiles('.github/actions/node-modules-cache/action.yml') != ''
        uses: ./.github/actions/node-modules-cache
        with:
          profile: suite-e2e
      - name: Install SafeDep PMG
        uses: safedep/pmg@0d4f89121c773b0009cc2f2dfb578d03603263f2 # v0.29.1
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Prepare dependencies for every shard
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: yarn workspaces focus @trezor/suite-e2e
      - name: Share prepared installation
        uses: ./.github/actions/yarn-install-artifact
        with:
          operation: upload
          name: suite-e2e-yarn-install
