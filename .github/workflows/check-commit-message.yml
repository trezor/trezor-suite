name: "[Check]: Commit messages"

permissions:
  contents: read

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  commit-message-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Fetch base and current branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          git fetch --no-tags origin "$BASE_REF" --depth=150
          git fetch --no-tags "$HEAD_REPO_URL" "$HEAD_REF:$HEAD_REF" --depth=150
          git switch "$HEAD_REF"

      - name: Check commit messages
        run: ./scripts/check-commit-messages.sh
        env:
          BASE_BRANCH_NAME: ${{ github.base_ref }}
