name: "[Check] Test Health"

permissions:
  contents: read

# run only if there are changes in suite or related libs paths - equal settings as PR e2e test job
on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "suite-native/**"
      - "suite-native-app/**"
      - "packages/connect*/**"
      - "packages/react-native-usb/**"
      # ignore unrelated github workflows config files
      - ".github/workflows/connect*"
      - ".github/workflows/suite-native*"
      - ".github/workflows/build-desktop*"
      - ".github/workflows/release*"
      - ".github/workflows/template*"
      - "**.md"
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      unquarantine:
        description: "Also unquarantine recovered tests, as the scheduled run does"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-test-health:
    name: Check test health & manage quarantine
    runs-on: ubuntu-latest
    # Only run in the canonical repository, not forks.
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-e2e-utils-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install
        with:
          focus: "@trezor/e2e-utils"

      - name: Check test health and manage quarantine
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          E2E_TEST_SLACK_QUARANTINE_BOT_WEBHOOK: ${{ secrets.E2E_TEST_SLACK_QUARANTINE_BOT_WEBHOOK }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          UNQUARANTINE_FLAG: ${{ (github.event_name == 'schedule' || inputs.unquarantine == true) && '--nightlyUnquarantine' || '' }}
        run: |
          yarn workspace @trezor/e2e-utils test-health $UNQUARANTINE_FLAG
