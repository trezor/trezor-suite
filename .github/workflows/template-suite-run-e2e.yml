name: "Reusable Run Playwright E2E Tests"
on:
  workflow_call:
    inputs:
      target:
        description: "Playwright target name. (web|desktop)"
        required: true
        type: string
      pw-config:
        description: "Path to the PW config to be used"
        required: true
        type: string
      base-url:
        description: "Base URL for E2E tests. Default: https://dev.suite.sldev.cz/suite-web/BRANCH_NAME/web/"
        default: ""
        required: false
        type: string
      containers:
        description: "Docker containers to pull"
        default: "trezor-user-env-unix bitcoin-regtest electrum-regtest quota-db suite-sync"
        required: false
        type: string
      test-group:
        description: "Test group for orchestration"
        required: true
        type: string
      fail-fast:
        description: "Cancel test run if number of tests fail (number | false)"
        default: "false"
        required: false
        type: string
      currents-project-id:
        description: "Currents project ID for reporting"
        required: true
        type: string
      currents-ci-build-id:
        description: "Custom CI build ID for Currents reporting, default is pr-run-TARGET-RUN_ID-RUN_ATTEMPT"
        required: false
        type: string
        default: "" # Will handle default logic in steps if empty, or just pass it explicitly from caller
      release-build:
        description: "Information for GitHub Reporter, only on Release workflows"
        required: false
        type: string
      run-reporter:
        description: "Flag to run GitHub Reporter, only on Release workflows"
        required: false
        type: string
      reporterWatchdog:
        description: "Reporter watchdog mode. When 'true', targets the sandbox GitHub Project and makes the test step non-blocking (a genuine synthetic failure must not red the job)."
        required: false
        default: "false"
        type: string
      enable-coverage:
        description: "Enable code coverage collection with Currents and upload the coverage map. Only works for web and requires instrumentation of the code."
        required: false
        default: "false"
        type: string
      spec-list:
        description: "Comma-separated list of test file paths to run (repo-root-relative, e.g. suite/e2e/tests/foo.spec.ts). When empty, all tests are run."
        required: false
        default: ""
        type: string
      download-artifact-name:
        description: "Name of the artifact to download (e.g. desktop app build)"
        required: false
        type: string
    secrets:
      currents-record-key:
        description: "Currents record key for reporting"
        required: true
      e2e-passphrase:
        description: "Passphrase for E2E tests"
        required: true
      e2e-passphrase-live:
        description: "Passphrase for Live E2E tests"
        required: false
      github-token:
        description: "GitHub token for GitHub Reporter, only on Release workflows"
        required: false
      trezor-bot-app-id:
        description: "App ID for Trezor Bot"
        required: false
      trezor-bot-private-key:
        description: "Private Key for Trezor Bot"
        required: false

jobs:
  run-e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Generate GitHub App token
        if: inputs.run-reporter == 'true'
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.trezor-bot-app-id }}
          private-key: ${{ secrets.trezor-bot-private-key }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Extract Branch Name
        id: extract_branch
        shell: bash
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-suite-e2e-${{ hashFiles('yarn.lock') }}

      - name: Cache Playwright Browsers
        id: playwright-cache
        if: inputs.target == 'web'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}

      - name: Download build artifact
        if: inputs.download-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.download-artifact-name }}
          path: ${{ github.workspace }}/artifact-download

      - name: Extract build artifact (desktop)
        if: inputs.download-artifact-name != '' && !contains(inputs.download-artifact-name, 'webextension')
        run: tar -xzf ${{ github.workspace }}/artifact-download/app-build.tar.gz -C ${{ github.workspace }}/packages/suite-desktop

      - name: Extract build artifact (webextension)
        if: inputs.download-artifact-name != '' && contains(inputs.download-artifact-name, 'webextension')
        shell: bash
        run: |
          rm -rf ${{ github.workspace }}/packages/connect-explorer/build-webextension
          mv ${{ github.workspace }}/artifact-download ${{ github.workspace }}/packages/connect-explorer/build-webextension

      - name: Install SafeDep PMG
        uses: safedep/pmg@26d5c0ad71fd0e5f48c3183c9c74d4b3eb7f57c8 # v0.19.1
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install PW Dependencies
        shell: bash
        run: |
          yarn workspaces focus @trezor/suite-e2e

      - name: Install Playwright Browsers
        if: inputs.target == 'web' && steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          yarn workspace @trezor/suite-e2e exec playwright install --with-deps

      - name: Install Playwright system dependencies
        if: inputs.target == 'web' && steps.playwright-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          yarn workspace @trezor/suite-e2e exec playwright install-deps

      - name: Build Message System Config
        shell: bash
        run: |
          # Playwright runtime may indirectly import the built config, and that would crash if message-system is not built
          yarn message-system-sign-config 1>/dev/null

      - name: Pull Docker Images
        shell: bash
        env:
          COMPOSE_FILE: ./docker/docker-compose.suite-ci-e2e.yml
        run: |
          docker compose pull --quiet ${{ inputs.containers }}

      - name: Run Playwright E2E Tests
        shell: bash
        # in reporter-watchdog mode a synthetic test fails on purpose; the separate verify job is the health verdict.
        continue-on-error: ${{ inputs.reporterWatchdog == 'true' }}
        env:
          COMPOSE_FILE: ./docker/docker-compose.suite-ci-e2e.yml
          GITHUB_ACTION: true
          REPORTER_WATCHDOG: ${{ inputs.reporterWatchdog }}
          CURRENTS_PROJECT_ID: ${{ inputs.currents-project-id }}
          CURRENTS_RECORD_KEY: ${{ secrets.currents-record-key }}
          CURRENTS_CI_BUILD_ID: ${{ inputs.currents-ci-build-id }}
          GH_BRANCH: ${{ env.branch }} # Used by Currents reporter
          PASSPHRASE: ${{ secrets.e2e-passphrase }}
          PASSPHRASE_LIVE: ${{ secrets.e2e-passphrase-live }}
          GITHUB_TOKEN: ${{ steps.trezor-bot-token.outputs.token || secrets.github-token || github.token }}
          RELEASE_BUILD: ${{ inputs.release-build }}
          RUN_GITHUB_REPORTER: ${{ inputs.run-reporter }} # Read by playwright-base.config.ts to enable the GitHub reporter
          ELECTRON_DISABLE_SANDBOX: 1
          PERF_REPORT_LABEL: "${{ inputs.target }} / group ${{ inputs.test-group }}"
          COLLECT_COVERAGE_MAP: ${{ inputs.enable-coverage == 'true' && 'true' || '' }}
          COVERAGE_MAP_DIR: ${{ github.workspace }}/coverage-map
        run: |
          if [[ -z "${{ inputs.base-url }}" ]]; then
            BASE_URL="https://dev.suite.sldev.cz/suite-web/${{ env.branch }}/web/"
          else
            BASE_URL="${{ inputs.base-url }}"
          fi
          export BASE_URL
          echo "Using BASE_URL: $BASE_URL"

          # Handle default for CURRENTS_CI_BUILD_ID if empty
          if [[ -z "${{ inputs.currents-ci-build-id }}" ]]; then
             export CURRENTS_CI_BUILD_ID="pr-run-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          fi

          if [[ "${{ inputs.enable-coverage }}" == "true" ]]; then
            COVERAGE_OPT="--pwc-coverage"
          else
            COVERAGE_OPT=""
          fi

          if [[ "${{ inputs.reporterWatchdog }}" == "true" ]]; then
            PW_CONFIG="./playwright-config/playwright-reporter-watchdog.config.ts"
          else
            PW_CONFIG="${{ inputs.pw-config }}"
          fi

          # Build spec filter args if a spec list was provided
          SPEC_ARGS=""
          PASS_WITH_NO_TESTS=""
          if [[ -n "${{ inputs.spec-list }}" ]]; then
            # Strip suite/e2e/ prefix (pwc-p CWD is suite/e2e/ via yarn workspace)
            # then convert comma-separated list to space-separated positional args
            RESOLVED_SPECS=$(echo "${{ inputs.spec-list }}" | tr ',' '\n' | sed 's|^suite/e2e/||')
            SPEC_ARGS=$(echo "$RESOLVED_SPECS" | tr '\n' ' ')
            echo "Running focused spec list: $SPEC_ARGS"

            # Guard: verify at least one resolved path exists before enabling --pass-with-no-tests.
            # If every path is missing (deleted, mistyped, or bad normalisation), fail fast
            # rather than silently running zero tests and exiting 0.
            FOUND_ANY=0
            while IFS= read -r spec; do
              [[ -z "$spec" ]] && continue
              if [[ -f "suite/e2e/$spec" ]]; then
                FOUND_ANY=1
                break
              fi
            done <<< "$RESOLVED_SPECS"

            if [[ "$FOUND_ANY" -eq 0 ]]; then
              echo "ERROR: spec-list was provided but none of the resolved paths exist on disk."
              echo "  spec-list: ${{ inputs.spec-list }}"
              echo "  Resolved:  $SPEC_ARGS"
              echo "Check for deleted files, typos, or normalisation issues in the upstream selector."
              exit 1
            fi

            # A focused spec list may not match every Playwright project's grep filter,
            # so allow projects that find zero tests to exit cleanly instead of failing.
            PASS_WITH_NO_TESTS="--pass-with-no-tests"
          fi

          # Start services
          docker compose up -d ${{ inputs.containers }}

          echo "Starting ${{ inputs.target }} Playwright tests with config $PW_CONFIG for test group ${{ inputs.test-group }}"

          # Currents orchestration is a two-step process since @currents/playwright v2:
          #   1. discover: list/select the tests (all test-selection flags live here)
          #   2. run: orchestrate the selected tests across machines (execution flags + CURRENTS_* env)
          DISCOVERY_FILE="$(mktemp)"

          yarn workspace @trezor/suite-e2e test:orchestrated:e2e discover \
            --pwc-discovery-file "$DISCOVERY_FILE" \
            --config=$PW_CONFIG \
            $PASS_WITH_NO_TESTS \
            $SPEC_ARGS

          if grep -qE "Total: 0 tests" "$DISCOVERY_FILE"; then
            echo "Discovery selected 0 tests for the focused spec list - skipping orchestration run."
            exit 0
          fi

          yarn workspace @trezor/suite-e2e test:orchestrated:e2e run \
            --pwc-discovery-file "$DISCOVERY_FILE" \
            --config=$PW_CONFIG \
            --pwc-cancel-after-failures ${{ inputs.fail-fast }} \
            --pwc-disable-test-tags \
            --pwc-skip-reporter-injection \
            $COVERAGE_OPT

      - name: Extract and Upload Logs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-test-logs
        with:
          target: ${{ inputs.target }}
          test-group: ${{ inputs.test-group }}

      - name: Upload per-test coverage map
        if: inputs.enable-coverage == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-map-group-${{ inputs.test-group }}
          path: coverage-map/
          if-no-files-found: warn

      - name: Docker Compose Down
        shell: bash
        env:
          COMPOSE_FILE: ./docker/docker-compose.suite-ci-e2e.yml
        run: docker compose down
