name: "Reusable Build Suite Web for E2E tests"
on:
  workflow_call:
    inputs:
      instrument-code:
        description: "Enables Istanbul plugin for Babel to instrument the code for coverage reporting"
        required: false
        default: "false"
        type: string

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_GHACTIONS_TOKEN }}
    permissions:
      id-token: write # required for aws-actions/configure-aws-credentials
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: "arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy"
          aws-region: "eu-central-1"

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-suite-web-e2e-${{ hashFiles('yarn.lock') }}

      - name: Install SafeDep PMG
        uses: safedep/pmg@26d5c0ad71fd0e5f48c3183c9c74d4b3eb7f57c8 # v0.19.1
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Disable Yarn hardened mode
        shell: bash
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml

      - name: Install dependencies
        shell: bash
        run: yarn workspaces focus @trezor/suite-web @trezor/suite-data @trezor/suite-build @suite-common/message-system

      - name: Build Suite Web
        shell: bash
        env:
          ASSET_PREFIX: /suite-web/${{ env.branch }}/web
          DESKTOP_APP_NAME: "Trezor-Suite"
          INSTRUMENT_CODE: ${{ inputs.instrument-code }}
        run: |
          yarn message-system-sign-config
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/suite-web build

      - name: Upload Suite Web to S3
        shell: bash
        env:
          DEPLOY_PATH: s3://dev.suite.sldev.cz/suite-web/${{ env.branch }}
        run: |
          aws s3 sync --delete ./packages/suite-web/build ${DEPLOY_PATH}/web
