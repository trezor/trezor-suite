name: "[Test] blockchain-link e2e"

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "packages/blockchain-link/**"
      - "packages/blockchain-link-utils/**"
      - "packages/blockchain-link-types/**"
      - "packages/e2e-utils/src/fixtures/blockbook.ts"
      - "packages/e2e-utils/src/mocks/backendServer.ts"
      # dependencies of packages/blockchain-link
      - "packages/utxo-lib/**"
      - "docker/docker-blockchain-link-test.sh"
      - ".github/workflows/test-blockchain-link.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Restore develop Yarn cache
        uses: ./.github/actions/restore-yarn-cache

      - name: Install SafeDep PMG
        uses: safedep/pmg@ad7d74efddce4ed5c8b161a11945bd6e55be266c # v0.33.0
        continue-on-error: true
        with:
          version: v0.32.0
          config-file: .github/pmg-config.yml
      - name: Install dependencies
        run: yarn --immutable

      - name: Build dependencies
        run: yarn build:libs

      - name: Build @trezor/blockchain-link workers
        run: |
          yarn workspace @trezor/blockchain-link build:workers

      - name: Run E2E tests
        run: ./docker/docker-blockchain-link-test.sh
