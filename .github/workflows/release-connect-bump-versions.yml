name: "[Release] connect bump versions"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      semver:
        type: choice
        description: semver
        options:
          - patch
          - prepatch
          - minor
          - preminor
          - prerelease

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bump-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ steps.trezor-bot-token.outputs.token }}
          # Fetch all commit history because Script connect-bump-versions.ts needs them to produce CHANGELOG for packages.
          fetch-depth: 0
          # `ref` makes sure that we checkout the branch we are running workflow on.
          ref: ${{ github.head_ref }}

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@ee9c6ccfb8c7cc31280fb91f1fa5031ec1c6ff18 # v0.34.0
        continue-on-error: true
        with:
          version: v0.32.0
          config-file: .github/pmg-config.yml
      - name: Install dependencies
        run: yarn install

      - name: Setup Git config
        run: |
          git config --global user.name "trezor-ci"
          git config --global user.email "${{ secrets.TREZOR_BOT_EMAIL }}"

      - name: Check dependencies to update
        env:
          GITHUB_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          SEMVER: ${{ github.event.inputs.semver }}
        run: |
          yarn tsx ./scripts/ci/connect-bump-versions.ts "$SEMVER"
