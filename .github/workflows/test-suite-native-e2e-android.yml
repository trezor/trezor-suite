name: "[Test] suite-native Android E2E"

permissions:
  id-token: write # for fetching the OIDC token (needed for aws s3 actions)
  contents: read # read attached artifacts from tests
  actions: write # upload/download artifacts

on:
  pull_request:
    paths:
      - "suite-native/**"
      - "suite-common/**"
      - "packages/connect/**"
      - "packages/connect-core/**"
      - "jest.config.native.js"
      - "docker/docker-compose.suite-native-ci.yml"
      - ".github/workflows/test-suite-native-e2e-android.yml"
      - ".github/workflows/template-suite-native-e2e-android.yml"
      - ".github/workflows/template-suite-native-prepare-test-app-android.yml"
      - "!**.md"
  push:
    branches:
      - release-native/*
  workflow_dispatch:
    inputs:
      publish_results_to_github:
        description: "Publish test report to GitHub Project"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-previous-runs:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check-previous-runs.outputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      # Any earlier green run on a branch skips the tests, but each refreshed candidate digest needs a full run.
      - name: Check previous runs
        if: github.head_ref != 'chore/update-native-trezor-user-env'
        id: check-previous-runs
        uses: "./.github/actions/check-previous-test-runs"
        with:
          github_token: ${{ steps.trezor-bot-token.outputs.token }}
          pr_branch: ${{ github.head_ref }}
          pr_created: ${{ github.event.pull_request.created_at }}
          repo: ${{ github.repository }}
          workflow_name: ${{ github.workflow }}
          run_attempt: ${{ github.run_attempt }}

  prepare_android_test_app:
    if: github.repository == 'trezor/trezor-suite' && needs.check-previous-runs.outputs.skip_tests != 'true'
    needs: check-previous-runs
    uses: ./.github/workflows/template-suite-native-prepare-test-app-android.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  run_android_e2e_tests:
    if: github.repository == 'trezor/trezor-suite' && needs.check-previous-runs.outputs.skip_tests != 'true'
    uses: ./.github/workflows/template-suite-native-e2e-android.yml
    needs: [prepare_android_test_app, check-previous-runs]
    with:
      publish_results_to_github: ${{ inputs.publish_results_to_github == true }}
      runner_config: ${{ github.head_ref == 'chore/update-native-trezor-user-env' && 'e2e/trezorDetoxRunner/config/runner-android-release-nightly.config.js' || 'e2e/trezorDetoxRunner/config/runner-android-release.config.js' }}
      currents_tags: ${{ github.head_ref == 'chore/update-native-trezor-user-env' && 'trezor-user-env-upgrade' || '' }}
    secrets:
      TREZOR_BOT_APP_ID: ${{ secrets.TREZOR_BOT_APP_ID }}
      TREZOR_BOT_PRIVATE_KEY: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      E2E_TEST_PASSPHRASE: ${{ secrets.E2E_TEST_PASSPHRASE }}

  # Candidates opened by update-trezor-user-env.yml become ready for review once the full suite passes.
  finalize_trezor_user_env_candidate:
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/update-native-trezor-user-env' }}
    needs: run_android_e2e_tests
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        if: needs.run_android_e2e_tests.result == 'success'
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Mark candidate ready for review
        if: needs.run_android_e2e_tests.result == 'success'
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr ready "$PR_NUMBER"

      - name: Notify candidate failure to Slack
        if: needs.run_android_e2e_tests.result != 'success'
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          CURRENTS_PROJECT_ID: iUe1Y4
          CURRENTS_CI_BUILD_ID: pr-run-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_E2E_WEBHOOK }}
        run: |
          CURRENTS_RUN_ID=$(curl -sf -H "Authorization: Bearer $CURRENTS_API_KEY" \
            "https://api.currents.dev/v1/runs/find?projectId=$CURRENTS_PROJECT_ID&ciBuildId=$CURRENTS_CI_BUILD_ID" \
            | jq -r '.data.runId // empty') || true
          if [ -n "$CURRENTS_RUN_ID" ]; then
            CURRENTS_RUN_URL="https://app.currents.dev/run/$CURRENTS_RUN_ID"
          else
            CURRENTS_RUN_URL="https://app.currents.dev/projects/$CURRENTS_PROJECT_ID/runs"
          fi
          jq -n --arg text "trezor-user-env candidate failed Android E2E tests: <$PR_URL|PR> <$GITHUB_RUN_URL|Github run> <$CURRENTS_RUN_URL|Currents run>" '{text: $text}' \
            | curl -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
