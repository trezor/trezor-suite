name: "[Test] suite-native Android E2E"

permissions:
  id-token: write # for fetching the OIDC token (needed for aws s3 actions)
  contents: read # read attached artifacts from tests
  actions: write # upload/download artifacts

on:
  pull_request:
    paths:
      - "suite-native/**"
      - "suite-common/**"
      - "packages/connect/**"
      - "packages/connect-core/**"
      - "jest.config.native.js"
      - ".github/workflows/test-suite-native-e2e-android.yml"
      - ".github/workflows/template-suite-native-e2e-android.yml"
      - ".github/workflows/template-suite-native-prepare-test-app-android.yml"
      - "!**.md"
  push:
    branches:
      - release-native/*
  workflow_dispatch:
    inputs:
      publish_results_to_github:
        description: "Publish test report to GitHub Project"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-previous-runs:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check-previous-runs.outputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      - name: Check previous runs
        id: check-previous-runs
        uses: "./.github/actions/check-previous-test-runs"
        with:
          github_token: ${{ steps.trezor-bot-token.outputs.token }}
          pr_branch: ${{ github.head_ref }}
          pr_created: ${{ github.event.pull_request.created_at }}
          repo: ${{ github.repository }}
          workflow_name: ${{ github.workflow }}
          run_attempt: ${{ github.run_attempt }}

  prepare_android_test_app:
    if: github.repository == 'trezor/trezor-suite' && needs.check-previous-runs.outputs.skip_tests != 'true'
    needs: check-previous-runs
    uses: ./.github/workflows/template-suite-native-prepare-test-app-android.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  run_android_e2e_tests:
    if: github.repository == 'trezor/trezor-suite' && needs.check-previous-runs.outputs.skip_tests != 'true'
    uses: ./.github/workflows/template-suite-native-e2e-android.yml
    needs: [prepare_android_test_app, check-previous-runs]
    with:
      publish_results_to_github: ${{ inputs.publish_results_to_github == true }}
    secrets:
      TREZOR_BOT_APP_ID: ${{ secrets.TREZOR_BOT_APP_ID }}
      TREZOR_BOT_PRIVATE_KEY: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      E2E_TEST_PASSPHRASE: ${{ secrets.E2E_TEST_PASSPHRASE }}

  # Publishes the performance history through the shared store in @trezor/perf-e2e: every shard's
  # report as a plain object in the bucket CI already writes to, plus one index line per screen.
  # The web and desktop Lighthouse pipelines write the same envelope under their own surface. There
  # is no server and no database — the objects are world-readable, so reading them back locally
  # needs no credentials at all. See docs/tests/suite-native-e2e-performance.md.
  #
  # One job publishes a whole run, so nothing races: the shards only upload their artifacts. The
  # step is informative — it never fails, and a broken upload costs the history, not the tests.
  publish_performance_history:
    name: Publish performance history
    # Fork pull requests are issued no OIDC token, so they could never assume the role: they are
    # excluded rather than left to fail the step. head.repo can be null when the fork was deleted,
    # so the comparison fails closed.
    if: ${{ !cancelled() && github.repository == 'trezor/trezor-suite' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: run_android_e2e_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # to assume the dev-deploy role
      contents: read
    # Serialize the writers of the rolling branch index: a push and a re-run of the same branch
    # would otherwise read-modify-write the same object at once.
    concurrency:
      group: publish-performance-history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Install dependencies
        run: yarn workspaces focus @suite-native/app

      - name: Download performance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: android-perf-report-*
          path: perf-artifacts

      - name: Build the upload bundle
        env:
          PERF_ARTIFACTS_DIR: ${{ github.workspace }}/perf-artifacts
          PERF_BUNDLE_DIR: ${{ github.workspace }}/perf-upload
          PERF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PERF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PERF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Only a run on the base branch seals the baseline later runs are compared against.
          PERF_SEAL_BASELINE: ${{ github.event_name != 'pull_request' }}
        run: yarn workspace @suite-native/app perf:publish

      - name: Configure AWS credentials
        if: ${{ hashFiles('perf-upload/**') != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy
          aws-region: eu-central-1

      # Two passes, and the order is the point: the artifacts go up first, then the index lines and
      # the baseline that reference them. A reader therefore never meets a line pointing at an
      # object that is not there yet — the guarantee a Lighthouse server gives by sealing a build.
      - name: Upload the bundle
        if: ${{ hashFiles('perf-upload/**') != '' }}
        env:
          BUNDLE: ${{ github.workspace }}/perf-upload
          DESTINATION: s3://dev.suite.sldev.cz/e2e/perf/v1
        run: |
          set -euo pipefail
          if [ -d "$BUNDLE/runs" ]; then
            aws s3 cp --recursive --no-progress "$BUNDLE/runs/" "$DESTINATION/runs/"
          fi
          aws s3 cp --recursive --no-progress --exclude "runs/*" "$BUNDLE/" "$DESTINATION/"
