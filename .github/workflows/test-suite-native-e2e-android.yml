name: "[Test] suite-native Android E2E"

permissions:
  id-token: write # for fetching the OIDC token (needed for aws s3 actions)
  contents: read # read attached artifacts from tests
  actions: write # upload/download artifacts

on:
  pull_request:
    paths:
      - "suite-native/**"
      - "suite-common/**"
      - "packages/connect/**"
      - "packages/connect-core/**"
      - "jest.config.native.js"
      - ".github/workflows/test-suite-native-e2e-android.yml"
      - ".github/workflows/template-suite-native-e2e-android.yml"
      - ".github/workflows/template-suite-native-prepare-test-app-android.yml"
      - "!**.md"
  push:
    branches:
      - release-native/*
  workflow_dispatch:
    inputs:
      publish_results_to_github:
        description: "Publish test report to GitHub Project"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-previous-runs:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check-previous-runs.outputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      - name: Check previous runs
        id: check-previous-runs
        uses: "./.github/actions/check-previous-test-runs"
        with:
          github_token: ${{ steps.trezor-bot-token.outputs.token }}
          pr_branch: ${{ github.head_ref }}
          pr_created: ${{ github.event.pull_request.created_at }}
          repo: ${{ github.repository }}
          workflow_name: ${{ github.workflow }}
          run_attempt: ${{ github.run_attempt }}

  prepare_android_test_app:
    if: github.repository == 'trezor/trezor-suite' && needs.check-previous-runs.outputs.skip_tests != 'true'
    needs: check-previous-runs
    uses: ./.github/workflows/template-suite-native-prepare-test-app-android.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  run_android_e2e_tests:
    if: github.repository == 'trezor/trezor-suite' && needs.check-previous-runs.outputs.skip_tests != 'true'
    uses: ./.github/workflows/template-suite-native-e2e-android.yml
    needs: [prepare_android_test_app, check-previous-runs]
    with:
      publish_results_to_github: ${{ inputs.publish_results_to_github == true }}
    secrets:
      TREZOR_BOT_APP_ID: ${{ secrets.TREZOR_BOT_APP_ID }}
      TREZOR_BOT_PRIVATE_KEY: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      E2E_TEST_PASSPHRASE: ${{ secrets.E2E_TEST_PASSPHRASE }}

  # Publishes this run's numbers to the S3 history. See docs/tests/suite-native-e2e-performance.md.
  publish_performance_history:
    # Fork pull requests are issued no OIDC token, so they could never assume the role. head.repo
    # can be null when the fork was deleted, so the comparison fails closed.
    if: ${{ !cancelled() && github.repository == 'trezor/trezor-suite' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: run_android_e2e_tests
    permissions:
      id-token: write # to assume the dev-deploy role
      contents: read
    # Serialize the writers of the rolling branch index. Native keys apart from web so the two
    # never wait on each other.
    concurrency:
      group: publish-performance-history-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/template-publish-performance-history.yml
    with:
      workspace: "@suite-native/app"
      artifact-pattern: android-perf-report-*
      # Invoked directly rather than through a script in the app's package.json: that scripts block
      # is an Expo fingerprint input, and an entry of ours there costs every run on this branch the
      # cached-APK path and a ~50 minute native rebuild.
      publish-command: yarn workspace @suite-native/app exec tsx e2e/performance/publish.ts
