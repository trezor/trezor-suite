name: "[TMP] Android emulator GPU modes (Quickstep ANR)"

# Temporary experiment, not meant to be merged. See .github/tmp-emulator-boot-race.sh.
on:
  push:
    branches:
      - tmp/quickstep-anr-gpu-modes

permissions: {}

jobs:
  gpu_modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        REPLICA: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Same background services as the E2E job runs next to the emulator.
      - name: Run trezor-user-env
        env:
          COMPOSE_FILE: ./docker/docker-compose.suite-native-ci.yml
        run: |
          docker compose pull trezor-user-env-unix trezor-user-env-regtest quota-db suite-sync
          docker compose up --detach trezor-user-env-unix trezor-user-env-regtest quota-db suite-sync

      - name: Enable Android emulator KVM optimalization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Repeat cold boots
        env:
          REPLICA: ${{ matrix.REPLICA }}
          BOOT_ATTEMPTS: 90
          VARIANTS_SPEC: "37.2.13 immediate lavapipe;37.3.10 immediate lavapipe;37.3.10 immediate swiftshader_indirect;37.3.10 immediate lavapipe ANGLE_PREFERRED_DEVICE=llvmpipe;37.3.10 immediate lavapipe ANGLE_DEFAULT_PLATFORM=vulkan;37.3.10 immediate swangle_indirect;37.2.13 immediate swiftshader_indirect"
          OUT: ${{ runner.temp }}/boot-race
        run: bash .github/tmp-emulator-boot-race.sh

      - name: Store results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpu-modes-${{ matrix.REPLICA }}
          path: ${{ runner.temp }}/boot-race
          retention-days: 7
