name: "[Release] suite-native develop"

on:
  push:
    branches:
      - develop
    paths:
      - "suite-native/**"
      - "suite-common/**"
      - "!**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private'
    name: Install and build
    environment: develop-suite-native
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install libs
        run: |
          yarn workspaces focus @suite-native/app
      - name: Build on EAS Android
        run: eas build
          --platform android
          --profile develop
          --non-interactive
          --no-wait
          --message ${{ github.sha }}
        working-directory: suite-native/app
      - name: Build on EAS iOS
        run: eas build
          --platform ios
          --profile develop
          --non-interactive
          --auto-submit
          --no-wait
          --message ${{ github.sha }}
        working-directory: suite-native/app
