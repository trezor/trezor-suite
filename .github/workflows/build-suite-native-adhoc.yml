name: "[Build] suite-native adhoc"

on:
  workflow_dispatch:
    inputs:
      PLATFORM:
        type: choice
        options:
          - all
          - android
          - ios
        description: Select platform to run build
        required: true

jobs:
  adhoc-build:
    if: github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private'
    name: EAS adhoc build
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EXPO_PUBLIC_ENVIRONMENT: preview
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Print selected platform
        run: |
          echo "Selected platform: ${{ github.event.inputs.PLATFORM }}"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_DEVELOP }}
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        continue-on-error: true
        with:
          mode: firewall-free
          job-summary: errors
          firewall-version: 1.11.0
      - name: Install libs
        run: |
          $(command -v sfw > /dev/null && echo sfw --verbose) yarn workspaces focus @suite-native/app
      - name: Trigger adhoc build Android
        working-directory: suite-native/app
        if: ${{ github.event.inputs.PLATFORM == 'android' || github.event.inputs.PLATFORM == 'all' }}
        run: |
          eas build --profile adhoc \
            -p android \
            --non-interactive \
            --no-wait \
            --freeze-credentials \
            --message ${{ github.sha }} \
            2>&1 | sed -E 's/UDID: [A-Za-z0-9-]+/UDID: [REDACTED]/g' # remove UDIDs from output
      - name: Trigger adhoc build iOS
        working-directory: suite-native/app
        if: ${{ github.event.inputs.PLATFORM == 'ios' || github.event.inputs.PLATFORM == 'all' }}
        run: |
          eas build --profile adhoc \
            -p ios \
            --auto-submit \
            --non-interactive \
            --no-wait \
            --freeze-credentials \
            --message ${{ github.sha }} \
            2>&1 | sed -E 's/UDID: [A-Za-z0-9-]+/UDID: [REDACTED]/g' # remove UDIDs from output
