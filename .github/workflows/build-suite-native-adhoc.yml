name: "[Build] suite-native adhoc"

on:
  workflow_dispatch:
    inputs:
      PLATFORM:
        type: choice
        options:
          - all
          - android
          - ios
        description: Select platform to run build
        required: true

jobs:
  adhoc-build:
    if: github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private'
    name: EAS adhoc build
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EXPO_PUBLIC_ENVIRONMENT: preview
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Print selected platform
        run: |
          echo "Selected platform: ${{ github.event.inputs.PLATFORM }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_DEVELOP }}
      - name: Install SafeDep PMG
        uses: safedep/pmg@64d9f1409273c9a5e36e5d7b2b883be099f1ea60 # v0.27.0
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install libs
        run: |
          yarn workspaces focus @suite-native/app
      - name: Trigger adhoc build Android
        working-directory: suite-native/app
        if: ${{ github.event.inputs.PLATFORM == 'android' || github.event.inputs.PLATFORM == 'all' }}
        run: |
          eas build --profile adhoc \
            -p android \
            --non-interactive \
            --no-wait \
            --freeze-credentials \
            --message ${{ github.sha }} \
            2>&1 | sed -E 's/UDID: [A-Za-z0-9-]+/UDID: [REDACTED]/g' # remove UDIDs from output
      - name: Trigger adhoc build iOS
        working-directory: suite-native/app
        if: ${{ github.event.inputs.PLATFORM == 'ios' || github.event.inputs.PLATFORM == 'all' }}
        run: |
          eas build --profile adhoc \
            -p ios \
            --auto-submit \
            --non-interactive \
            --no-wait \
            --freeze-credentials \
            --message ${{ github.sha }} \
            2>&1 | sed -E 's/UDID: [A-Za-z0-9-]+/UDID: [REDACTED]/g' # remove UDIDs from output
