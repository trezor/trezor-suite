name: "[Build] suite-native adhoc"

on:
  workflow_dispatch:
    inputs:
      PLATFORM:
        type: choice
        options:
          - all
          - android
          - ios
        description: Select platform to run build
        required: true
      IOS_TARGET:
        type: choice
        options:
          - device
          - simulator
        default: device
        description: Select iOS build target (simulator builds are not submitted to TestFlight)
        required: true

jobs:
  adhoc-build:
    if: github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private'
    name: EAS adhoc build
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EXPO_PUBLIC_ENVIRONMENT: preview
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Print selected platform
        run: |
          echo "Selected platform: ${{ github.event.inputs.PLATFORM }}"
          echo "Selected iOS target: ${{ github.event.inputs.IOS_TARGET }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".nvmrc"
      - name: Restore develop Yarn cache
        uses: ./.github/actions/restore-yarn-cache
      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_DEVELOP }}
      - name: Install SafeDep PMG
        uses: safedep/pmg@ad7d74efddce4ed5c8b161a11945bd6e55be266c # v0.33.0
        continue-on-error: true
        with:
          version: v0.32.0
          config-file: .github/pmg-config.yml
      - name: Install libs
        run: |
          yarn workspaces focus @suite-native/app
      - name: Trigger adhoc build Android
        working-directory: suite-native/app
        if: ${{ github.event.inputs.PLATFORM == 'android' || github.event.inputs.PLATFORM == 'all' }}
        run: |
          eas build --profile adhoc \
            -p android \
            --non-interactive \
            --no-wait \
            --freeze-credentials \
            --message ${{ github.sha }} \
            2>&1 | sed -E 's/UDID: [A-Za-z0-9-]+/UDID: [REDACTED]/g' # remove UDIDs from output
      - name: Trigger adhoc build iOS
        working-directory: suite-native/app
        if: ${{ (github.event.inputs.PLATFORM == 'ios' || github.event.inputs.PLATFORM == 'all') && github.event.inputs.IOS_TARGET != 'simulator' }}
        run: |
          eas build --profile adhoc \
            -p ios \
            --auto-submit \
            --non-interactive \
            --no-wait \
            --freeze-credentials \
            --message ${{ github.sha }} \
            2>&1 | sed -E 's/UDID: [A-Za-z0-9-]+/UDID: [REDACTED]/g' # remove UDIDs from output
      - name: Trigger adhoc build iOS simulator
        working-directory: suite-native/app
        if: ${{ (github.event.inputs.PLATFORM == 'ios' || github.event.inputs.PLATFORM == 'all') && github.event.inputs.IOS_TARGET == 'simulator' }}
        run: |
          eas build --profile adhoc-simulator \
            -p ios \
            --non-interactive \
            --no-wait \
            --message ${{ github.sha }}
