name: "[Build] t1-escape-app"

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-t1-escape-app:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy
          aws-region: eu-central-1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Install SafeDep PMG
        uses: safedep/pmg@0d4f89121c773b0009cc2f2dfb578d03603263f2 # v0.29.1
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install dependencies
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml
          yarn workspaces focus @suite/t1-escape-app

      - name: Build t1-escape-app
        env:
          BASE_PATH: /t1-escape-app/
        run: yarn workspace @suite/t1-escape-app build

      - name: Upload t1-escape-app to dev.suite.sldev.cz
        env:
          T1_ESCAPE_APP_DEPLOY_PATH: s3://dev.suite.sldev.cz/t1-escape-app
        run: |
          aws s3 sync --delete ./suite/t1-escape-app/dist ${T1_ESCAPE_APP_DEPLOY_PATH}
