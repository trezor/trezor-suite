name: "[Build] t1-escape-app"
# Builds the old Trezor One migration page and deploys it to dev.suite.sldev.cz/t1-escape-app/<branch>/,
# the same way suite-web is deployed. On that origin the bridge refuses to open HID devices,
# so the deployed copy is good for looking at the screens only.

permissions:
  id-token: write # for fetching the OIDC token
  contents: read # for actions/checkout

on:
  push:
    branches:
      - develop
    paths:
      - "suite/t1-escape-app/**"
      - ".github/workflows/build-t1-escape-app.yml"
  pull_request:
    paths:
      - "suite/t1-escape-app/**"
      - ".github/workflows/build-t1-escape-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DEV_SERVER_URL: "https://dev.suite.sldev.cz"

jobs:
  build-t1-escape-app:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy
          aws-region: eu-central-1

      - name: Extract branch name
        id: extract_branch
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Install SafeDep PMG
        uses: safedep/pmg@0d4f89121c773b0009cc2f2dfb578d03603263f2 # v0.29.1
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install dependencies
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml
          yarn workspaces focus @suite/t1-escape-app

      - name: Build t1-escape-app
        env:
          BASE_PATH: /t1-escape-app/${{ steps.extract_branch.outputs.branch }}/
        run: yarn workspace @suite/t1-escape-app build

      - name: Upload t1-escape-app to dev.suite.sldev.cz
        env:
          DEPLOY_PATH: s3://dev.suite.sldev.cz/t1-escape-app/${{ steps.extract_branch.outputs.branch }}
        run: |
          aws s3 sync --delete ./suite/t1-escape-app/dist ${DEPLOY_PATH}
          echo "Deployed to ${DEV_SERVER_URL}/t1-escape-app/${{ steps.extract_branch.outputs.branch }}/" >> $GITHUB_STEP_SUMMARY
