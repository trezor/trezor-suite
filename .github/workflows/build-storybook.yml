name: "[Build] components storybook"

permissions:
  id-token: write # for fetching the OIDC token
  contents: read # for actions/checkout

# run only once a day
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  DEV_SERVER_URL: "https://dev.suite.sldev.cz"

jobs:
  build-storybook:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy
          aws-region: eu-central-1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".nvmrc"
      - name: Restore develop Yarn cache
        uses: ./.github/actions/restore-yarn-cache
      - name: Install SafeDep PMG
        uses: safedep/pmg@ee9c6ccfb8c7cc31280fb91f1fa5031ec1c6ff18 # v0.34.0
        continue-on-error: true
        with:
          version: v0.32.0
          config-file: .github/pmg-config.yml
      - name: Install dependencies
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml
          yarn install --immutable

      - name: Build storybook
        env:
          ASSET_PREFIX: /components/develop
        run: |
          yarn workspace @trezor/components storybook-build
      - name: Build Suite storybook
        env:
          ASSET_PREFIX: /product-components/develop
        run: |
          yarn workspace @suite-app/storybook storybook-build

      - name: Upload suite storybook to dev.suite.sldev.cz
        env:
          COMPONENTS_DEPLOY_PATH: s3://dev.suite.sldev.cz/components/develop
          PRODUCT_COMPONENTS_DEPLOY_PATH: s3://dev.suite.sldev.cz/product-components/develop
        run: |
          aws s3 sync --delete ./packages/components/.build-storybook ${COMPONENTS_DEPLOY_PATH}
          aws s3 sync --delete ./suite-app/storybook/.build-storybook ${PRODUCT_COMPONENTS_DEPLOY_PATH}
