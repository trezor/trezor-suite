name: "[Chore] Clean closed PR caches"

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: closed-pr-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      # Never run PR-controlled code with the cache deletion token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete caches belonging to closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REPOSITORY: ${{ github.repository }}
          CACHE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CACHE_DELETE: "true"
        run: bash .github/actions/closed-pr-cache-cleanup/cleanup.sh
