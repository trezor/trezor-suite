name: "[Chore] Clean closed PR caches"

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: closed-pr-cache-cleanup-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Fork and Dependabot runs receive a read-only token.
    if: >-
      github.repository == 'trezor/trezor-suite' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      # Never run PR-controlled code with the cache deletion token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete caches belonging to closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REPOSITORY: ${{ github.repository }}
          CACHE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CACHE_DELETE: "true"
        run: bash .github/actions/closed-pr-cache-cleanup/cleanup.sh
