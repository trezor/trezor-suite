name: "[Build] suite native storybook"

permissions:
  id-token: write # for fetching the OIDC token
  contents: read # for actions/checkout

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "suite-native/storybook/**"
      - "suite-native/**/*.story.*"
  pull_request:
    paths:
      - .github/workflows/build-storybook-native.yml

jobs:
  build-storybook:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy
          aws-region: eu-central-1
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Setup node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules/${{ github.ref }}/${{github.run_id}}

      - name: Install SafeDep PMG
        uses: safedep/pmg@64d9f1409273c9a5e36e5d7b2b883be099f1ea60 # v0.27.0
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install Yarn dependencies
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml
          yarn install

      - name: Build storybook
        working-directory: ./suite-native/storybook
        run: |
          yarn storybook:web:build

      - name: Upload suite native storybook to dev.suite.sldev.cz
        working-directory: ./suite-native/storybook
        env:
          COMPONENTS_DEPLOY_PATH: s3://dev.suite.sldev.cz/suite-mobile/components/develop
        run: |
          aws s3 sync --delete .build-storybook ${COMPONENTS_DEPLOY_PATH}
