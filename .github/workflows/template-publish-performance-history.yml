name: "Reusable Publish Performance History"

# Publishes one run's performance history to S3. See docs/tests/perf-history.md.
#
# One job per run, so the shards only upload artifacts and nothing races. Informative throughout: a
# broken upload costs the history, never the tests.
#
# The caller owns `needs`, `if`, `permissions` and `concurrency` — a job that calls a reusable
# workflow may set those, but not `timeout-minutes`, which is why that one is an input.
on:
  workflow_call:
    inputs:
      workspace:
        description: "Yarn workspace to focus before publishing."
        required: true
        type: string
      artifact-pattern:
        description: "Pattern matching the shards' uploaded performance artifacts."
        required: true
        type: string
      publish-command:
        description: "Command that turns the downloaded artifacts into an upload bundle."
        required: true
        type: string
      timeout-minutes:
        description: "Job timeout."
        required: false
        default: 10
        type: number

jobs:
  publish:
    name: Publish performance history
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Install dependencies
        run: yarn workspaces focus ${{ inputs.workspace }}

      - name: Download performance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: perf-artifacts

      - name: Build the upload bundle
        env:
          PERF_ARTIFACTS_DIR: ${{ github.workspace }}/perf-artifacts
          PERF_BUNDLE_DIR: ${{ github.workspace }}/perf-upload
          PERF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PERF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PERF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Only a run on the base branch seals the baseline later runs are compared against.
          PERF_SEAL_BASELINE: ${{ github.event_name != 'pull_request' }}
        run: ${{ inputs.publish-command }}

      - name: Configure AWS credentials
        if: ${{ hashFiles('perf-upload/**') != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy
          aws-region: eu-central-1

      # Order matters: artifacts first, then the index lines and baseline that reference them, so a
      # reader never meets a line pointing at an object that is not there yet.
      - name: Upload the bundle
        if: ${{ hashFiles('perf-upload/**') != '' }}
        env:
          BUNDLE: ${{ github.workspace }}/perf-upload
          DESTINATION: s3://dev.suite.sldev.cz/e2e/perf/v1
        run: |
          set -euo pipefail
          if [ -d "$BUNDLE/runs" ]; then
            aws s3 cp --recursive --no-progress "$BUNDLE/runs/" "$DESTINATION/runs/"
          fi
          aws s3 cp --recursive --no-progress --exclude "runs/*" "$BUNDLE/" "$DESTINATION/"

      # Refreshed with the data so the page never drifts from the shape of the rows it renders.
      - name: Publish the dashboard
        if: ${{ hashFiles('perf-upload/**') != '' }}
        run: |
          aws s3 cp --no-progress \
            packages/perf-e2e/dashboard/index.html \
            "s3://dev.suite.sldev.cz/e2e/perf/v1/dashboard/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0"
