name: pages

# Publishes the static site in site/ to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Note: GitHub Pages on a *private* repo requires a paid plan; for a free,
# public "verify it yourself" project make the repo public.
on:
    push:
        branches: [main]
        paths: ['site/**', '.github/workflows/pages.yml']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site
            - id: deployment
              uses: actions/deploy-pages@v4
