name: "[Test] Nightly Suite Fix Agent"

on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-e2e-utils-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn workspaces focus @trezor/e2e-utils

      - name: Install Playwright trace skill
        run: yarn workspace @trezor/e2e-utils exec playwright trace install-skill

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: "arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy"
          aws-region: "eu-central-1"

      - name: Download known-failures ledger from S3
        run: |
          aws s3 cp "s3://dev.suite.sldev.cz/e2e/fix-agent/ledger.json" \
            "${{ github.workspace }}/ledger.json" || echo "No existing ledger — starting fresh."

      - name: Run analysis agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: yarn workspace @trezor/e2e-utils fix-bot:analyze

      - name: Store token usage record to S3
        if: always()
        run: |
          if [ -f /tmp/llm-token-usage.json ]; then
            aws s3api put-object \
              --bucket dev.suite.sldev.cz \
              --key "coverage/e2e/llm-usage/runs/${{ github.run_id }}_AnalyzerAgent.json" \
              --body /tmp/llm-token-usage.json \
              --content-type application/json \
              --cache-control "no-cache, max-age=0"
            echo "Token usage record stored."
          else
            echo "No token usage file found, skipping."
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fix-agent-report
          path: packages/e2e-utils/src/fixBot/reports/
          if-no-files-found: error

      - name: Upload analyze cost artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slack-analyze-cost
          path: /tmp/llm-token-usage.json
          if-no-files-found: warn

  prepare-matrix:
    needs: [analyze]
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-tasks: ${{ steps.set-matrix.outputs.has-tasks }}
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fix-agent-report
          path: report-download/

      - name: Validate report
        run: |
          if ! jq -e 'all(.fixTasks[]; (.id | type == "string" and test("^fix-[0-9]{3}$") and (test("[\\r\\n]") | not)) and (.branch | type == "string" and test("^fix/nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]{1,40}$") and (test("[\\r\\n]") | not)))' report-download/report.json >/dev/null; then
            echo "INVALID task id or branch found"
            exit 1
          fi
          echo "Report validation passed"

      - name: Build matrix from report
        id: set-matrix
        run: |
          REPORT_FILE=report-download/report.json
          MATRIX=$(jq -c '[.fixTasks[].id]' "$REPORT_FILE")
          HAS_TASKS=$(jq -r 'if (.fixTasks | length) > 0 then "true" else "false" end' "$REPORT_FILE")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "has-tasks=$HAS_TASKS" >> $GITHUB_OUTPUT

  build-desktop:
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/build-suite-desktop-e2e.yml

  build-web:
    runs-on: ubuntu-24.04
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-suite-web-e2e-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn workspaces focus @trezor/suite-web @trezor/suite-data @trezor/suite-build

      - name: Build message system config
        run: yarn message-system-sign-config 1>/dev/null

      - name: Build suite-data lib
        run: yarn workspace @trezor/suite-data build:lib

      - name: Build suite-web
        run: yarn workspace @trezor/suite-web build

      - name: Compress web build
        run: tar -czf web-build.tar.gz -C packages/suite-web build

      - name: Upload web build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-app-build-e2e
          path: web-build.tar.gz
          retention-days: 7

  fix:
    needs: [prepare-matrix, build-desktop, build-web]
    runs-on: ubuntu-24.04
    if: github.repository == 'trezor/trezor-suite' && needs.prepare-matrix.outputs.has-tasks == 'true'
    timeout-minutes: 210
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        task-id: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      COMPOSE_FILE: ./docker/docker-compose.suite-ci-e2e.yml

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-fix-agent-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        # Union of test deps and web and desktop build toolchains
        run: yarn workspaces focus @trezor/suite-e2e @trezor/e2e-utils @trezor/suite-web @trezor/suite-desktop @trezor/suite-desktop-core @trezor/suite-desktop-ui @trezor/suite @trezor/suite-data @trezor/suite-build @trezor/transport-bridge @suite-common/message-system

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: "arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy"
          aws-region: "eu-central-1"

      - name: Install Playwright browsers
        run: yarn workspace @trezor/suite-e2e exec playwright install chromium --with-deps

      - name: Install Playwright trace skill
        run: yarn workspace @trezor/suite-e2e exec playwright trace install-skill

      - name: Build message system config
        run: yarn message-system-sign-config 1>/dev/null

      - name: Build libs required for web/desktop rebuilds
        run: |
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Download desktop artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-app-build-e2e
          path: artifact-download

      - name: Extract desktop artifact
        run: tar -xzf artifact-download/app-build.tar.gz -C packages/suite-desktop

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-app-build-e2e
          path: artifact-download

      - name: Extract web artifact
        run: tar -xzf artifact-download/web-build.tar.gz -C packages/suite-web

      - name: Start web preview server
        run: nohup yarn workspace @trezor/suite-web preview > /tmp/web-preview.log 2>&1 &

      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fix-agent-report
          path: report-download/

      - name: Pull Docker images
        run: docker compose pull --quiet

      - name: Start Docker services
        run: docker compose up -d

        # This needs to be discussed with Tali
      - name: Configure git identity
        run: |
          git config --global user.email "nightly-fix-agent@trezor.io"
          git config --global user.name "Nightly Fix Agent"

      - name: Checkout fix branch
        env:
          TASK_ID: ${{ matrix.task-id }}
        run: |
          git fetch origin develop --depth=1
          BRANCH=$(jq -r --arg id "$TASK_ID" \
            'first(.fixTasks[] | select(.id == $id) | .branch) // empty' "report-download/report.json")
          if [ -z "$BRANCH" ]; then echo "Branch not found for task id: $TASK_ID" && exit 1; fi
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Wait for web preview server
        timeout-minutes: 2
        run: curl -sf --retry 30 --retry-delay 2 --retry-connrefused --max-time 5 http://localhost:8000 -o /dev/null

      - name: Run fix agent
        id: run-fix-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
          PASSPHRASE: ${{ secrets.E2E_TEST_PASSPHRASE }}
          TASK_ID: ${{ matrix.task-id }}
          AGENT_GITHUB_ACTION: true
          REPORT_PATH: ${{ github.workspace }}/report-download/report.json
          ELECTRON_DISABLE_SANDBOX: 1
        run: yarn workspace @trezor/e2e-utils fix-bot:fix

      - name: Store token usage record to S3
        if: always()
        env:
          TASK_ID: ${{ matrix.task-id }}
        run: |
          if [ -f /tmp/llm-token-usage.json ]; then
            SAFE_TASK_ID=$(echo "$TASK_ID" | tr -cs 'a-zA-Z0-9_-' '_')
            aws s3api put-object \
              --bucket dev.suite.sldev.cz \
              --key "coverage/e2e/llm-usage/runs/${{ github.run_id }}_FixAgent_${SAFE_TASK_ID}.json" \
              --body /tmp/llm-token-usage.json \
              --content-type application/json \
              --cache-control "no-cache, max-age=0"
            echo "Token usage record stored."
          else
            echo "No token usage file found, skipping."
          fi

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Publish PR
        if: ${{ !cancelled() && steps.run-fix-agent.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
        run: yarn workspace @trezor/e2e-utils fix-bot:publish

      - name: Upload Slack fix summary artifact
        if: ${{ !cancelled() && steps.run-fix-agent.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slack-fix-summary-${{ matrix.task-id }}
          path: slack-fix-summary-${{ matrix.task-id }}.json
          if-no-files-found: warn

      - name: Docker Compose Down
        if: always()
        run: docker compose down

  notify:
    needs: [analyze, fix]
    if: always() && github.repository == 'trezor/trezor-suite' && needs.analyze.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-e2e-utils-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn workspaces focus @trezor/e2e-utils

      - name: Download report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fix-agent-report
          path: report-download/
        continue-on-error: true

      - name: Download analyze cost artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: slack-analyze-cost
          path: analyze-cost-download/
        continue-on-error: true

      - name: Download Slack fix summary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: slack-fix-summary-*
          path: summaries/
          merge-multiple: true
        continue-on-error: true

      - name: Send Slack notification
        env:
          REPORT_PATH: ${{ github.workspace }}/report-download/report.json
          SUMMARIES_DIR: ${{ github.workspace }}/summaries
          ANALYZE_COST_FILE: ${{ github.workspace }}/analyze-cost-download/llm-token-usage.json
          SLACK_FIX_AGENT_WEBHOOK: ${{ secrets.SLACK_FIX_AGENT_WEBHOOK }}
        run: yarn workspace @trezor/e2e-utils fix-bot:notify

  update-ledger:
    needs: [analyze, fix]
    if: always() && github.repository == 'trezor/trezor-suite' && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: node_modules-

      - name: Install dependencies
        run: yarn workspaces focus @trezor/e2e-utils

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: "arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy"
          aws-region: "eu-central-1"

      - name: Download report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fix-agent-report
          path: report-download/

      - name: Download Slack fix summary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: slack-fix-summary-*
          path: summaries/
          merge-multiple: true
        continue-on-error: true

      - name: Update ledger
        env:
          REPORT_PATH: ${{ github.workspace }}/report-download/report.json
          SUMMARIES_DIR: ${{ github.workspace }}/summaries
        run: yarn workspace @trezor/e2e-utils fix-bot:update-ledger

      - name: Upload updated ledger to S3
        run: |
          aws s3api put-object \
            --bucket dev.suite.sldev.cz \
            --key "e2e/fix-agent/ledger.json" \
            --body "${{ github.workspace }}/ledger.json" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0"

  aggregate_llm_cost:
    needs: [analyze, fix]
    if: always() && github.repository == 'trezor/trezor-suite' && needs.analyze.result != 'cancelled'
    uses: ./.github/workflows/build-llm-usage-dashboard.yml
