name: "[Test] request-manager"

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/test-request-manager.yml"
      - "packages/request-manager/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-request-manager:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 60
    env:
      # Run the (unflagged) real-Tor e2e suite on manual dispatch AND on the nightly schedule, so the
      # flaky-gated circuit-isolation suites are exercised at least daily; PRs still run test:all.
      TEST_SCRIPT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'test:e2e' || 'test:all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@64d9f1409273c9a5e36e5d7b2b883be099f1ea60 # v0.27.0
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn workspaces focus trezor-suite @trezor/request-manager
      - run: yarn workspace @trezor/request-manager ${{ env.TEST_SCRIPT }}
