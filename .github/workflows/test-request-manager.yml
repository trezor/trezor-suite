name: "[Test] request-manager"

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/test-request-manager.yml"
      - "packages/request-manager/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-request-manager:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 60
    env:
      TEST_SCRIPT: ${{ github.event_name == 'workflow_dispatch' && 'test:e2e' || 'test:all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          lfs: true

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn workspaces focus trezor-suite @trezor/request-manager
      - run: yarn workspace @trezor/request-manager ${{ env.TEST_SCRIPT }}
