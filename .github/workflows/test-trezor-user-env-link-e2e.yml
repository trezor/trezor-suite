name: "[Test] trezor-user-env-link e2e"

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/test-trezor-user-env-link-e2e.yml"
      - "packages/trezor-user-env/**"
      - "packages/trezor-user-env-link/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-test-trezor-user-env-link:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{github.event.after}}
          fetch-depth: 2
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Install dependencies
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml
          yarn workspaces focus @trezor/trezor-user-env-link

      - name: Run e2e tests
        run: |
          docker run -d --network=host ghcr.io/trezor/trezor-user-env:97b797fb349737b93a1d2dbe6bda6673dcc9cafb
          yarn workspace @trezor/trezor-user-env-link test:e2e
