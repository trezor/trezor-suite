name: "[Test] trezor-user-env-link e2e"

permissions:
  contents: read

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/test-trezor-user-env-link-e2e.yml"
      - "packages/trezor-user-env/**"
      - "packages/trezor-user-env-link/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-test-trezor-user-env-link:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{github.event.after}}
          fetch-depth: 2
      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install
        with:
          focus: "@trezor/trezor-user-env-link"
          disable-hardened-mode: "true"

      - name: Run e2e tests
        run: |
          docker run -d --network=host ghcr.io/trezor/trezor-user-env:35adb3fac0e82993a8d6d3a1f4593593a3476729
          yarn workspace @trezor/trezor-user-env-link test:e2e
