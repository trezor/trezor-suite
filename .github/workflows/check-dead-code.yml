name: "[Check] Dead code (advisory)"

# Non-blocking advisory scan for dead code that the type-aware `no-unused-intersection-members`
# ESLint rule structurally cannot see: unused files, dependencies, exports, types and enum members
# across all workspaces. Runs weekly and on demand; findings surface in the job summary and the
# job never fails CI. See docs/misc/dead-code-detection.md for triage and the path to a blocking gate.

permissions:
  contents: read

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # Also validate the scan whenever its own configuration changes.
  pull_request:
    paths:
      - "knip.jsonc"
      - ".github/workflows/check-dead-code.yml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  knip:
    name: Knip dead-code scan (advisory)
    runs-on: ubuntu-latest
    # Only run in the canonical repository, not forks.
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install

      - name: Run knip (advisory — never blocks)
        continue-on-error: true
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          {
            echo "## Knip dead-code report (advisory)"
            echo ""
            echo "Non-blocking. See \`docs/misc/dead-code-detection.md\` for how to triage findings and the path to a blocking gate."
            echo ""
            yarn knip --reporter markdown || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
