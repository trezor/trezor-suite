name: "[Test] misc"

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/test-misc.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  media-duplicates:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    strategy:
      fail-fast: false
      matrix:
        extension: [".png", ".jpg", ".mp4", ".webm", ".svg"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - run: ./scripts/ci/find_duplicates.sh ./packages/suite-data/files ${{ matrix.extension }}

  test-madge-circular-imports:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn install --immutable
      - name: Check for Circular Imports
        # safedep/pmg covers also the `npx` running inside the shell script
        run: ./scripts/circular-dependencies/check-circular-dependencies.sh

  test-unit:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn install --immutable
      - run: yarn message-system-sign-config
      - name: Unit Tests - Suite, Connect, Common
        run: yarn test:unit:all --exclude='@suite-native/*' -- --silent
      - name: Unit Tests - Native
        run: yarn test:unit:all --exclude='@trezor/*,@suite/*,@suite-common/*' -- --silent

  test-fuzz:
    # Randomized property/fuzz tests are excluded from the unit suite and run
    # here on the nightly schedule (and on demand via workflow_dispatch). A fresh
    # seed each night widens the explored interleavings over time; a failure
    # prints the seed + shrunk counterexample for deterministic reproduction.
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn install --immutable
      - name: Fuzz Tests - Transport sessions lock
        run: yarn workspace @trezor/transport-common test:fuzz

  test-unit-windows:
    runs-on: windows-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      # safedep/pmg not available on Windows (that's ok, PMG must be run on PR workflows but here it's optional)
      - run: yarn install --immutable
      - run: yarn workspace @trezor/node-utils test:unit

  utility-scripts:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn install --immutable
      - run: yarn generate-package @trezor/meow-package
      - run: rm -rf packages/meow-package

  components-test-img-paths-exist:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Install SafeDep PMG
        uses: safedep/pmg@6cd8851679cbd6616398825ffc68a59e0626680d # v0.24.2
        continue-on-error: true
        with:
          version: v0.19.1
      - run: yarn install --immutable
      - run: yarn tsx ./packages/components/scripts/test-img-paths-exist.ts
