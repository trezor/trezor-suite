name: "[Bot] update trezor-user-env"

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  update-trezor-user-env:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: develop

      - name: Get current pinned image tag
        id: current
        run: |
          pinned=$(grep -oP 'ghcr\.io/trezor/trezor-user-env:\K[0-9a-f]{40}' docker/docker-compose.connect-test.yml | head -1)
          if [ -z "$pinned" ]; then
            echo "::error::Failed to detect pinned trezor-user-env image tag"
            exit 1
          fi
          echo "image_tag=$pinned" >> $GITHUB_OUTPUT

      - name: Get latest image tag from ghcr.io
        id: latest
        run: |
          set -euo pipefail
          latest=$(curl -sf "https://api.github.com/orgs/trezor/packages/container/trezor-user-env/versions?per_page=50" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            | jq -e -r '[.[] | select(.metadata.container.tags | index("latest")) | .metadata.container.tags[] | select(test("^[0-9a-f]{40}$"))][0]')
          if ! [[ "$latest" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to fetch latest trezor-user-env image tag from ghcr.io: $latest"
            exit 1
          fi
          echo "image_tag=$latest" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.image_tag }}" = "${{ steps.latest.outputs.image_tag }}" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Replace pinned image tag
        if: steps.check.outputs.needs_update == 'true'
        run: |
          old="${{ steps.current.outputs.image_tag }}"
          new="${{ steps.latest.outputs.image_tag }}"
          grep -rl "ghcr.io/trezor/trezor-user-env:${old}" . --include='*.yml' --include='*.yaml' --include='*.sh' | while read -r file; do
            sed -i "s|ghcr.io/trezor/trezor-user-env:${old}|ghcr.io/trezor/trezor-user-env:${new}|g" "$file"
          done

      - name: Generate GitHub App token
        if: steps.check.outputs.needs_update == 'true'
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.trezor-bot-token.outputs.token }}
          commit-message: "ci: update trezor-user-env to ${{ steps.latest.outputs.image_tag }}"
          branch: chore/update-trezor-user-env
          title: "Update trezor-user-env to ${{ steps.latest.outputs.image_tag }}"
          body: |
            ## Description

            Updates `ghcr.io/trezor/trezor-user-env` image tag.

            **Image tag:** [`${{ steps.latest.outputs.image_tag }}`](https://github.com/trezor/trezor-user-env/pkgs/container/trezor-user-env)
          base: develop
          delete-branch: true
          labels: ci, no-project
