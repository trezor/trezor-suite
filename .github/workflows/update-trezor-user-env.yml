name: "[Bot] update trezor-user-env"

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  update-trezor-user-env:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: develop

      - name: Get current pinned image tag
        id: current
        run: |
          pinned=$(grep -oP 'ghcr\.io/trezor/trezor-user-env:\K[0-9a-f]{40}' docker/docker-compose.connect-test.yml | head -1)
          if [ -z "$pinned" ]; then
            echo "::error::Failed to detect pinned trezor-user-env image tag"
            exit 1
          fi
          echo "image_tag=$pinned" >> $GITHUB_OUTPUT

      - name: Get latest image tag from ghcr.io
        id: latest
        run: |
          set -euo pipefail
          latest=$(curl -sf "https://api.github.com/orgs/trezor/packages/container/trezor-user-env/versions?per_page=50" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            | jq -e -r '[.[] | select(.metadata.container.tags | index("latest")) | .metadata.container.tags[] | select(test("^[0-9a-f]{40}$"))][0]')
          if ! [[ "$latest" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to fetch latest trezor-user-env image tag from ghcr.io: $latest"
            exit 1
          fi
          echo "image_tag=$latest" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.image_tag }}" = "${{ steps.latest.outputs.image_tag }}" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Replace pinned image tag
        if: steps.check.outputs.needs_update == 'true'
        run: |
          old="${{ steps.current.outputs.image_tag }}"
          new="${{ steps.latest.outputs.image_tag }}"
          grep -rl "ghcr.io/trezor/trezor-user-env:${old}" . --include='*.yml' --include='*.yaml' --include='*.sh' | while read -r file; do
            sed -i "s|ghcr.io/trezor/trezor-user-env:${old}|ghcr.io/trezor/trezor-user-env:${new}|g" "$file"
          done

      - name: Generate GitHub App token
        if: steps.check.outputs.needs_update == 'true'
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.trezor-bot-token.outputs.token }}
          commit-message: "ci: update trezor-user-env to ${{ steps.latest.outputs.image_tag }}"
          branch: chore/update-trezor-user-env
          title: "Update trezor-user-env to ${{ steps.latest.outputs.image_tag }}"
          body: |
            ## Description

            Updates `ghcr.io/trezor/trezor-user-env` image tag.

            **Image tag:** [`${{ steps.latest.outputs.image_tag }}`](https://github.com/trezor/trezor-user-env/pkgs/container/trezor-user-env)
          base: develop
          delete-branch: true
          labels: ci, no-project

  # Suite Native E2E pins the image by digest because the nightly image build overwrites its tags.
  update-native-trezor-user-env:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: develop

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      # Leave a candidate that is ready for review or has extra commits, e.g. fixture fixes.
      - name: Check open candidate
        id: candidate
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
        run: |
          refresh=$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/update-native-trezor-user-env \
            --json isDraft,commits --jq 'all(.[]; .isDraft and (.commits | length == 1))')
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"

      - name: Pin latest image digest
        if: steps.candidate.outputs.refresh == 'true'
        id: latest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect ghcr.io/trezor/trezor-user-env:latest --format '{{.Manifest.Digest}}')
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to fetch latest trezor-user-env image digest from ghcr.io: $digest"
            exit 1
          fi
          file=docker/docker-compose.suite-native-ci.yml
          if ! grep -qE 'ghcr\.io/trezor/trezor-user-env@sha256:[0-9a-f]{64}' "$file"; then
            echo "::error::Failed to detect pinned trezor-user-env image digest in $file"
            exit 1
          fi
          sed -i -E "s|ghcr\.io/trezor/trezor-user-env@sha256:[0-9a-f]{64}|ghcr.io/trezor/trezor-user-env@${digest}|" "$file"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "short_digest=${digest:7:12}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.candidate.outputs.refresh == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.trezor-bot-token.outputs.token }}
          commit-message: "ci(suite-native): update trezor-user-env to ${{ steps.latest.outputs.short_digest }}"
          branch: chore/update-native-trezor-user-env
          title: "Update Suite Native trezor-user-env to ${{ steps.latest.outputs.short_digest }}"
          body: |
            ## Description

            Pins the Suite Native E2E `ghcr.io/trezor/trezor-user-env` image to the current `latest` digest.

            **Image digest:** [`${{ steps.latest.outputs.digest }}`](https://github.com/trezor/trezor-user-env/pkgs/container/trezor-user-env)

            The full Android nightly E2E suite runs on this PR. When it passes, the PR is marked ready for review; when it fails, Slack is notified. The bot stops refreshing the PR once it is ready for review or has more than one commit, so push fixture fixes on top of its commit.
          base: develop
          draft: always-true
          delete-branch: true
          labels: ci, no-project
