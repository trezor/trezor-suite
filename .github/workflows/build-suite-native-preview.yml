name: "[Build] suite-native preview"

on:
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - "suite-native/**"
      - "suite-common/**"
      - "packages/react-native-usb/**"
      - "packages/transport-native-usb/**"
      - "yarn.lock"
      - ".github/workflows/build-suite-native-preview.yml"
      # You can manually dispatch using the ‘preview-mobile’ label only if there are changes in the specified paths.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  update:
    if: |
      (
        contains(github.event.pull_request.changed_files, 'suite-native/') ||
        contains(github.event.pull_request.labels.*.name, 'preview-mobile')
      ) &&
      (github.repository == 'trezor/trezor-suite' || github.repository == 'trezor/trezor-suite-private')
    name: EAS Update
    runs-on: ubuntu-latest
    concurrency: fingerprint-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EXPO_PUBLIC_ENVIRONMENT: preview
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      EXPO_PUBLIC_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 14.7.1
          token: ${{ secrets.EXPO_TOKEN_DEVELOP }}
      - name: Install libs
        run: |
          yarn workspaces focus @suite-native/app
          npx patch-package

      - name: Prebuild native expo project
        working-directory: ./suite-native/app
        run: yarn prebuild

      - name: Get Expo app fingerprint ANDROID
        working-directory: ./suite-native/app
        run: |
          npx expo-updates runtimeversion:resolve --platform android > runtimeversion-android.json
          node -e "console.log('RUNTIME_VERSION_ANDROID=' + require('./runtimeversion-android.json').runtimeVersion)" >> $GITHUB_ENV

      - name: Get Expo app fingerprint iOS
        working-directory: ./suite-native/app
        run: |
          npx expo-updates runtimeversion:resolve --platform ios > runtimeversion-ios.json
          node -e "console.log('RUNTIME_VERSION_IOS=' + require('./runtimeversion-ios.json').runtimeVersion)" >> $GITHUB_ENV

      - name: Check runtimeVersion build ANDROID
        working-directory: ./suite-native/app
        run: |
          RUNTIME_VERSION_ANDROID=${{ env.RUNTIME_VERSION_ANDROID }}
          echo "Android fingerprint is $RUNTIME_VERSION_ANDROID"

          # Check if there is a build with the same fingerprint on EAS already
          EXISTING_BUILD_ANDROID=$(eas build:list  --build-profile=preview --channel=preview --limit=1  --non-interactive --json --runtime-version=$RUNTIME_VERSION_ANDROID)
          if [ "$EXISTING_BUILD_ANDROID" = "[]" ]; then
            echo "No build with runtimeVersion $EXISTING_BUILD_ANDROID found"
            echo "RUNTIME_BUILD_EXISTS_ANDROID=false" >> $GITHUB_ENV
          else
            echo "Found build with runtimeVersion $EXISTING_BUILD_ANDROID"
            echo "$EXISTING_BUILD_ANDROID"
            echo "RUNTIME_BUILD_EXISTS_ANDROID=true" >> $GITHUB_ENV
          fi

      - name: Check runtimeVersion build IOS
        working-directory: ./suite-native/app
        run: |
          RUNTIME_VERSION_IOS=${{ env.RUNTIME_VERSION_IOS }}
          echo "iOS fingerprint is $RUNTIME_VERSION_IOS"

           # Check if there is a build with the same fingerprint on EAS already
          EXISTING_BUILD_IOS=$(eas build:list  --build-profile=preview --channel=preview --limit=1  --non-interactive --json --runtime-version=$RUNTIME_VERSION_IOS)
          if [ "$EXISTING_BUILD_IOS" = "[]" ]; then
            echo "No build with runtimeVersion $EXISTING_BUILD_IOS found"
            echo "RUNTIME_BUILD_EXISTS_IOS=false" >> $GITHUB_ENV
          else
            echo "Found build with runtimeVersion $EXISTING_BUILD_IOS"
            echo "$EXISTING_BUILD_IOS"
            echo "RUNTIME_BUILD_EXISTS_IOS=true" >> $GITHUB_ENV
          fi

      - name: Create preview builds if fingerprint changed ANDROID
        # Only create preview builds if there is no build with the same runtimeVersion on EAS already
        if: env.RUNTIME_BUILD_EXISTS_ANDROID == 'false'
        working-directory: suite-native/app
        run: eas build --profile preview --platform android --non-interactive --no-wait

      - name: Create preview builds if fingerprint changed iOS
        # Only create preview builds if there is no build with the same runtimeVersion on EAS already
        if: env.RUNTIME_BUILD_EXISTS_IOS == 'false'
        working-directory: suite-native/app
        run: eas build --profile preview --platform ios --auto-submit --non-interactive --no-wait

      - name: Build message system config
        run: yarn message-system-sign-config

      - name: Create preview update
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --branch ${{ env.BRANCH_NAME }}
          working-directory: suite-native/app
