name: "[Test] URLs health check"

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET, same as other nightlies in test-misc.yml
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/test-urls.yml"
      - "packages/urls/**"
  workflow_dispatch:

jobs:
  urls-health:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Restore develop Yarn cache
        uses: ./.github/actions/restore-yarn-cache

      - name: Install SafeDep PMG
        uses: safedep/pmg@ad7d74efddce4ed5c8b161a11945bd6e55be266c # v0.33.0
        continue-on-error: true
        with:
          version: v0.32.0
          config-file: .github/pmg-config.yml
      - run: yarn workspaces focus trezor-suite @trezor/urls
      - run: yarn workspace @trezor/urls test:e2e
