name: "[Test] URLs health check"

permissions:
  contents: read

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET, same as other nightlies in test-misc.yml
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/test-urls.yml"
      - "packages/urls/**"
  workflow_dispatch:

jobs:
  urls-health:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install
        with:
          focus: "trezor-suite @trezor/urls"
      - run: yarn workspace @trezor/urls test:e2e
