name: "[Bot] stale PR & Issues monitor"

permissions:
  contents: read

on:
  schedule:
    - cron: "0 17 * * *" # Daily at 5pm UTC
  workflow_dispatch: # Allow manual runs for testing

jobs:
  check-stale:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: read

      - name: Run stale issues and PRs monitor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9
        env:
          SLACK_WEBHOOK_STALE_REMINDER: ${{ secrets.SLACK_WEBHOOK_STALE_REMINDER }}
          STALE_DAYS: "2"
          TARGET_OWNER: "trezor"
          TARGET_REPO: "trezor-suite"
          PROJECT_ID: "PVT_kwDOAD9FD84AAuwj"
        with:
          github-token: ${{ steps.trezor-bot-token.outputs.token }}
          script: |
            const script = require('./scripts/stale-monitor.cjs')
            await script({ github, context, core })
