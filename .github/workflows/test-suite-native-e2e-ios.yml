name: "[Diagnostic] iOS Jest termination"

on:
  push:
    branches:
      - investigate/ios-jest-native-imports
  workflow_dispatch:
    inputs:
      diagnostic_build_run_id:
        description: "Reuse an existing app build to keep the native binary identical"
        required: true
        default: "44642410579"
        type: string
      publish_results_to_github:
        description: "Publish test report to GitHub Project"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: "test"
  DETOX_BINARY_PATH: ../../node_modules/.bin/detox
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  RN_SRC_EXT: "e2e.ts,e2e.tsx"

jobs:
  run_ios_e2e_tests:
    timeout-minutes: 45
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        TEST_GROUP: [0]
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: "true"

      - name: Install node and yarn
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Load node modules cache
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            node_modules
            suite-native-app/app/node_modules
          key: node_modules-native-full-${{ hashFiles('yarn.lock') }}

      # safedep/pmg not available on macOS (that's ok, PMG must be run on PR workflows but here it's optional)
      - name: Disable Yarn hardened mode
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml

      - name: Install Yarn dependencies
        run: yarn install --immutable

      # Detox runtime may indirectly import the built config, and that would crash if message-system is not built
      - name: Sign message system config
        working-directory: ./suite-common/message-system
        run: yarn sign-config

      - name: Repeated native-transform module loading
        working-directory: ./suite-native-app/app
        env:
          IOS_IMPORT_ONLY_JEST_CACHE: ${{ runner.temp }}/ios-import-transform-cache
        run: |
          export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$GITHUB_WORKSPACE/scripts/ci/ios-diagnostics/node.cjs"
          python3 "$GITHUB_WORKSPACE/scripts/ci/ios-diagnostics/host.py" > "$RUNNER_TEMP/ios-host-resources.log" 2>&1 &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true' EXIT
          files=(accountManagement bitcoinAccountsImport deeplinkPopup deviceSettingsT1B1 ejectWallets firmwareUpdateRequired invalidAccountsImport passphraseFlow send tokenReceive tradingCountryResidence tradingExchangeFlow)
          paths=()
          for file in "${files[@]}"; do paths+=("e2e/tests/$file.test.ts"); done
          for attempt in {1..20}; do
            echo "Native module-loading attempt $attempt"
            cache_args=()
            if (( attempt % 5 == 1 )); then cache_args+=(--no-cache); fi
            yarn exec jest --config "$GITHUB_WORKSPACE/scripts/ci/ios-diagnostics/ios-import-only-native-node.config.cjs" --runInBand "${cache_args[@]}" "${paths[@]}"
          done

      - name: Extract process termination diagnostics
        if: always()
        run: python3 scripts/ci/ios-diagnostics/crashes.py

      - name: Upload process diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-process-diagnostics-${{ matrix.TEST_GROUP }}
          path: |
            ${{ runner.temp }}/ios-host-resources.log
            ${{ runner.temp }}/ios-crash-signatures.json
          retention-days: 7

  notify_scheduled_failure_to_slack:
    runs-on: ubuntu-latest
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: run_ios_e2e_tests
    steps:
      - name: Notify scheduled job failure to Slack
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          CURRENTS_PROJECT_ID: LjEjiV
          CURRENTS_CI_BUILD_ID: pr-run-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_E2E_WEBHOOK }}
        run: |
          CURRENTS_RUN_ID=$(curl -sf -H "Authorization: Bearer $CURRENTS_API_KEY" \
            "https://api.currents.dev/v1/runs/find?projectId=$CURRENTS_PROJECT_ID&ciBuildId=$CURRENTS_CI_BUILD_ID" \
            | jq -r '.data.runId // empty') || true
          if [ -n "$CURRENTS_RUN_ID" ]; then
            CURRENTS_RUN_URL="https://app.currents.dev/run/$CURRENTS_RUN_ID"
          else
            CURRENTS_RUN_URL="https://app.currents.dev/projects/$CURRENTS_PROJECT_ID/runs"
          fi
          jq -n --arg text "Nightly iOS :ios: E2E tests failed: <$GITHUB_RUN_URL|Github run> <$CURRENTS_RUN_URL|Currents run>" '{text: $text}' \
            | curl -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
