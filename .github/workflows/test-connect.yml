name: "[Test] connect core e2e"

# run only if there are changes in connect or related libs paths
on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  push:
    branches: [release/connect/**]
  pull_request:
    paths:
      - "packages/blockchain-link/**"
      - "packages/connect-common/**"
      - "packages/connect-data/**"
      - "packages/connect-web/**"
      - "packages/connect/**"
      - "packages/protobuf/**"
      - "packages/schema-utils/**"
      - "packages/transport/**"
      - "packages/utxo-lib/**"
      - "docker/**"
      - "submodules/trezor-common/**"
      - ".github/workflows/test-connect.yml"
      - ".github/workflows/template-connect-test-params.yml"
      - "docker/docker-connect-test.sh"
      - "docker/docker-compose.connect-test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      dailyMatrix: ${{ steps.set-matrix-daily.outputs.matrix }}
      dailyWebMatrix: ${{ steps.set-matrix-daily-web.outputs.matrix }}
      t3w1MainMatrix: ${{ steps.set-matrix-t3w1-main.outputs.matrix }}
      otherDevicesMatrix: ${{ steps.set-matrix-other-devices.outputs.matrix }}
      allFwsMatrix: ${{ steps.set-matrix-all-firmwares.outputs.matrix }}
      allTransportsMatrix: ${{ steps.set-matrix-all-transports.outputs.matrix }}
      t1b1LatestMatrix: ${{ steps.set-matrix-t1b1-latest.outputs.matrix }}
      t1b1MainMatrix: ${{ steps.set-matrix-t1b1-main.outputs.matrix }}
      experimentalMethodsMatrix: ${{ steps.set-matrix-experimental-methods.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set daily matrix
        id: set-matrix-daily
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T3W1 --firmware=2-latest --env=node --groups=all --disable_cache_tx=false --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set daily web matrix
        id: set-matrix-daily-web
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T3W1 --firmware=2-latest --env=web --groups=api,init,thp --disable_cache_tx=true --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set T3W1 main matrix
        id: set-matrix-t3w1-main
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T3W1 --firmware=2-main --env=all --groups=all --disable_cache_tx=false --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set all firmwares matrix
        id: set-matrix-all-firmwares
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T2T1 --firmware=all --env=all --groups=all --disable_cache_tx=false --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set other devices matrix
        id: set-matrix-other-devices
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=all --firmware=2-main --env=node --groups=api --disable_cache_tx=true --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set all transports matrix
        id: set-matrix-all-transports
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T3W1 --firmware=2-latest --env=node --groups=api --disable_cache_tx=true --transport=all)" >> $GITHUB_OUTPUT

      - name: Set T1B1 latest matrix
        id: set-matrix-t1b1-latest
        # T1B1 matrix covers the most-used Trezor methods on legacy firmware.
        # `ethereum` validates EIP-712 signing (T1B1 needs host-side hashing);
        # `btc-sign` and `btc-others` cover the bulk of real-world usage. Other
        # coins (cardano, solana, monero, …) are intentionally omitted —
        # historically untested on T1B1 in CI; expanding cautiously.
        # `disable_cache_tx=false` matches the daily/nightly matrices for
        # T2T1+T3W1: btc-sign/btc-others fixtures reference Testnet 3 prev_hashes
        # that the public Testnet 4 backend cannot serve, so the local TX cache
        # is required.
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T1B1 --firmware=1-latest --env=node --groups=api,ethereum,btc-sign,btc-others --disable_cache_tx=false --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set T1B1 main matrix
        id: set-matrix-t1b1-main
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T1B1 --firmware=1-main --env=node --groups=api,ethereum,btc-sign,btc-others --disable_cache_tx=false --transport=node-bridge)" >> $GITHUB_OUTPUT

      - name: Set experimental methods matrix
        id: set-matrix-experimental-methods
        run: echo "matrix=$(node ./scripts/ci/connect-test-matrix-generator.js --model=T2T1,T3W1 --firmware=2-main,2-latest --env=node --groups=experimental --disable_cache_tx=true --transport=node-bridge)" >> $GITHUB_OUTPUT

  PR-check:
    needs: [set-matrix]
    name: PR-check (${{ matrix.model }} ${{ matrix.firmware }})
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.env }}-${{ matrix.groups.pattern }}-${{ matrix.groups.name }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: PR-check
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.dailyMatrix) }}

  PR-check-web:
    needs: [set-matrix]
    name: PR-check web (${{ matrix.model }} ${{ matrix.firmware }})
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.env }}-${{ matrix.groups.pattern }}-${{ matrix.groups.name }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: PR-check-web
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.dailyWebMatrix) }}

  t3w1-main:
    needs: [set-matrix]
    name: ${{ matrix.model }} ${{ matrix.firmware }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.env }}-${{ matrix.groups.pattern }}-${{ matrix.groups.name }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: t3w1-main
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.t3w1MainMatrix) }}

  randomized-order:
    needs: [set-matrix]
    name: Randomized (${{ matrix.model }} ${{ matrix.firmware }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.env }}-${{ matrix.groups.pattern }}-${{ matrix.groups.name }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testRandomizedOrder: true
      testGroup: randomized-order
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.dailyMatrix) }}

  all-fws:
    needs: [set-matrix]
    name: All versions ${{ matrix.model }} ${{ matrix.firmware }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.firmware }}-${{ matrix.groups.pattern }}-${{ matrix.groups.name }}-${{ matrix.env }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: all-fws
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.allFwsMatrix) }}

  all-models-api:
    needs: [set-matrix]
    name: All models ${{ matrix.key }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.model }}-${{ matrix.firmware }}-${{ matrix.groups.pattern }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: all-models-api
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.otherDevicesMatrix) }}

  all-transports:
    needs: [set-matrix]
    name: All transports ${{ matrix.key }} (${{ matrix.model }} ${{ matrix.firmware }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.transport }}-${{ matrix.groups.pattern }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: all-transports
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.allTransportsMatrix) }}

  t1b1-latest:
    needs: [set-matrix]
    name: ${{ matrix.model }} ${{ matrix.firmware }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.firmware }}-${{ matrix.groups.name }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: t1b1-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.t1b1LatestMatrix) }}

  t1b1-main:
    needs: [set-matrix]
    name: ${{ matrix.model }} ${{ matrix.firmware }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.firmware }}-${{ matrix.groups.name }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: t1b1-main
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.t1b1MainMatrix) }}

  experimental-methods:
    needs: [set-matrix]
    name: Experimental methods ${{ matrix.key }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-connect-test-params.yml
    with:
      testPattern: ${{ matrix.groups.pattern }}
      includeFilter: ${{ matrix.groups.includeFilter }}
      testsFirmware: ${{ matrix.firmware }}
      testDescription: ${{ matrix.model }}-${{ matrix.firmware }}
      disable_cache_tx: ${{ matrix.disable_cache_tx }}
      transport: ${{ matrix.transport }}
      testEnv: ${{ matrix.env }}
      testFirmwareModel: ${{ matrix.model }}
      testGroup: experimental-methods
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.experimentalMethodsMatrix) }}
