name: "[Test] connect misc"

permissions:
  contents: read

on:
  schedule:
    # Runs at midnight UTC every day at 01:00 AM CET
    - cron: "0 0 * * *"
  push:
    branches: [release/connect/**]
  pull_request:
    paths:
      - "packages/connect-common/**"
      - "packages/connect-core/**"
      - "packages/connect-data/**"
      - "packages/connect-mobile/**"
      - "packages/connect-web/**"
      - "packages/connect-webextension/**"
      - "packages/connect/**"
      - "scripts/ci/helpers.ts"
      - "scripts/ci/pack-packages.ts"
      - "scripts/ci/connect-publish-roots.ts"
      - "scripts/ci/publish-closure.ts"
      # publish-closure.ts resolves @trezor/requirements to its TypeScript sources under tsx,
      # so the closure walk itself is part of pack-packages.ts' code — and so are the workspace
      # packages @trezor/requirements resolves from source.
      - "packages/requirements/**"
      - "packages/node-utils/**"
      - "packages/utils/**"
      - "packages/logger/**"
      - "packages/type-utils/**"
      - "scripts/ci/trezor-package-path.ts"
      - "scripts/publish/**"
      - "packages/connect-install-smoke/**"
      - ".github/workflows/test-connect-misc.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  install-connect:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Test npm install (beta)
        run: ./packages/connect-install-smoke/test-npm-install.sh beta

      - name: Test npm install (latest)
        run: ./packages/connect-install-smoke/test-npm-install.sh latest
        if: always()

      - name: Test yarn install (beta)
        run: ./packages/connect-install-smoke/test-yarn-install.sh beta
        if: always()

      - name: Test yarn install (latest)
        run: ./packages/connect-install-smoke/test-yarn-install.sh latest
        if: always()

  install-connect-local:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install

      - name: Pack packages
        run: yarn tsx ./scripts/ci/pack-packages.ts

      - name: Check exports
        # `attw` is the binary for @arethetypeswrong/cli; --profile esm-only
        # skips node10/node16-cjs resolutions for our ESM-only packages.
        run: |
          for pkg in connect connect-web connect-mobile connect-webextension; do
            echo "::group::attw @trezor/$pkg"
            yarn exec attw --pack "./tmp/packed-packages/trezor-$pkg.tgz" --profile esm-only
            echo "::endgroup::"
          done

      - name: Test local install
        run: ./packages/connect-install-smoke/test-connect-local.sh

  check-licenses:
    name: License compliance
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install dependencies
        uses: ./.github/actions/minimal-yarn-install
      - name: Check public closure licenses (no copyleft)
        run: |
          # license-checker is run via `yarn dlx` (version-pinned) rather than a
          # repo devDependency on purpose: it is a CI-only tool with a large
          # transitive tree, and vendoring it would add ~90 packages to the
          # lockfile and the project's supply-chain surface for no runtime gain.
          LICENSE_CHECKER="license-checker-rseidelsohn@5.0.1"
          FORBIDDEN="GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;OSL-3.0;EUPL-1.1;EUPL-1.2;CPAL-1.0"
          for pkg in connect connect-web connect-mobile connect-webextension; do
            echo "::group::License summary for @trezor/$pkg"
            yarn dlx "$LICENSE_CHECKER" \
              --start "node_modules/@trezor/$pkg" \
              --production \
              --excludePackagesStartingWith "@trezor/" \
              --summary
            echo "::endgroup::"
            yarn dlx "$LICENSE_CHECKER" \
              --start "node_modules/@trezor/$pkg" \
              --production \
              --excludePackagesStartingWith "@trezor/" \
              --failOn "$FORBIDDEN"
          done
