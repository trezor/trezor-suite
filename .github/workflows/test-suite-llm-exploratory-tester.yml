name: "[Test] LLM Exploratory Tester"

# Run from the Actions tab. Locally, put OPENROUTER_API_KEY=... into
# packages/e2e-utils/.env (gitignored) and run:
# TARGET=<pr-url> DEVICE_MODEL=T3T1 yarn workspace @trezor/e2e-utils llm-exploratory-tester
# Optional: LLM_EXPLORATORY_TESTER_MODEL=z-ai/glm-5v-turbo

on:
  workflow_dispatch:
    inputs:
      confirm_trusted_branch:
        description: "Are you running this from a trusted branch? An untrusted branch can prompt-inject the tester."
        required: true
        type: boolean
      target:
        description: "PR or issue URL (https://github.com/trezor/trezor-suite/pull/…)"
        required: true
        type: string
      device_model:
        description: "Trezor emulator model"
        required: false
        default: T3W1
        type: choice
        options:
          - T2T1
          - T3B1
          - T3T1
          - T3W1
      model:
        description: "OpenRouter model ID (e.g. z-ai/glm-5.3-flash, z-ai/glm-5v-turbo)"
        required: false
        default: z-ai/glm-5.3-flash
        type: string
  pull_request:
    # opened covers PRs created already ready. ready_for_review covers
    # draft -> ready. reopened covers a closed ready PR coming back.
    # Drafts still emit opened/reopened; the gate job drops those.
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: ${{ inputs.target || github.event.pull_request.html_url }}
  cancel-in-progress: true

jobs:
  # Manual dispatch runs the tester when the human confirmed a trusted branch.
  # A non-draft PR runs it on open, reopen, or draft -> ready, and only when
  # Jev picks "run" and the PR's web preview is built. Drafts and forks never run.
  gate:
    if: github.repository == 'trezor/trezor-suite' && !github.event.pull_request.head.repo.fork && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ inputs.confirm_trusted_branch || steps.preview.outcome == 'success' }}
    steps:
      - id: jev
        if: github.event_name == 'pull_request'
        env:
          OPENROUTER_API_KEY: ${{ secrets.E2E_EXPLORATORY_TESTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          body=$(gh pr view "$PR_NUMBER" --json title,files --jq '{title, files: [.files[].path]}' |
            jq '{
              model: "typesafe/jev-1.13",
              state: {
                tester: "The LLM exploratory tester black-box tests the PR on the Suite web preview. It cannot open the desktop or mobile app. suite-native/ is mobile. suite/desktop-app, desktop-app-main, desktop-app-renderer, and desktop-app-native-bindings are the desktop shell. packages/suite and suite/web-app are the web UI. A run takes hours.",
                pr: .
              },
              questions: { pick: {
                type: "choice",
                instructions: "Should CI run the LLM exploratory tester on this pull request?",
                criteria: {
                  run: "The diff changes user-facing behavior visible in Suite web, enough to be worth the cost.",
                  skip: "Desktop-only, mobile-only, test bookkeeping, docs, or other churn the web tester cannot cover."
                }
              }}
            }' |
            curl -sS --fail-with-body https://openrouter.ai/api/alpha/decisions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" -H "Content-Type: application/json" -d @-)
          echo "$body"
          pick=$(jq -r .answers.pick.choice <<< "$body")
          echo "pick=$pick" >> "$GITHUB_OUTPUT"

      # The tester hits dev.suite.sldev.cz/suite-web/<branch>/web, deployed by
      # test-suite-web-desktop-e2e-pr.yml on push. Wait until that build has
      # finished for this exact head SHA so we do not test a stale preview.
      - name: Wait for web preview
        id: preview
        if: steps.jev.outputs.pick == 'run'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          until [ "$status" = completed ]; do
            sleep 30
            read -r status conclusion < <(gh api -X GET "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" \
              -f check_name='build-web / build-web' --jq '.check_runs[0] | "\(.status) \(.conclusion)"')
            echo "build-web: $status $conclusion"
          done
          [ "$conclusion" = success ]

  llm-exploratory-tester:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: needs.gate.outputs.run == 'true'
    env:
      COMPOSE_FILE: ./docker/docker-compose.suite-ci-e2e.yml
      TARGET: ${{ inputs.target || github.event.pull_request.html_url }}
      DEVICE_MODEL: ${{ inputs.device_model || 'T3W1' }}
      LLM_EXPLORATORY_TESTER_MODEL: ${{ inputs.model }}

    steps:
      # Manual dispatch picks the branch. Do not run this workflow from an
      # untrusted PR branch — it would execute that branch's harness code.
      # A pull_request run therefore checks out develop, not the PR.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && 'develop' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Install dependencies
        run: yarn workspaces focus @trezor/e2e-utils @trezor/suite-e2e

      - name: Install Playwright Chromium
        run: yarn workspace @trezor/suite-e2e exec playwright install chromium --with-deps

      # trezor-user-env also serves the trezor-emulator MCP on :9003
      # (started by src/main.py in the pinned image, host networking).
      - name: Start trezor-user-env
        run: docker compose up -d --quiet-pull trezor-user-env-unix

      - name: Run LLM Exploratory Tester
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_GITHUB_ACTION: true
          LLM_EXPLORATORY_TESTER_PASSPHRASE: ${{ secrets.LLM_EXPLORATORY_TESTER_PASSPHRASE }}
          OPENROUTER_API_KEY: ${{ secrets.E2E_EXPLORATORY_TESTER_API_KEY }}
        run: yarn workspace @trezor/e2e-utils llm-exploratory-tester

      # Surface the verdict on the job page; the run step's exit code already
      # fails the job on a fail verdict, this makes the reason visible.
      - name: Verdict summary
        if: always() && hashFiles('packages/e2e-utils/src/llmExploratoryTester/reports/test-result.json') != ''
        run: |
          RESULT=packages/e2e-utils/src/llmExploratoryTester/reports/test-result.json
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## LLM Exploratory Tester: $(jq -r '.result' "$RESULT")

          $(jq -r '.summary' "$RESULT")

          $(jq -r '.issues[] | "- **\(.id)** [\(.severity)] \(.title)"' "$RESULT")
          EOF

      - name: Upload test artifacts
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llm-exploratory-tester-report
          retention-days: 30
          path: |
            packages/e2e-utils/src/llmExploratoryTester/reports
            !packages/e2e-utils/src/llmExploratoryTester/reports/opencode-config

      - name: Comment on tested PR
        if: ${{ !cancelled() && hashFiles('packages/e2e-utils/src/llmExploratoryTester/reports/test-result.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          RESULT=packages/e2e-utils/src/llmExploratoryTester/reports/test-result.json
          PR=$(jq -r '.prNumber' packages/e2e-utils/src/llmExploratoryTester/reports/context.json)
          {
            echo "## LLM Exploratory Tester: $(jq -r '.result' "$RESULT")"
            echo
            jq -r '.summary' "$RESULT"
            echo
            jq -r '.issues[] | "- **\(.id)** [\(.severity)] \(.title)"' "$RESULT"
            echo
            echo "[Download report, including screenshots](${ARTIFACT_URL})"
          } | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Docker Compose Down
        if: always()
        run: docker compose down
