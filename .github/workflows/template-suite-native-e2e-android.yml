name: "Android E2E Test Job Template"

on:
  workflow_call:
    inputs:
      publish_results_to_github:
        description: "Publish test report to GitHub Project"
        required: false
        default: false
        type: boolean
      currents_ci_build_id:
        description: "Custom CI build ID for Currents reporting, default is pr-run-RUN_ID-RUN_ATTEMPT"
        required: false
        default: pr-run-${{ github.run_id }}-${{ github.run_attempt }}
        type: string
      currents_tags:
        description: "(Optional) Additional tags for Currents reporting"
        required: false
        default: ""
        type: string
      runner_config:
        description: "Path to the Detox runner config file"
        required: false
        default: e2e/trezorDetoxRunner/config/runner-android-release.config.js
        type: string
    secrets:
      TREZOR_BOT_APP_ID:
        required: true
      TREZOR_BOT_PRIVATE_KEY:
        required: true
      CURRENTS_RECORD_KEY:
        required: true
      CURRENTS_API_KEY:
        required: true
      E2E_TEST_PASSPHRASE:
        required: true

jobs:
  run_android_e2e_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        TEST_GROUP: [0, 1, 2, 3, 4]
    env:
      # Single source of truth for the emulator options: the Detox runner reuses
      # them verbatim when it has to relaunch an emulator that died mid-run.
      # `-no-metrics` keeps the emulator non-interactive (the metrics-collection
      # prompt is planned to become blocking in a future release).
      EMULATOR_OPTIONS: >-
        -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save
        -noaudio -no-boot-anim -no-metrics -grpc 8554 -memory 4096
      DIAGNOSTICS_DIR: /tmp/e2e-diagnostics

    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: "true"

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          dotnet: true
          haskell: true
          tool-cache: false
          android: false
          swap-storage: false
          large-packages: false

      - name: Install node and yarn
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Load node modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            node_modules
            suite-native/app/node_modules
          key: node_modules-native-full-${{ hashFiles('yarn.lock') }}

      - name: Install SafeDep PMG
        uses: safedep/pmg@26d5c0ad71fd0e5f48c3183c9c74d4b3eb7f57c8 # v0.19.1
        continue-on-error: true
        with:
          version: v0.19.1
      - name: Disable Yarn hardened mode
        run: |
          echo -e "\nenableHardenedMode: false" >> .yarnrc.yml

      - name: Install Yarn dependencies
        run: yarn install --immutable

      # Detox runtime may indirectly import the built config, and that would crash if message-system is not built
      - name: Sign message system config
        working-directory: ./suite-common/message-system
        run: yarn sign-config

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Extract Release Build
        id: extract_branch
        shell: bash
        run: |
          echo "release_build=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}-${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Get device name from detox config file
        id: device
        run: node -e "console.log('AVD_NAME=' + require('./suite-native/app/.detoxrc').devices.emulator.device.avdName)" >> $GITHUB_OUTPUT

      - name: Run trezor-user-env
        env:
          COMPOSE_FILE: ./docker/docker-compose.suite-native-ci.yml
        run: |
          docker compose pull trezor-user-env-unix trezor-user-env-regtest quota-db suite-sync
          docker compose up --detach trezor-user-env-unix trezor-user-env-regtest quota-db suite-sync

      - name: Download Android build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-test-build-${{ github.run_id }}
          path: suite-native/app/android/app/build/

      - name: Enable Android emulator KVM optimalization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator dies without leaving a trace of its own when the kernel kills
      # it, so sample host memory and disk next to the run to see what ran out.
      - name: Start host resource monitor
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          nohup bash -c '
            while true; do
              {
                date --iso-8601=seconds
                free --mebi
                df --human-readable / /tmp
                ps -eo pid,rss,comm --sort=-rss | head -n 8
                echo
              } >> "$DIAGNOSTICS_DIR/host-resources.log" 2>&1
              sleep 15
            done
          ' > /dev/null 2>&1 &

      - name: Run Detox E2E Android tests
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        env:
          RUNNER_TEMP: /tmp
          GITHUB_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          RELEASE_BUILD: ${{ env.release_build }}
          PUBLISH_RESULTS_TO_GITHUB: ${{ inputs.publish_results_to_github == true }}
          TRADING_ACADEMIC_SEED_WALLET_PASSPHRASE: ${{ secrets.E2E_TEST_PASSPHRASE }}
          GITHUB_ACTION: true
          CURRENTS_PROJECT_ID: iUe1Y4
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          CURRENTS_CI_BUILD_ID: ${{ inputs.currents_ci_build_id }}
          CURRENTS_TAG: ${{ inputs.currents_tags }}
          COMMIT_INFO_BRANCH: ${{ github.head_ref }}
        with:
          api-level: 34
          profile: pixel_6
          arch: x86_64
          working-directory: suite-native/app
          ram-size: 4096M
          force-avd-creation: true
          avd-name: ${{ steps.device.outputs.AVD_NAME }}
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          cores: 4
          heap-size: 512M
          script: |
            yarn test:e2e --config=${{ inputs.runner_config }} --shard=${{ matrix.TEST_GROUP }} --totalShards=5 --headless --quarantine

      - name: Post Currents link
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-currents-link
        with:
          github_token: ${{ steps.trezor-bot-token.outputs.token }}
          project: "native android"
          currents-project-id: "iUe1Y4"

      - name: Extract Trezor-user-env and Regtest logs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="suite-native/app/artifacts"
          docker cp trezor-user-env.unix:/trezor-user-env/logs/debugging.log "$LOG_DIR/trezor-user-env-debugging.log" || true
          docker cp trezor-user-env.unix:/trezor-user-env/logs/emulator_bridge.log "$LOG_DIR/tenv-emulator-bridge-debugging.log" || true
          docker cp trezor-user-env.unix:/trezor-user-env/logs/tropic_model.log "$LOG_DIR/trezor-user-env-tropic_model.log" || true
          docker cp trezor-user-env.unix:/trezor-user-env/docker/version.txt "$LOG_DIR/trezor-user-env-version.txt" || true
          docker logs trezor-user-env-regtest > "$LOG_DIR/electrum-regtest.txt" || true
          docker logs docker-quota-db-1 > "$LOG_DIR/quota-db.log" 2>&1 || true
          docker logs docker-suite-sync-1 > "$LOG_DIR/suite-sync.log" 2>&1 || true
          # Android tombstones (only available if the emulator is still reachable via ADB)
          mkdir -p "$LOG_DIR/tombstones"
          adb shell ls /data/tombstones/ 2>/dev/null \
            && adb pull /data/tombstones/. "$LOG_DIR/tombstones" \
            || true

      - name: Collect emulator crash diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          DIAG_DIR="suite-native/app/artifacts/diagnostics"
          mkdir -p "$DIAG_DIR"
          cp "$DIAGNOSTICS_DIR/host-resources.log" "$DIAG_DIR/" || true
          # QEMU stores its Crashpad reports in a directory, so it has to be copied
          # recursively. An empty database means the process was killed from the
          # outside rather than having crashed on its own.
          find /tmp "$HOME/.android" -maxdepth 3 -name "emu-crash*.db" -print0 2>/dev/null \
            | while IFS= read -r -d '' crashDb; do
              cp -r "$crashDb" "$DIAG_DIR/" || true
            done
          # An OOM kill leaves no trace in the emulator's own output, the kernel ring
          # buffer is the only place it shows up.
          sudo dmesg -T 2>/dev/null \
            | grep -iE "out of memory|oom-kill|killed process" \
            > "$DIAG_DIR/kernel-oom.log" || true
          free --mebi > "$DIAG_DIR/memory-after-run.log" 2>&1 || true
          df --human-readable > "$DIAG_DIR/disk-after-run.log" 2>&1 || true
          pgrep -a qemu-system > "$DIAG_DIR/qemu-processes.log" 2>&1 || true
          adb devices > "$DIAG_DIR/adb-devices.log" 2>&1 || true

      - name: "Store test artifacts"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-tests-${{ matrix.TEST_GROUP }}
          path: suite-native/app/artifacts
          retention-days: 14
