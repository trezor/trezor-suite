name: "[Build] LLM Test Analysis Nightly"

# Nightly scheduled build of LLM-based test analysis cache on develop branch
on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Delete the cached analysis file on S3 and re-analyze all test files from scratch"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-llm-test-analysis:
    name: Build LLM test analysis cache
    runs-on: ubuntu-latest
    # Only run in the canonical repository, not forks.
    if: github.repository == 'trezor/trezor-suite'
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: "arn:aws:iam::538326561891:role/gh_actions_trezor_suite_dev_deploy"
          aws-region: "eu-central-1"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: node_modules-

      - name: Install Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          job-summary: errors
      - name: Install dependencies
        shell: bash
        run: sfw --silent yarn workspaces focus @trezor/e2e-utils

      - name: Delete existing LLM analysis cache from S3 (no_cache)
        if: ${{ inputs.no_cache }}
        run: |
          aws s3 rm s3://dev.suite.sldev.cz/coverage/e2e/llm-analysis.json || true

      - name: Download existing LLM analysis cache from S3
        if: ${{ !inputs.no_cache }}
        run: |
          mkdir -p packages/e2e-utils/coverage-map
          aws s3 cp s3://dev.suite.sldev.cz/coverage/e2e/llm-analysis.json packages/e2e-utils/coverage-map/llm-analysis.json || true

      - name: Build LLM test analysis cache
        env:
          CLAUDE_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
        run: |
          yarn workspace @trezor/e2e-utils analyze-tests ../../suite/e2e/tests --buildCache --exclude "manual/**" ${{ inputs.no_cache && '--force' || '' }}

      - name: Upload LLM analysis cache to S3
        if: always()
        run: |
          if [ -f packages/e2e-utils/coverage-map/llm-analysis.json ]; then
            aws s3api put-object --bucket dev.suite.sldev.cz --key coverage/e2e/llm-analysis.json --body packages/e2e-utils/coverage-map/llm-analysis.json --content-type application/json --cache-control "no-cache, max-age=0"
          else
            echo "Local file not found, skipping upload."
          fi

      - name: Store token usage record to S3
        if: always()
        run: |
          if [ -f /tmp/llm-token-usage.json ]; then
            aws s3api put-object \
              --bucket dev.suite.sldev.cz \
              --key "coverage/e2e/llm-usage/runs/${{ github.run_id }}_llmTestAnalyzer.json" \
              --body /tmp/llm-token-usage.json \
              --content-type application/json \
              --cache-control "no-cache, max-age=0"
            echo "Token usage record stored."
          else
            echo "No token usage file found, skipping."
          fi

      - name: Aggregate usage records and generate dashboard
        if: always()
        run: |
          mkdir -p /tmp/llm-usage-runs
          aws s3 sync s3://dev.suite.sldev.cz/coverage/e2e/llm-usage/runs/ /tmp/llm-usage-runs/ || true

          # Merge all run records into one JSON array (handle empty dir gracefully)
          shopt -s nullglob
          files=(/tmp/llm-usage-runs/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            jq -s '.' "${files[@]}" > /tmp/llm-usage-aggregated.json
          else
            echo '[]' > /tmp/llm-usage-aggregated.json
          fi

          # Generate HTML dashboard
          yarn workspace @trezor/e2e-utils generate-usage-dashboard /tmp/llm-usage-aggregated.json /tmp/llm-usage-dashboard.html

          # Upload both to S3
          aws s3api put-object --bucket dev.suite.sldev.cz --key coverage/e2e/llm-usage/aggregated.json --body /tmp/llm-usage-aggregated.json --content-type application/json --cache-control "no-cache, max-age=0"
          aws s3api put-object --bucket dev.suite.sldev.cz --key coverage/e2e/llm-usage/dashboard.html --body /tmp/llm-usage-dashboard.html --content-type text/html --cache-control "no-cache, max-age=0"
          echo "Dashboard available at: https://dev.suite.sldev.cz/coverage/e2e/llm-usage/dashboard.html"
