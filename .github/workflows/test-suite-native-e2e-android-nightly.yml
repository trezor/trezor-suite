name: "[Test] suite-native Android E2E Nightly"

permissions:
  id-token: write # for fetching the OIDC token (needed for aws s3 actions)
  contents: read # read attached artifacts from tests
  actions: write # upload/download artifacts

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_android_test_app:
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-suite-native-prepare-test-app-android.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  run_android_e2e_tests:
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/template-suite-native-e2e-android.yml
    needs: [prepare_android_test_app]
    with:
      runner_config: e2e/trezorDetoxRunner/config/runner-android-release-nightly.config.js
    secrets:
      TREZOR_BOT_APP_ID: ${{ secrets.TREZOR_BOT_APP_ID }}
      TREZOR_BOT_PRIVATE_KEY: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      E2E_TEST_PASSPHRASE: ${{ secrets.E2E_TEST_PASSPHRASE }}

  # See docs/tests/suite-native-e2e-performance.md. Runs on develop, so it seals the baseline.
  publish_performance_history:
    if: ${{ !cancelled() && needs.run_android_e2e_tests.result != 'skipped' && github.repository == 'trezor/trezor-suite' }}
    needs: run_android_e2e_tests
    permissions:
      id-token: write # to assume the dev-deploy role
      contents: read
    concurrency:
      group: publish-performance-history-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/template-publish-performance-history.yml
    with:
      workspace: "@suite-native/app"
      artifact-pattern: android-perf-report-*
      publish-command: yarn workspace @suite-native/app exec tsx e2e/support/performance/publish.ts

  notify_scheduled_failure_to_slack:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: run_android_e2e_tests
    steps:
      - name: Notify scheduled job failure to Slack
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          CURRENTS_PROJECT_ID: iUe1Y4
          CURRENTS_CI_BUILD_ID: pr-run-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_E2E_WEBHOOK }}
        run: |
          CURRENTS_RUN_ID=$(curl -sf -H "Authorization: Bearer $CURRENTS_API_KEY" \
            "https://api.currents.dev/v1/runs/find?projectId=$CURRENTS_PROJECT_ID&ciBuildId=$CURRENTS_CI_BUILD_ID" \
            | jq -r '.data.runId // empty') || true
          if [ -n "$CURRENTS_RUN_ID" ]; then
            CURRENTS_RUN_URL="https://app.currents.dev/run/$CURRENTS_RUN_ID"
          else
            CURRENTS_RUN_URL="https://app.currents.dev/projects/$CURRENTS_PROJECT_ID/runs"
          fi
          jq -n --arg text "Nightly Android E2E tests failed: <$GITHUB_RUN_URL|Github run> <$CURRENTS_RUN_URL|Currents run>" '{text: $text}' \
            | curl -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
