name: "[Test] suite-native Android E2E (T3W1)"

permissions:
  id-token: write # for fetching the OIDC token (needed for aws s3 actions)

on:
  # schedule:
  #   - cron: "0 0 * * *"
  # pull_request:
  #   paths:
  #     - "suite-native/**"
  #     - "suite-common/**"
  #     - "packages/connect/**"
  #     - ".github/workflows/test-suite-native-e2e-android-t3w1.yml"
  #     - ".github/workflows/template-suite-native-e2e-android.yml"
  #     - ".github/workflows/template-suite-native-prepare-test-app-android.yml"
  #     - "!**.md"
  # push:
  #   branches:
  #     - release-native/*
  workflow_dispatch:
    inputs:
      publishResultsToGitHub:
        description: "(optional) Publish test report to GitHub Project"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_android_test_app:
    uses: ./.github/workflows/template-suite-native-prepare-test-app-android.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  run_android_e2e_tests:
    uses: ./.github/workflows/template-suite-native-e2e-android.yml
    needs: prepare_android_test_app
    with:
      emulator_model: "T3W1"
      detox_extra_args: "--testNamePattern '^(?!.*@specificModel)'"
    secrets:
      PUBLISH_RESULTS_TO_GITHUB: ${{ inputs.publishResultsToGitHub }}
      TREZOR_BOT_APP_ID: ${{ secrets.TREZOR_BOT_APP_ID }}
      TREZOR_BOT_PRIVATE_KEY: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
