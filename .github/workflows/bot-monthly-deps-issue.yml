name: "[Bot] Monthly dependency maintenance issues"

permissions:
  issues: write
  repository-projects: write

on:
  schedule:
    #Runs on the first day of every month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  create_deps_issues:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        team:
          [
            "Suite-Growth 🎨",
            "Suite-Wallet 👛",
            "Suite-Trade 💹",
            "Suite-Earn 🐷",
            "Suite-Networks 🌐",
          ]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Create dependency maintenance issue for ${{ matrix.team }}
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          TEAM: ${{ matrix.team }}
        run: bash scripts/create-monthly-deps-issue.sh
