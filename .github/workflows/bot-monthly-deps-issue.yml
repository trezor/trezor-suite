name: "[Bot] Monthly dependency maintenance issues"

permissions:
  issues: write
  repository-projects: write

on:
  schedule:
    #Runs on the first day of every month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  create_deps_issues:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        team:
          [
            "Suite-Growth 🎨",
            "Suite-Wallet 👛",
            "Suite-Trade 💹",
            "Suite-Earn 🐷",
            "Suite-Networks 🌐",
          ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-organization-projects: write

      - name: Create dependency maintenance issue for ${{ matrix.team }}
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          TEAM: ${{ matrix.team }}
        run: bash scripts/dependa-bot/create-monthly-deps-issue.sh
