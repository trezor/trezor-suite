name: "[Bot] Monthly dependency maintenance issues"

permissions:
  issues: write
  repository-projects: write

on:
  schedule:
    #Runs on the first day of every month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  create_deps_issues:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Any team can opt into fair rotation by adding assignee_team_slug.
        # assignees is only a fallback for tokens that cannot read org teams.
        include:
          - team: "Suite-Growth 🎨"
          - team: "Suite-Wallet 👛"
            assignee_team_slug: "suite-wallet"
            assignees: "vojtatranta,matusbalascak,PeKne,juriczech,peter-sanderson"
          - team: "Suite-Trade 💹"
          - team: "Suite-Earn 🐷"
          - team: "Suite-Networks 🌐"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Create dependency maintenance issue for ${{ matrix.team }}
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          TEAM: ${{ matrix.team }}
          ASSIGNEE_TEAM_SLUG: ${{ matrix.assignee_team_slug || '' }}
          ASSIGNEES: ${{ matrix.assignees || '' }}
        run: bash scripts/dependa-bot/create-monthly-deps-issue.sh
