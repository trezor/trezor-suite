name: "[Bot] Monthly dependency maintenance issues"

permissions:
  issues: write
  repository-projects: write

on:
  schedule:
    #Runs on the first day of every month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  create_deps_issues:
    if: github.repository == 'trezor/trezor-suite'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        team: ["Suite-Growth 🎨", "Suite-Wallet 📈", "Suite-Foundation 🧑‍🚀", "Suite-Trade 💹"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Create dependency maintenance issue for ${{ matrix.team }}
        env:
          GH_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
          TEAM: ${{ matrix.team }}
        run: bash scripts/create-monthly-deps-issue.sh