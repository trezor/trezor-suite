<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trezor Hive Memory – Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <header>
        <h1>Trezor Hive Memory</h1>
        <nav>
            <button data-tab="learnings">Learnings</button>
            <button data-tab="sessions">Sessions</button>
            <button data-tab="graph">Graph</button>
        </nav>
        <div class="header-right">
            <input type="text" class="token-input" id="token-input" placeholder="Bearer token" title="API token (stored in sessionStorage)">
            <span id="health-dot" class="health-dot"></span>
            <span id="health-label" class="text-muted text-sm">…</span>
        </div>
    </header>
    <main>
        <section class="tab-content" id="tab-learnings"></section>
        <section class="tab-content" id="tab-sessions"></section>
        <section class="tab-content" id="tab-graph"></section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
