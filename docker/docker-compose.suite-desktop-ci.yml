services:
  trezor-user-env-unix:
    image: ghcr.io/trezor/trezor-user-env:8827b6ed857984e04d406b6944b94a7aa1b5d502@sha256:afe132e240dc6c7ca79f3a5960eec413a3baedf12a8018549d051c14c12be525
    environment:
      - SDL_VIDEODRIVER=dummy
      - XDG_RUNTIME_DIR=/var/tmp
    network_mode: host
  bitcoin-regtest:
    image: ghcr.io/trezor/trezor-user-env-regtest # this is a special image that runs regtest and blockbook
    depends_on:
      - trezor-user-env-unix
    network_mode: service:trezor-user-env-unix
