services:
  trezor-user-env-unix:
    image: ghcr.io/trezor/trezor-user-env:892c5195958f7f777f0577b062e117c61897fcd6
    environment:
      - SDL_VIDEODRIVER=dummy
      - XDG_RUNTIME_DIR=/var/tmp
    network_mode: host
  bitcoin-regtest:
    image: ghcr.io/trezor/trezor-user-env-regtest # this is a special image that runs regtest and blockbook
    depends_on:
      - trezor-user-env-unix
    network_mode: service:trezor-user-env-unix
  electrum-regtest:
    image: ghcr.io/trezor/electrs:latest
    ports:
      - "50001:50001"
