# schema version '3' does not support 'extends' keyword anymore
# https://stackoverflow.com/questions/52587643/how-to-extend-service-in-docker-compose-v3

services:
  trezor-user-env-unix:
    image: ghcr.io/trezor/trezor-user-env:8827b6ed857984e04d406b6944b94a7aa1b5d502@sha256:afe132e240dc6c7ca79f3a5960eec413a3baedf12a8018549d051c14c12be525
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - LOCAL_USER_ID=$LOCAL_USER_ID
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  suite-dev:
    container_name: suite-dev
    extends:
      service: suite-base
      file: docker-compose.suite-base.yml
    command: bash -c "yarn suite:dev"
