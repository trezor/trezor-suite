services:
  trezor-user-env-unix:
    image: ghcr.io/trezor/trezor-user-env:73802f22d932dc3194be3d9094872938f2fb9b96
    environment:
      - SDL_VIDEODRIVER=dummy
      - XDG_RUNTIME_DIR=/var/tmp
    # network_mode: bridge # this makes docker reuse existing networks

  test-run:
    build:
      context: .
      dockerfile: ./playwright/Dockerfile
    container_name: explorer-test-runner
    ipc: host
    depends_on:
      - trezor-user-env-unix
    network_mode: service:trezor-user-env-unix
    environment:
      - URL=$URL
      - HEADLESS=true
      - CI_JOB_URL=$CI_JOB_URL
      - CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH
      - CI_JOB_NAME=$CI_JOB_NAME
      - TEST_FILE=$TEST_FILE
      - IS_WEBEXTENSION=$IS_WEBEXTENSION
      - CORE_IN_POPUP=$CORE_IN_POPUP
      - MOBILE=$MOBILE
      - TREZOR_CONNECT_SRC=$TREZOR_CONNECT_SRC
      - GITHUB_ACTION=$GITHUB_ACTION
      - CURRENTS_PROJECT_ID=$CURRENTS_PROJECT_ID
      - CURRENTS_RECORD_KEY=$CURRENTS_RECORD_KEY
      - CURRENTS_CI_BUILD_ID=$CURRENTS_CI_BUILD_ID
    working_dir: /e2e
    command: bash -c "npx playwright install && yarn workspace @trezor/connect-popup test:e2e $TEST_FILE"
    volumes:
      - ../:/e2e
