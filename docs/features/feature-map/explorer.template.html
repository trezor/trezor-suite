                }
                .brand .sub {
                    display: none;
                }
            }
            @media (max-width: 720px) {
                body {
                    font-size: 13.5px;
                }
                .topbar {
                    flex-wrap: wrap;
                    gap: 8px;
                }
                .tabs {
                    order: 3;
                    width: 100%;
                    margin: 0;
                }
                .tabs button {
                    flex: 1;
                    justify-content: center;
                    padding: 5px 4px;
                }
                .tabs button .tl {
                    position: absolute;
                    width: 1px;
                    height: 1px;
                    overflow: hidden;
                    clip-path: inset(50%);
                }
                .topbar .tools {
                    margin-left: auto;
                }
                .tree,
                .thead,
                .layout:not(.no-detail) .tree,
                .layout:not(.no-detail) .thead {
                    --cols: minmax(0, 1fr) auto;
                }
                .thead {
                    padding: 0 12px;
                }
                .thead > .h-plats,
                .thead > .h-roll,
                .thead > .h-lk,
                .axis-pick,
                .tablev .col-level,
                .tablev .col-team {
                    display: none;
                }
                .tablev th:first-child,
                .tablev td:first-child {
                    min-width: 0 !important;
                    width: 46vw;
                    max-width: 46vw;
                }
                .tablev td .bc {
                    max-width: 100%;
                }
                .qplat button span {
                    display: none;
                }
                .trow {
                    padding: 0 12px;
                    column-gap: 8px;
                }
                .trow > .roll,
                .trow > .lk,
                .team {
                    display: none;
                }
                .trow > .plats {
                    display: none;
                }
                .lbin {
                    grid-template-columns: 1fr;
                    grid-template-rows: minmax(0, 1fr) auto;
                }
                .lbside {
                    max-height: 40vh;
                }
                .mmini,
                .mhint,
                .mzoom .wide {
                    display: none;
                }
            }
            @media (max-width: 1100px) {
                .mhint {
                    display: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="app">
            <header class="topbar">
                <button
                    class="icon-btn filters-toggle"
                    id="filtersToggle"
                    aria-controls="filters"
                    aria-expanded="false"
                >
                    <svg class="i" viewBox="0 0 16 16">
                        <path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5z" />
                    </svg>
                    <span>Filters</span><span id="filtersToggleN" class="num"></span>
                </button>
                <div class="brand">
                    <h1>Suite feature map</h1>
                    <span class="sub" id="sub"></span>
                </div>
                <nav class="tabs" aria-label="View">
                    <button data-view="tree" aria-pressed="true">
                        <svg class="i" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M3 2.5v11M3 5h4M3 10.5h4M9 5h4.5M9 10.5h4.5" /></svg
                        ><span class="tl">Tree</span>
                    </button>
                    <button data-view="overview" aria-pressed="false">
                        <svg class="i" viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="2" y="2" width="5" height="5" rx="1" />
                            <rect x="9" y="2" width="5" height="5" rx="1" />
                            <rect x="2" y="9" width="5" height="5" rx="1" />
                            <rect x="9" y="9" width="5" height="5" rx="1" /></svg
                        ><span class="tl">Overview</span>
                    </button>
                    <button data-view="gallery" aria-pressed="false">

                    <button data-view="table" aria-pressed="false">

                        ><span class="tl">Table</span>
                    </button>
                    <button data-view="map" aria-pressed="false">
                        <svg class="i" viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="5.75" y="6.25" width="4.5" height="3.5" rx="1" />
                            <circle cx="2.5" cy="3.5" r="1.25" />
                            <circle cx="2.5" cy="12.5" r="1.25" />
                            <circle cx="13.5" cy="3.5" r="1.25" />
                            <circle cx="13.5" cy="12.5" r="1.25" />
                            <path
                                d="M5.75 8C4.5 8 4.5 3.5 3.75 3.5M5.75 8c-1.25 0-1.25 4.5-2 4.5M10.25 8c1.25 0 1.25-4.5 2-4.5M10.25 8c1.25 0 1.25 4.5 2 4.5"
                            /></svg
                        ><span class="tl">Map</span>

                <div class="tools" style="display: flex; gap: 6px">
                    <button
                        class="icon-btn"
                        id="themeBtn"
                        aria-label="Toggle colour theme"
                        title="Toggle light/dark"
                    >
                        <svg class="i" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 107 7z" />
                        </svg>
                    </button>
                    <button
                        class="icon-btn"

            </header>
            <div class="statusbar" id="statusbar"></div>
            <div class="sr" id="live" aria-live="polite"></div>
            <div class="layout" id="layout">
                <aside class="filters" id="filters" aria-label="Filters"></aside>
                <main class="main" id="main" tabindex="-1"></main>
                <section class="detail" id="detail" aria-label="Feature detail"></section>
            </div>
        </div>
        <div class="scrim" id="scrim" hidden></div>
        <div class="tip" id="tip" role="tooltip"></div>
        <dialog class="lb" id="lb" aria-label="Screenshot viewer"></dialog>
        <dialog class="lb" id="help" aria-label="Legend and keyboard shortcuts"></dialog>
        <script id="feature-data" type="application/json">
            __FEATURE_DATA__
        </script>
        <script>
            'use strict';
            const DATA = JSON.parse(document.getElementById('feature-data').textContent);

            /* ---------- constants ---------- */
            const PLATFORMS = ['desktop', 'web', 'mobile'];
            const PLATFORM_LABEL = { desktop: 'Desktop', web: 'Web', mobile: 'Mobile' };
            const AXES = [
                'desktop_automated',
                'desktop_manual',
                'android_automated',
                'android_manual',
            ];
            const AXIS = {
                desktop_automated: {
                    label: 'Desktop E2E',
                    short: 'E2E',
                    group: 'desktop',
                    kind: 'Automated',
                },
                desktop_manual: {
                    label: 'Desktop manual',
                    short: 'Man',
                    group: 'desktop',
                    kind: 'Manual',
                },
                android_automated: {
                    label: 'Android E2E',
                    short: 'E2E',
                    group: 'android',
                    kind: 'Automated',
                },
                android_manual: {
                    label: 'Android manual',
                    short: 'Man',
                    group: 'android',
                    kind: 'Manual',
                },
            };
            const VIEWS = ['tree', 'overview', 'gallery', 'table', 'map'];
            const LINK_TYPES = ['related', 'screen', 'component', 'test'];
            const LINK = {
                related: {
                    label: 'Related',
                    plural: 'Related features',
                    desc: 'Explicit cross-reference in the inventory',
                },
                screen: {
                    label: 'Same screen',
                    plural: 'Shown on the same screenshot',
                    desc: 'Visible together on one runtime screenshot (errata-corrected)',
                },
                component: {
                    label: 'Shared component',
                    plural: 'Shared root component',
                    desc: 'Same dedicated root component outside the shared parent (inherited containers and siblings are skipped)',
                },
                test: {
                    label: 'Shared test',
                    plural: 'Cited by the same test',
                    desc: 'Same active test scenario (file:line) cited for a non-zero score of both features; siblings skipped',
                },
            };
            const AV_LABEL = {
                yes: 'Available',
                conditional: 'Conditional',
                no: 'Not available',
                unknown: 'Unknown',
            };
            const BUCKETS = [
                { k: 0, label: '0', name: 'No verification' },
                { k: 1, label: '1–2', name: 'Mention only' },
                { k: 3, label: '3–4', name: 'Partial happy path' },
                { k: 5, label: '5', name: 'Basic happy path' },
                { k: 6, label: '6–7', name: 'Happy path + variants' },
                { k: 8, label: '8–9', name: 'Broad coverage' },
                { k: 10, label: '10', name: 'Ideal coverage' },
            ];
            const BUCKET_COLOR = {
                0: 'var(--s0)',
                1: 'var(--s1)',
                3: 'var(--s3)',
                5: 'var(--s5)',
                6: 'var(--s6)',
                8: 'var(--s8)',
                10: 'var(--s10)',
            };
            const ICON = {
                chevron:
                    '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>',
                desktop:
                    '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1"/><path d="M5.5 13.75h5M8 11v2.75"/></svg>',
                web: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c2.1 2.2 2.1 10.3 0 12.5M8 1.75c-2.1 2.2-2.1 10.3 0 12.5"/></svg>',
                mobile: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.25" y="1.5" width="7.5" height="13" rx="1.5"/><path d="M7 12.25h2"/></svg>',
                android:
                    '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.25" y="1.5" width="7.5" height="13" rx="1.5"/><path d="M7 12.25h2"/></svg>',
                link: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5l3-3M7.2 4.6l1-1a2.6 2.6 0 013.7 3.7l-1 1M8.8 11.4l-1 1a2.6 2.6 0 01-3.7-3.7l1-1"/></svg>',
                image: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><circle cx="5.75" cy="6.25" r="1.25"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3"/></svg>',
                code: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg>',
                search: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
                x: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
                ext: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5L8 8M11.5 9.5v3a1 1 0 01-1 1h-7a1 1 0 01-1-1v-7a1 1 0 011-1h3"/></svg>',
                copy: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.25"/><path d="M3 10.5V3.5a1 1 0 011-1h6.5"/></svg>',
                plus: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>',
                minus: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>',
                download:
                    '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M2.5 13.5h11"/></svg>',
                team: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.25"/><path d="M2 13c.5-2.3 2-3.5 4-3.5s3.5 1.2 4 3.5M10.5 3.6a2.25 2.25 0 010 4.1M12 9.8c1 .5 1.7 1.6 2 3.2"/></svg>',
                warn: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3.25M8 11.75v.01"/></svg>',
                up: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>',
                down: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>',
            };
            const smallIcon = (name, px = 12) =>
                ICON[name].replace('class="i"', `class="i" style="width:${px}px;height:${px}px"`);

            /* ---------- indexes ---------- */
            const F = DATA.features;
            const byId = new Map(F.map(f => [f.id, f]));
            const kids = new Map();
            for (const f of F) {
                if (!kids.has(f.parent)) kids.set(f.parent, []);
                kids.get(f.parent).push(f);
            }
            for (const list of kids.values())
                list.sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
            const ROOTS = kids.get(null) || [];
            const DFS = [];
            (function walk(list) {
                for (const f of list) {
                    DFS.push(f);
                    walk(kids.get(f.id) || []);
                }
            })(ROOTS);
            const dfsIndex = new Map(DFS.map((f, i) => [f.id, i]));
            function ancestorsOf(f) {
                const out = [];
                let p = f.parent ? byId.get(f.parent) : null;
                while (p) {
                    out.unshift(p);
                    p = p.parent ? byId.get(p.parent) : null;
                }
                return out;
            }
            const descCache = new Map();
            function descendants(f) {
                if (descCache.has(f.id)) return descCache.get(f.id);
                const out = [];
                for (const k of kids.get(f.id) || []) out.push(k, ...descendants(k));
                descCache.set(f.id, out);
                return out;
            }
            for (const f of F) {
                f.ancestors = ancestorsOf(f);
                f.area = f.ancestors[0] || f;
                f.kidCount = (kids.get(f.id) || []).length;
                f.screensAll = (f.screens || []).filter(id => DATA.screens[id]);
                f.searchText = [
                    f.name,
                    f.id,
                    f.description,
                    (f.breadcrumb || []).join(' '),
                    f.team,
                    f.backend_team,
                    ...Object.values(f.navigation || {}),
                    ...(f.roots || []).map(r => r.path + ' ' + (r.symbol || '')),
                ]
                    .filter(Boolean)
                    .join(' \u0001 ')
                    .toLowerCase();
            }
            const adj = new Map(F.map(f => [f.id, []]));
            for (const l of DATA.links) {
                if (!adj.has(l.a) || !adj.has(l.b)) continue;
                adj.get(l.a).push({ id: l.b, type: l.type, via: l.via });
                adj.get(l.b).push({ id: l.a, type: l.type, via: l.via });
            }
            const TEAMS = [...new Set(F.flatMap(f => [f.team, f.backend_team]))].sort((a, b) =>
                a.localeCompare(b),
            );
            const SCREEN_LIST = Object.entries(DATA.screens).map(([id, s]) => ({ id, ...s }));
            /* Device variants: captures of one screen on several simulators share a group; one variant shows at a time. */
            const PREFERRED_DEVICES = DATA.preferred_devices || [];
            const deviceRank = d => {
                const i = PREFERRED_DEVICES.indexOf(d);
                return i < 0 ? PREFERRED_DEVICES.length : i;
            };
            const DEVICES = [...new Set(SCREEN_LIST.map(s => s.device).filter(Boolean))].sort(
                (a, b) => deviceRank(a) - deviceRank(b) || a.localeCompare(b),
            );
            const VARIANTS = new Map();
            for (const s of SCREEN_LIST) {
                const g = s.group || s.id;
                if (!VARIANTS.has(g)) VARIANTS.set(g, []);
                VARIANTS.get(g).push(s.id);
            }
            const variantsOf = id => VARIANTS.get(DATA.screens[id]?.group || id) || [id];
            function pickVariant(ids) {
                const on = d => ids.find(i => DATA.screens[i].device === d);
                return on(state.device) ?? DEVICES.map(on).find(Boolean) ?? ids[0];
            }
            /* A capture is shown when its platform is shown and it is the chosen device variant of its screen. */
            function screenShown(id) {
                const s = DATA.screens[id];
                if (!s || !state.plat.includes(s.platform)) return false;
                const v = variantsOf(id);
                return v.length < 2 || pickVariant(v) === id;
            }
            const shotDevice = s => s.model || s.device || PLATFORM_LABEL[s.platform];

            /* ---------- state ---------- */
            const DEFAULT = {
                view: 'tree',
                q: '',
                sel: null,
                plat: ['desktop', 'web', 'mobile'],
                teams: [],
                levels: [],
                shots: 'any',
                axis: 'desktop_automated',
                thumbs: 'small',
                gsize: 'm',
                linked: null,
                ltypes: ['related', 'screen', 'component'],
                sort: 'tree',
                dir: 1,
                missing: null,
                mlinks: 'sel',
                device: DEVICES[0] || null,
            };
            const state = structuredClone(DEFAULT);
            let expanded = new Set();
            let userExpanded = null;
            let lastAutoKey = '';
            let lastHist = { view: null, sel: undefined };

            function store(key, value) {
                try {
                    localStorage.setItem('suite-feature-map:' + key, value);
                } catch (e) {
                    /* storage unavailable */
                }
            }
            function load(key) {
                try {
                    return localStorage.getItem('suite-feature-map:' + key);
                } catch (e) {
                    return null;
                }
            }

            function readHash() {
                let p;
                try {
                    p = new URLSearchParams(location.hash.slice(1));
                } catch (e) {
                    p = new URLSearchParams();
                }
                const s = structuredClone(DEFAULT);
                if (VIEWS.includes(p.get('v'))) s.view = p.get('v');
                if (p.has('q')) s.q = p.get('q');
                if (p.has('f')) {
                    if (byId.has(p.get('f'))) s.sel = p.get('f');
                    else s.missing = p.get('f');
                }
                if (p.has('p')) {
                    const pl = PLATFORMS.filter(x => p.get('p').split(',').includes(x));
                    if (pl.length) s.plat = pl;
                }
                if (p.has('t'))
                    s.teams = p
                        .get('t')
                        .split('|')
                        .filter(t => TEAMS.includes(t));
                if (p.has('l'))
                    s.levels = p
                        .get('l')
                        .split(',')
                        // Bookmarks from before the rename still say option.
                        .map(l => (l === 'option' ? 'intent' : l))
                        .filter(l => ['area', 'feature', 'intent'].includes(l));
                if (['with', 'without'].includes(p.get('s'))) s.shots = p.get('s');
                if (AXIS[p.get('ax')]) s.axis = p.get('ax');
                if (['off', 'small', 'large'].includes(p.get('th'))) s.thumbs = p.get('th');
                if (['s', 'm', 'l'].includes(p.get('gs'))) s.gsize = p.get('gs');
                if (p.has('lk')) {
                    if (byId.has(p.get('lk'))) s.linked = p.get('lk');
                    else s.missing = s.missing || p.get('lk');
                }
                if (p.has('lt'))
                    s.ltypes = LINK_TYPES.filter(t => p.get('lt').split(',').includes(t));
                if (p.has('o')) s.sort = p.get('o');
                if (p.get('d') === '-1') s.dir = -1;
                if (p.get('ml') === 'all') s.mlinks = 'all';
                if (DEVICES.includes(p.get('dv'))) s.device = p.get('dv');
                return s;
            }
            function writeHash(push = false) {
                const p = new URLSearchParams();
                if (state.view !== DEFAULT.view) p.set('v', state.view);
                if (state.sel) p.set('f', state.sel);
                if (state.q) p.set('q', state.q);
                if (state.plat.length !== 3) p.set('p', state.plat.join(','));
                if (state.teams.length) p.set('t', state.teams.join('|'));
                if (state.levels.length) p.set('l', state.levels.join(','));
                if (state.shots !== 'any') p.set('s', state.shots);
                if (state.axis !== DEFAULT.axis) p.set('ax', state.axis);
                if (state.thumbs !== DEFAULT.thumbs) p.set('th', state.thumbs);
                if (state.gsize !== DEFAULT.gsize) p.set('gs', state.gsize);
                if (state.linked) p.set('lk', state.linked);
                if (state.device !== DEFAULT.device) p.set('dv', state.device);
                if (state.ltypes.join(',') !== DEFAULT.ltypes.join(','))
                    p.set('lt', state.ltypes.join(','));
                if (state.sort !== 'tree') p.set('o', state.sort);
                if (state.dir === -1) p.set('d', '-1');
                if (state.mlinks !== DEFAULT.mlinks) p.set('ml', state.mlinks);
                const h = p.toString();
                const url = h ? '#' + h : location.pathname + location.search;
                push =
                    push &&
                    lastHist.sel !== undefined &&
                    (lastHist.view !== state.view || lastHist.sel !== state.sel);
                try {
                    if (push) history.pushState(null, '', url);
                    else history.replaceState(null, '', url);
                } catch (e) {
                    /* history unavailable */
                }
                lastHist = { view: state.view, sel: state.sel };
                lastAppliedHash = location.hash;
            }
            let lastAppliedHash = null;

            /* ---------- helpers ---------- */
            const $ = id => document.getElementById(id);
            const esc = s =>
                String(s ?? '').replace(
                    /[&<>"']/g,
                    c =>
                        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[
                            c
                        ],
                );
            const fmt = n => n.toLocaleString('en-US');
            const terms = () => state.q.toLowerCase().split(/\s+/).filter(Boolean);
            function hl(text) {
                const t = terms();
                if (!t.length) return esc(text);
                const re = new RegExp(
                    '(' + t.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')',
                    'gi',
                );
                return String(text)
                    .split(re)
                    .map((part, i) => (i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part)))
                    .join('');
            }
            function bucket(score) {
                if (score == null) return null;
                if (score === 0) return 0;
                if (score <= 2) return 1;
                if (score <= 4) return 3;
                if (score === 5) return 5;
                if (score <= 7) return 6;
                if (score <= 9) return 8;
                return 10;
            }
            const axisVisible = axis =>
                AXIS[axis].group === 'android'
                    ? state.plat.includes('mobile')
                    : state.plat.includes('desktop') || state.plat.includes('web');
            const visibleAxes = () => AXES.filter(axisVisible);
            /* An axis has no meaningful score when unassessed, or when the platform lacks the feature and no test checks that state. */
            const isNA = c =>
                !c || c.score == null || (c.applicability === 'not-supported' && !c.score);
            function scoreText(c) {
                if (!c || c.score == null) return 'not assessed';
                if (isNA(c)) return 'not on this platform';
                return c.score + ' of 10';
            }
            function scoreCell(f, axis) {
                const c = f.coverage[axis];
                const a = AXIS[axis];
                const tip = `data-tip-score="${esc(f.id)}|${axis}"`;
                if (!c || c.score == null)
                    return `<span class="sc un" ${tip} role="img" aria-label="${a.label}: not assessed">?</span>`;
                if (isNA(c))
                    return `<span class="sc na" ${tip} role="img" aria-label="${a.label}: not on this platform">–</span>`;
                return `<span class="sc b${bucket(c.score)}" ${tip} role="img" aria-label="${a.label}: ${c.score} of 10">${c.score}</span>`;
            }
            function avGlyph(status, label) {
                const s = AV_LABEL[status] ? status : 'unknown';
                const body =
                    s === 'yes'
                        ? '<circle cx="6" cy="6" r="4.75" fill="var(--av-yes)"/>'
                        : s === 'conditional'
                          ? '<circle cx="6" cy="6" r="4.25" fill="none" stroke="var(--av-yes)" stroke-width="1.3"/><path d="M6 1.75a4.25 4.25 0 000 8.5z" fill="var(--av-yes)"/>'
                          : s === 'no'
                            ? '<circle cx="6" cy="6" r="4.25" fill="none" stroke="var(--av-no)" stroke-width="1.3"/><path d="M3.2 8.8l5.6-5.6" stroke="var(--av-no)" stroke-width="1.3"/>'
                            : '<circle cx="6" cy="6" r="4.25" fill="none" stroke="var(--ink-3)" stroke-width="1.3" stroke-dasharray="2 1.6"/>';
                const a11y = label
                    ? `role="img" aria-label="${esc(label)}: ${AV_LABEL[s]}"`
                    : 'aria-hidden="true"';
                return `<svg class="av" viewBox="0 0 12 12" ${a11y}>${body}</svg>`;
            }
            const screensFor = f => f.screensAll.filter(screenShown);
            let linkCache = new Map();
            /* Connections of f restricted to link types and to screenshots on shown platforms; Map<otherId, {types, via}>. */
            function linkGroups(f, types = state.ltypes) {
                const key = f.id + '|' + types.join(',');
                if (linkCache.has(key)) return linkCache.get(key);
                const m = new Map();
                for (const l of adj.get(f.id)) {
                    if (!types.includes(l.type)) continue;
                    let via = l.via;
                    if (l.type === 'screen') {
                        via = via.filter(screenShown);
                        if (!via.length) continue;
                    }
                    if (!m.has(l.id)) m.set(l.id, { id: l.id, types: [], via: {} });
                    const e = m.get(l.id);
                    e.types.push(l.type);
                    e.via[l.type] = via;
                }
                linkCache.set(key, m);
                return m;
            }

            /* ---------- filtering ---------- */
            function availOn(f, p) {
                const s = f.platforms?.[p];
                return s === 'yes' || s === 'conditional';
            }
            function matches(f) {
                const t = terms();
                if (t.length && !t.every(x => f.searchText.includes(x))) return false;
                if (!state.plat.some(p => availOn(f, p))) return false;
                if (
                    state.teams.length &&
                    !state.teams.includes(f.team) &&
                    !state.teams.includes(f.backend_team)
                )
                    return false;
                if (state.levels.length && !state.levels.includes(f.level)) return false;
                if (state.shots !== 'any' && (state.shots === 'with') !== screensFor(f).length > 0)
                    return false;
                if (
                    state.linked &&
                    f.id !== state.linked &&
                    !linkGroups(byId.get(state.linked)).has(f.id)
                )
                    return false;
                return true;
            }
            let MATCH = new Set();
            let CONTEXT = new Set();
            function filtersActive() {
                return narrowingActive() || state.plat.length !== 3;
            }
            /* Filters that pick out specific features; platform/availability changes alone keep the user's expansion. */
            function narrowingActive() {
                return (
                    !!state.q ||
                    state.teams.length > 0 ||
                    state.levels.length > 0 ||
                    state.shots !== 'any' ||
                    !!state.linked
                );
            }
            const AUTO_EXPAND_LIMIT = 160;
            function compute() {
                linkCache = new Map();
                MATCH = new Set(F.filter(matches).map(f => f.id));
                CONTEXT = new Set();
                for (const id of MATCH)
                    for (const a of byId.get(id).ancestors) if (!MATCH.has(a.id)) CONTEXT.add(a.id);
                const key = JSON.stringify([
                    state.q,
                    state.plat,
                    state.teams,
                    state.levels,
                    state.shots,
                    state.linked,
                    state.ltypes,
                ]);
                if (key === lastAutoKey) return;
                lastAutoKey = key;
                if (narrowingActive() && MATCH.size <= AUTO_EXPAND_LIMIT) {
                    if (!userExpanded) userExpanded = new Set(expanded);
                    expanded = new Set();
                    for (const id of MATCH)
                        for (const a of byId.get(id).ancestors) expanded.add(a.id);
                    if (state.sel) reveal(state.sel);
                } else if (!narrowingActive() && userExpanded) {
                    expanded = userExpanded;
                    userExpanded = null;
                    if (state.sel) reveal(state.sel);
                }
            }

            /* ---------- focus preservation across re-renders ---------- */
            const FOCUS_ATTRS = [
                'data-plat',
                'data-set',
                'data-value',
                'data-team',
                'data-level',
                'data-ltype',
                'data-act',
                'data-sort',
                'data-view',
                'data-toggle',
                'data-id',
                'data-axis-select',
            ];
            function focusSelector(el) {
                if (!el || el === document.body || el === document.documentElement) return null;
                if (el.id) return '#' + CSS.escape(el.id);
                const parts = FOCUS_ATTRS.filter(a => el.hasAttribute(a)).map(
                    a => `[${a}="${CSS.escape(el.getAttribute(a))}"]`,
                );
                if (!parts.length) return null;
                const scope = el.closest('#filters, #main, #detail, #statusbar, .topbar');
                const prefix = scope ? (scope.id ? '#' + scope.id : '.topbar') + ' ' : '';
                return prefix + el.tagName.toLowerCase() + parts.join('');
            }
            function keepFocus(fn) {
                const sel = focusSelector(document.activeElement);
                fn();
                if (!sel) return;
                const active = document.activeElement;
                if (active && active !== document.body && document.contains(active)) return;
                const el = document.querySelector(sel);
                if (el) el.focus({ preventScroll: true });
            }

            /* ---------- status bar ---------- */
            function chip(label, clear) {
                return `<span class="chip">${label}<button data-clear="${clear}" aria-label="Remove filter: ${esc(label.replace(/<[^>]+>/g, ''))}">${ICON.x}</button></span>`;
            }
            function platformSwitch(cls) {
                return `<span class="${cls}" role="group" aria-label="Shown platforms">${PLATFORMS.map(
                    p =>
                        `<button data-plat="${p}" aria-pressed="${state.plat.includes(p)}" title="${state.plat.includes(p) ? 'Hide' : 'Show'} ${PLATFORM_LABEL[p]}">${ICON[p]}<span>${PLATFORM_LABEL[p]}</span></button>`,
                ).join('')}</span>`;
            }
            function renderStatus() {
                const total = F.length;
                const parts = [
                    platformSwitch('qplat'),
                    `<span class="count num">${fmt(MATCH.size)} <span class="muted">of ${fmt(total)} features</span></span>`,
                ];
                if (state.missing)
                    parts.push(
                        chip(`Feature “${esc(state.missing)}” is not in this build`, 'missing'),
                    );
                if (state.q) parts.push(chip(`Search: “${esc(state.q)}”`, 'q'));
                if (state.teams.length)
                    parts.push(chip('Team: ' + state.teams.map(esc).join(', '), 'teams'));
                if (state.levels.length)
                    parts.push(chip('Level: ' + state.levels.join(', '), 'levels'));
                if (state.shots !== 'any')
                    parts.push(
                        chip(
                            state.shots === 'with' ? 'Has screenshots' : 'No screenshots',
                            'shots',
                        ),
                    );
                if (state.linked)
                    parts.push(
                        chip(`Connected to “${esc(byId.get(state.linked).name)}”`, 'linked'),
                    );
                const n = parts.length - 2;
                if (n > 0)
                    parts.push('<button class="link-btn" data-clear="all">Clear all</button>');
                else
                    parts.push(
                        '<span class="muted" style="font-size:12.5px">Select a feature for details · <kbd>?</kbd> legend</span>',
                    );
                $('statusbar').innerHTML = parts.join('');
                const filterCount = n - (state.missing ? 1 : 0) + (state.plat.length !== 3 ? 1 : 0);
                $('filtersToggleN').textContent = filterCount > 0 ? ' · ' + filterCount : '';
                $('live').textContent = `${MATCH.size} features match`;
            }

            /* ---------- filters panel ---------- */
            function renderFilters() {
                const counts = new Map();
                for (const f of F) {
                    for (const t of new Set([f.team, f.backend_team]))
                        counts.set('t:' + t, (counts.get('t:' + t) || 0) + 1);
                    counts.set('l:' + f.level, (counts.get('l:' + f.level) || 0) + 1);
                }
                const seg = (name, value, options) =>
                    `<div class="seg" role="group">${options
                        .map(
                            ([v, l, dis]) =>
                                `<button data-set="${name}" data-value="${v}" aria-pressed="${value === v}"${dis ? ' disabled' : ''}>${l}</button>`,
                        )
                        .join('')}</div>`;
                const html = [];
                html.push(
                    `<div class="drawer-head"><span>Filters</span><button class="icon-btn" data-act="close-filters" aria-label="Close filters">${ICON.x}</button></div>`,
                );
                html.push(
                    `<div class="fgroup"><div class="search">${ICON.search}<input id="q" type="search" placeholder="Search names, IDs, paths, teams" value="${esc(state.q)}" autocomplete="off" spellcheck="false" aria-label="Search features"><kbd>/</kbd></div></div>`,
                );
                html.push(
                    `<div class="fgroup"><h2>Platforms</h2><div class="plat-toggles">${PLATFORMS.map(
                        p =>
                            `<button class="toggle-btn" data-plat="${p}" aria-pressed="${state.plat.includes(p)}">${ICON[p]} ${PLATFORM_LABEL[p]}</button>`,
                    ).join('')}</div></div>`,
                );
                html.push(
                    `<div class="fgroup"><h2>Team ${state.teams.length ? '<button class="link-btn" data-clear="teams">Reset</button>' : ''}</h2>${TEAMS.filter(
                        t => counts.get('t:' + t) || state.teams.includes(t),
                    )
                        .map(
                            t =>
                                `<label class="check"><input type="checkbox" data-team="${esc(t)}" ${state.teams.includes(t) ? 'checked' : ''}> ${esc(t)}<span class="n num">${counts.get('t:' + t) || 0}</span></label>`,
                        )
                        .join('')}</div>`,
                );
                html.push(
                    `<div class="fgroup"><h2>Level</h2>${['area', 'feature', 'intent']
                        .map(
                            l =>
                                `<label class="check"><input type="checkbox" data-level="${l}" ${state.levels.includes(l) ? 'checked' : ''}> ${{ area: 'Area', feature: 'Feature', intent: 'Intent' }[l]}<span class="n num">${counts.get('l:' + l) || 0}</span></label>`,
                        )
                        .join('')}</div>`,
                );
                html.push(
                    `<div class="fgroup"><h2>Screenshots</h2>
                    <p class="row-label" style="margin-top:0">Feature has screenshots</p>${seg(
                        'shots',
                        state.shots,
                        [
                            ['any', 'Any'],
                            ['with', 'With'],
                            ['without', 'Without'],
                        ],
                    )}
                <p class="row-label">Thumbnails in tree and map</p>${seg('thumbs', state.thumbs, [
                    ['off', 'Off'],
                    ['small', 'Small'],
                    ['large', 'Large'],
                ])}${
                    DEVICES.length > 1
                        ? `<p class="row-label">iPhone model</p>${seg(
                              'device',
                              state.device,
                              DEVICES.map(d => [d, esc(d)]),
                          )}`
                        : ''
                }</div>`,
                );
                $('filters').innerHTML = html.join('');
            }

            /* ---------- tree ---------- */
            function rollup(f, axis) {
                const counts = { na: 0, un: 0 };
                for (const b of BUCKETS) counts[b.k] = 0;
                for (const d of descendants(f)) {
                    if (!MATCH.has(d.id)) continue;
                    const c = d.coverage[axis];
                    if (!c || c.score == null) counts.un++;
                    else if (isNA(c)) counts.na++;
                    else counts[bucket(c.score)]++;
                }
                return counts;
            }
            function rollLabel(f, axis, c) {
                return (
                    `${AXIS[axis].label} in subtree: ` +
                    BUCKETS.filter(b => c[b.k])
                        .map(b => `${c[b.k]} scored ${b.label}`)
                        .join(', ') +
                    (c.un ? `, ${c.un} not assessed` : '')
                );
            }
            function rollBar(f, axis) {
                const c = rollup(f, axis);
                const segs = BUCKETS.filter(b => c[b.k]).map(
                    b => `<span class="r${b.k}" style="flex:${c[b.k]}"></span>`,
                );
                if (c.un) segs.push(`<span class="run" style="flex:${c.un}"></span>`);
                if (!segs.length) return '<span class="roll"></span>';
                return `<span class="roll" data-tip-roll="${esc(f.id)}" role="img" aria-label="${esc(rollLabel(f, axis, c))}">${segs.join('')}</span>`;
            }
            let selGroups = new Map();
            function linkCell(f) {
                if (state.sel && state.sel !== f.id) {
                    const g = selGroups.get(f.id);
                    let inside = '';
                    if (f.kidCount && !expanded.has(f.id)) {
                        const n = descendants(f).filter(
                            d => selGroups.has(d.id) && (MATCH.has(d.id) || CONTEXT.has(d.id)),
                        ).length;
                        if (n)
                            inside = `<button class="lk-in num" data-toggle="${esc(f.id)}" tabindex="-1" title="${n} connected feature${n === 1 ? '' : 's'} inside; expand">+${n}</button>`;
                    }
                    if (g || inside)
                        return `<span class="lk"${g ? ` data-tip-link="${esc(f.id)}"` : ''}>${g ? g.types.map(t => `<span class="ldot ${t}" role="img" aria-label="${LINK[t].label}"></span>`).join('') : ''}${inside}</span>`;
                }
                const n = linkGroups(f).size;
                return n
                    ? `<span class="lk num" title="${n} connected feature${n === 1 ? '' : 's'}">${smallIcon('link')}${n}</span>`
                    : '<span class="lk"></span>';
            }
            function thumbsHtml(f) {
                if (state.thumbs === 'off') return '';
                const ids = screensFor(f);
                if (!ids.length) return '';
                const max = state.thumbs === 'large' ? 5 : 7;
                return `<div class="thumbs">${ids
                    .slice(0, max)
                    .map(
                        id =>
                            `<button data-shot="${esc(id)}" data-shots="${esc(ids.join(','))}" tabindex="-1" aria-label="Open screenshot: ${esc(DATA.screens[id].caption)}"><img loading="lazy" decoding="async" src="${esc(DATA.screens[id].src)}" alt=""></button>`,
                    )
                    .join(
                        '',
                    )}${ids.length > max ? `<span class="more">+${ids.length - max}</span>` : ''}</div>`;
            }
            const showsKids = f =>
                (kids.get(f.id) || []).some(k => MATCH.has(k.id) || CONTEXT.has(k.id));
            const teamLabel = f =>
                f.backend_team && f.backend_team !== f.team
                    ? f.team + ' / ' + f.backend_team
                    : f.team;
            function rowTeam(f) {
                const t = teamLabel(f);
                const parent = f.parent ? teamLabel(byId.get(f.parent)) : null;
                return t !== parent ? t : '';
            }
            function treeRow(f, focusId) {
                const hasKids = showsKids(f);
                const open = expanded.has(f.id);
                const ctx = CONTEXT.has(f.id);
                const plats = state.plat
                    .map(
                        p =>
                            `<span data-tip-av="${esc(f.id)}|${p}">${avGlyph(f.platforms?.[p], PLATFORM_LABEL[p])}</span>`,
                    )
                    .join('');
                const groups = ['desktop', 'android']
                    .map(g => AXES.filter(a => AXIS[a].group === g && axisVisible(a)))
                    .filter(g => g.length);
                const covs = groups
                    .map(g => `<span class="pair">${g.map(a => scoreCell(f, a)).join('')}</span>`)
                    .join('');
                const kidN = (kids.get(f.id) || []).filter(
                    k => MATCH.has(k.id) || CONTEXT.has(k.id),
                ).length;
                const team = rowTeam(f);
                const sel = state.sel === f.id;
                return `<div class="trow${f.level === 'area' ? ' area' : ''}${sel ? ' sel' : ''}${ctx ? ' ctx' : ''}" role="treeitem" aria-level="${f.depth + 1}" aria-selected="${sel}" ${hasKids ? `aria-expanded="${open}"` : ''} aria-label="${esc(f.name)}${ctx ? ' (context)' : ''}" tabindex="${focusId === f.id ? 0 : -1}" data-id="${esc(f.id)}" style="--d:${f.depth}">
                    <div class="tname"><div class="line">
                        <button class="twisty${hasKids ? '' : ' leaf'}" data-toggle="${esc(f.id)}" aria-hidden="true" tabindex="-1">${ICON.chevron}</button>
                        <span class="label" title="${esc(f.name)}">${hl(f.name)}</span>
                        ${kidN ? `<span class="kids num" aria-hidden="true">${kidN}</span>` : ''}
                        ${f.scope === 'internal-reference' ? '<span class="tag">internal</span>' : ''}
                        ${team ? `<span class="team"${team.includes(' / ') ? ' title="Frontend team / backend team"' : ''}>${esc(team)}</span>` : ''}
                    </div></div>
                    <div class="plats">${plats}</div>
                    <div class="covs">${covs}</div>
                    ${f.kidCount ? rollBar(f, state.axis) : '<span class="roll"></span>'}
                    ${linkCell(f)}
                    ${ctx ? '' : thumbsHtml(f)}
                </div>`;
            }
            function visibleRows() {
                const rows = [];
                (function walk(list) {
                    for (const f of list) {
                        if (!MATCH.has(f.id) && !CONTEXT.has(f.id)) continue;
                        rows.push(f);
                        if (expanded.has(f.id)) walk(kids.get(f.id) || []);
                    }
                })(ROOTS);
                return rows;
            }
            function axisSelect(label, cls = '') {
                return `<label class="${cls}">${label} <select data-axis-select style="height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel)">${visibleAxes()
                    .map(
                        a =>
                            `<option value="${a}"${state.axis === a ? ' selected' : ''}>${AXIS[a].label}</option>`,
                    )
                    .join('')}</select></label>`;
            }
            function scoreLegend() {
                return `<span class="legend" aria-label="Score legend">${BUCKETS.map(b => `<span class="item" title="${esc(b.name)}"><span class="sc b${b.k}">${b.label}</span></span>`).join('')}<span class="item"><span class="sc na">–</span>n/a</span></span>`;
            }
            function renderTree() {
                const rows = visibleRows();
                selGroups = state.sel ? linkGroups(byId.get(state.sel)) : new Map();
                const focusId = rows.some(r => r.id === state.sel) ? state.sel : rows[0]?.id;
                const platW = state.plat.length * 18 + (state.plat.length - 1) * 6;
                const groups = ['desktop', 'android']
                    .map(g => AXES.filter(a => AXIS[a].group === g && axisVisible(a)))
                    .filter(g => g.length);
                const covW =
                    groups.reduce((w, g) => w + g.length * 24 + (g.length - 1) * 4, 0) +
                    (groups.length - 1) * 8;
                const head = `<div class="thead" aria-hidden="true">
                    <div>Feature <span class="muted">· ${fmt(MATCH.size)} match</span></div>
                    <div class="grp plats h-plats">${state.plat.map(p => `<span title="${PLATFORM_LABEL[p]} availability">${ICON[p]}</span>`).join('')}</div>
                    <div class="covhead">${groups
                        .map(
                            g =>
                                `<div title="${AXIS[g[0]].group === 'android' ? 'Android' : 'Desktop & web'} test coverage">${ICON[AXIS[g[0]].group === 'android' ? 'android' : 'desktop']}<span class="pair">${g
                                    .map(
                                        a =>
                                            `<span title="${AXIS[a].label}">${AXIS[a].short}</span>`,
                                    )
                                    .join('')}</span></div>`,
                        )
                        .join('')}</div>
                    <div class="h-roll" title="Distribution of ${esc(AXIS[state.axis].label)} scores in each subtree">Subtree</div>
                    <div class="h-lk" style="text-align:right" title="Connections">${ICON.link}</div>
                </div>`;
                const bar = `<div class="viewbar">
                    <button class="icon-btn" data-act="expand-all" title="Expand all">${ICON.plus}<span>Expand all</span></button>
                    <button class="icon-btn" data-act="collapse-all" title="Collapse all">${ICON.minus}<span>Collapse</span></button>
                    <span class="spacer"></span>
                    ${scoreLegend()}
                    ${axisSelect('Subtree bars', 'axis-pick')}
                </div>`;
                const body = rows.length
                    ? rows.map(f => treeRow(f, focusId)).join('')
                    : `<div class="empty"><h3>No features match</h3><p>Loosen a filter or <button class="link-btn" data-clear="all">clear all filters</button>.</p></div>`;
                $('main').innerHTML =
                    `${bar}<div class="treewrap" style="--plat-w:${platW}px;--cov-w:${Math.max(covW, 24)}px;--thumb-h:${state.thumbs === 'large' ? 120 : 54}px">${head}<div class="tree" role="tree" aria-label="Feature hierarchy" aria-multiselectable="false">${body}</div></div>`;
            }

            /* ---------- overview ---------- */
            function avg(list, axis) {
                const v = list.map(f => f.coverage[axis]).filter(c => !isNA(c));
                if (!v.length) return null;
                return {
                    mean: v.reduce((s, c) => s + c.score, 0) / v.length,
                    n: v.length,
                    ok: v.filter(c => c.score >= 5).length,
                    zero: v.filter(c => c.score === 0).length,
                };
            }
            function distBar(list, axis) {
                const counts = {};
                for (const b of BUCKETS) counts[b.k] = 0;
                for (const f of list) {
                    const c = f.coverage[axis];
                    if (!isNA(c)) counts[bucket(c.score)]++;
                }
                const label = BUCKETS.filter(b => counts[b.k])
                    .map(b => `${counts[b.k]} scored ${b.label}`)
                    .join(', ');
                return `<div class="dist" role="img" aria-label="${esc(label)}">${BUCKETS.filter(
                    b => counts[b.k],
                )
                    .map(
                        b =>
                            `<span style="flex:${counts[b.k]};background:${BUCKET_COLOR[b.k]}" title="${b.label}: ${counts[b.k]} features"></span>`,
                    )
                    .join('')}</div>`;
            }
            function heatCell(a) {
                if (!a)
                    return '<span class="heat"><span class="sc na" style="width:34px">–</span></span>';
                return `<span class="heat"><span class="sc b${bucket(Math.round(a.mean))}" style="width:34px">${a.mean.toFixed(1)}</span><small title="Share of features scored 5 or more">${Math.round((100 * a.ok) / a.n)}%</small></span>`;
            }
            function avBar(list, p) {
                const c = { yes: 0, conditional: 0, no: 0, unknown: 0 };
                for (const f of list) c[AV_LABEL[f.platforms?.[p]] ? f.platforms[p] : 'unknown']++;
                const t = list.length || 1;
                const label = `${PLATFORM_LABEL[p]}: ${c.yes} available, ${c.conditional} conditional, ${c.no} not available, ${c.unknown} unknown`;
                return `<span class="avbar" title="${label}" role="img" aria-label="${label}">${[
                    'yes',
                    'conditional',
                    'no',
                    'unknown',
                ]
                    .filter(k => c[k])
                    .map(k => `<span class="${k}" style="flex:${c[k] / t}"></span>`)
                    .join('')}</span>`;
            }
            function renderOverview() {
                const matched = F.filter(f => MATCH.has(f.id));
                const axes = visibleAxes();
                const kpis = axes
                    .map(axis => {
                        const a = avg(matched, axis);
                        return `<div class="kpi"><div class="t">${ICON[AXIS[axis].group === 'android' ? 'android' : 'desktop']}${AXIS[axis].label}</div>
                        <div class="v">${a ? a.mean.toFixed(1) : '–'}<small>${a ? `mean · ${Math.round((100 * a.ok) / a.n)}% ≥ 5 · ${a.zero} at 0` : 'no applicable features'}</small></div>
                        ${distBar(matched, axis)}</div>`;
                    })
                    .join('');
                const shotN = matched.filter(f => screensFor(f).length).length;
                const areas = ROOTS.filter(r => MATCH.has(r.id) || CONTEXT.has(r.id));
                const areaRows = areas
                    .map(r => {
                        const list = [r, ...descendants(r)].filter(f => MATCH.has(f.id));
                        const shots = list.filter(f => screensFor(f).length).length;
                        return `<tr data-id="${esc(r.id)}" class="${state.sel === r.id ? 'sel' : ''}"><td><button class="thbtn" data-id="${esc(r.id)}" style="font-weight:650">${esc(r.name)}</button></td><td class="num">${list.length}</td>${state.plat
                            .map(p => `<td>${avBar(list, p)}</td>`)
                            .join(
                                '',
                            )}${axes.map(a => `<td>${heatCell(avg(list, a))}</td>`).join('')}<td class="num">${list.length ? Math.round((100 * shots) / list.length) : 0}%</td></tr>`;
                    })
                    .join('');
                const cols = 3 + state.plat.length + axes.length;
                const land = areas
                    .map(r => {
                        const all = [r, ...descendants(r)];
                        const inMatch = all.filter(f => MATCH.has(f.id));
                        const a = avg(inMatch, state.axis);
                        const tiles = all
                            .map(f => {
                                const c = f.coverage[state.axis];
                                const cls =
                                    !c || c.score == null
                                        ? 'un'
                                        : isNA(c)
                                          ? 'na'
                                          : 'b' + bucket(c.score);
                                return `<button class="tile ${cls} lvl-${esc(f.level)}${MATCH.has(f.id) ? '' : ' out'}${state.sel === f.id ? ' sel' : ''}" data-id="${esc(f.id)}" data-tip-feature="${esc(f.id)}" aria-label="${esc(f.name)}: ${AXIS[state.axis].label} ${scoreText(c)}${MATCH.has(f.id) ? '' : ' (outside filter)'}"></button>`;
                            })
                            .join('');
                        return `<section><h3><button data-id="${esc(r.id)}">${esc(r.name)}</button><span class="muted num">${inMatch.length} · ${a ? 'mean ' + a.mean.toFixed(1) : 'n/a'}</span></h3><div class="tiles">${tiles}</div></section>`;
                    })
                    .join('');
                $('main').innerHTML =
                    `<div class="viewbar">${axisSelect('Colour landscape by')}<span class="spacer"></span>${scoreLegend()}</div>
                <div class="ov">
                    <div class="card"><header><h2>Coverage at a glance</h2><p>${fmt(matched.length)} features in view · ${fmt(shotN)} with screenshots · means exclude features that do not exist on the platform</p></header><div class="kpis">${kpis || '<div class="kpi"><div class="t">Show a platform to see its coverage.</div></div>'}</div></div>
                    <div class="card"><header><h2>Areas</h2><p>Availability: solid = available, striped = conditional, outline = not available. Cells show the mean score and the share scoring 5+.</p></header>
                    <div class="ovtable-wrap"><table><thead><tr><th>Area</th><th>Features</th>${state.plat.map(p => `<th>${ICON[p]} ${PLATFORM_LABEL[p]}</th>`).join('')}${axes.map(a => `<th>${AXIS[a].label}</th>`).join('')}<th>Screens</th></tr></thead><tbody>${areaRows || `<tr><td colspan="${cols}" class="muted">No areas match the filters.</td></tr>`}</tbody></table></div></div>
                    <div class="card"><header><h2>Coverage landscape · ${esc(AXIS[state.axis].label)}</h2><p>One tile per feature in tree order: round = feature, square = option. Faded tiles are outside the filter. Select a tile to inspect it.</p></header>${land ? `<div class="land">${land}</div>` : '<p class="hint" style="padding:0 14px 14px">No features match.</p>'}</div>
                </div>`;
            }

            /* ---------- gallery ---------- */
            function renderGallery() {
                const list = SCREEN_LIST.filter(
                    s => screenShown(s.id) && s.features.some(id => MATCH.has(id)),
                );
                const firstIndex = s => Math.min(...s.features.map(id => dfsIndex.get(id) ?? 1e9));
                list.sort(
                    (a, b) => firstIndex(a) - firstIndex(b) || a.platform.localeCompare(b.platform),
                );
                const ids = list.map(s => s.id).join(',');
                const groups = new Map();
                for (const s of list) {
                    const first = DFS[firstIndex(s)];
                    if (!groups.has(first.area.id))
                        groups.set(first.area.id, { area: first.area, items: [] });
                    groups.get(first.area.id).items.push(s);
                }
                const [w, h] = { s: [180, 140], m: [220, 170], l: [320, 260] }[state.gsize];
                const html = [...groups.values()]
                    .map(
                        g =>
                            `<h3>${esc(g.area.name)} <span class="muted num">${g.items.length}</span></h3><div class="ggrid">${g.items
                                .map(
                                    s => `<article class="gcard"><button data-shot="${esc(s.id)}" data-shots="${esc(ids)}" aria-label="Open screenshot: ${esc(s.caption)}"><img loading="lazy" decoding="async" src="${esc(s.src)}" alt=""></button>
                                <div class="meta"><span class="pbadge">${ICON[s.platform]}${PLATFORM_LABEL[s.platform]}${s.model ? ' · ' + esc(s.model) : ''}${s.device ? ' · ' + esc(s.device) : ''}${s.firmware ? ' · fw ' + esc(s.firmware) : ''}</span>
                                <div class="cap" title="${esc(s.caption)}">${esc(s.caption)}</div>
                                <div class="fchips">${s.features
                                    .filter(id => byId.has(id))
                                    .map(
                                        id =>
                                            `<button class="fchip${MATCH.has(id) ? '' : ' muted'}" data-id="${esc(id)}" title="${esc(byId.get(id).breadcrumb.join(' › '))}">${esc(byId.get(id).name)}</button>`,
                                    )
                                    .join('')}</div></div></article>`,
                                )
                                .join('')}</div>`,
                    )
                    .join('');
                $('main').innerHTML =
                    `<div class="viewbar"><span class="count num">${fmt(list.length)} screenshots</span><span class="muted" style="font-size:12.5px">of filtered features, on shown platforms</span><span class="spacer"></span><span class="seg" role="group" aria-label="Card size">${[
                        ['s', 'Small'],
                        ['m', 'Medium'],
                        ['l', 'Large'],
                    ]
                        .map(
                            ([v, l]) =>
                                `<button data-set="gsize" data-value="${v}" aria-pressed="${state.gsize === v}">${l}</button>`,
                        )
                        .join('')}</span></div>
                <div class="gallery" style="--gal-w:${w}px;--gal-h:${h}px">${html || '<div class="empty"><h3>No screenshots</h3><p>No captured screens for the features and platforms in view.</p></div>'}</div>`;
            }

            /* ---------- table ---------- */
            const AV_RANK = { yes: 3, conditional: 2, unknown: 1, no: 0 };
            const COLS = [
                { k: 'tree', label: 'Feature', get: f => dfsIndex.get(f.id) },
                { k: 'level', label: 'Level', get: f => f.level },
                { k: 'team', label: 'Frontend team', get: f => f.team },
                { k: 'backend_team', label: 'Backend team', get: f => f.backend_team },
                ...PLATFORMS.map(p => ({
                    k: 'p:' + p,
                    label: PLATFORM_LABEL[p],
                    plat: p,
                    get: f => AV_RANK[f.platforms?.[p]] ?? 1,
                })),
                ...AXES.map(a => ({
                    k: 'c:' + a,
                    label: AXIS[a].label,
                    axis: a,
                    get: f => (isNA(f.coverage[a]) ? null : f.coverage[a].score),
                })),
                { k: 'shots', label: 'Screens', get: f => screensFor(f).length },
                { k: 'links', label: 'Links', get: f => linkGroups(f).size },
            ];
            const visibleCols = () =>
                COLS.filter(
                    c =>
                        (!c.plat || state.plat.includes(c.plat)) &&
                        (!c.axis || axisVisible(c.axis)),
                );
            function tableRows() {
                const col = COLS.find(c => c.k === state.sort) || COLS[0];
                const rows = DFS.filter(f => MATCH.has(f.id));
                if (col.k === 'tree') return state.dir === -1 ? rows.reverse() : rows;
                const val = new Map(rows.map(f => [f.id, col.get(f)]));
                return rows.sort((a, b) => {
                    const x = val.get(a.id),
                        y = val.get(b.id);
                    if (x == null || y == null)
                        return x == null && y == null
                            ? dfsIndex.get(a.id) - dfsIndex.get(b.id)
                            : x == null
                              ? 1
                              : -1;
                    return (
                        (x < y ? -1 : x > y ? 1 : 0) * state.dir ||
                        dfsIndex.get(a.id) - dfsIndex.get(b.id)
                    );
                });
            }
            function renderTable() {
                const cols = visibleCols();
                const rows = tableRows();
                const th = cols
                    .map(c => {
                        const label = c.plat
                            ? ICON[c.plat]
                            : c.axis
                              ? ICON[AXIS[c.axis].group === 'android' ? 'android' : 'desktop'] +
                                ' ' +
                                AXIS[c.axis].short
                              : esc(c.label);
                        const arrow =
                            state.sort === c.k ? (state.dir === 1 ? ICON.up : ICON.down) : '';
                        return `<th class="col-${c.k}" ${state.sort === c.k ? `aria-sort="${state.dir === 1 ? 'ascending' : 'descending'}"` : ''}><button class="thbtn" data-sort="${c.k}" aria-label="Sort by ${esc(c.label)}" title="Sort by ${esc(c.label)}">${label}${arrow}</button></th>`;
                    })
                    .join('');
                const body = rows
                    .map(f => {
                        const tds = cols
                            .map(c => {
                                if (c.k === 'tree')
                                    return `<td style="min-width:240px"><button class="thbtn" data-id="${esc(f.id)}" style="font-weight:500;text-align:left;white-space:normal">${hl(f.name)}</button><div class="bc">${esc(f.breadcrumb.slice(0, -1).join(' › '))}</div></td>`;
                                if (c.k === 'level')
                                    return `<td class="muted col-level">${esc(f.level)}</td>`;
                                if (c.k === 'team')
                                    return `<td class="col-team" style="white-space:nowrap">${esc(f.team)}</td>`;
                                if (c.k === 'backend_team')
                                    return `<td class="col-team" style="white-space:nowrap">${esc(f.backend_team)}</td>`;
                                if (c.plat)
                                    return `<td><span data-tip-av="${esc(f.id)}|${c.plat}">${avGlyph(f.platforms?.[c.plat], PLATFORM_LABEL[c.plat])}</span></td>`;
                                if (c.axis) return `<td>${scoreCell(f, c.axis)}</td>`;
                                if (c.k === 'shots')
                                    return `<td class="num">${screensFor(f).length || ''}</td>`;
                                if (c.k === 'links')
                                    return `<td class="num">${linkGroups(f).size || ''}</td>`;
                                return '<td></td>';
                            })
                            .join('');
                        return `<tr data-id="${esc(f.id)}" class="${state.sel === f.id ? 'sel' : ''}">${tds}</tr>`;
                    })
                    .join('');
                $('main').innerHTML =
                    `<div class="viewbar"><span class="count num">${fmt(rows.length)} rows</span><span class="muted" style="font-size:12.5px">Features without a score on a platform sort last.</span><span class="spacer"></span><button class="icon-btn" data-act="csv">${ICON.download}<span>Export CSV</span></button></div>
                <div class="tablev"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
            }
            function exportCsv() {
                const cols = [
                    'id',
                    'name',
                    'breadcrumb',
                    'level',
                    'frontend_team',
                    'backend_team',
                    ...PLATFORMS,
                    ...AXES.map(a => a + '_score'),
                    'screenshots',
                    'connections',
                ];
                const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
                const lines = [cols.join(',')];
                for (const f of tableRows())
                    lines.push(
                        [
                            f.id,
                            f.name,
                            f.breadcrumb.join(' > '),
                            f.level,
                            f.team,
                            f.backend_team,
                            ...PLATFORMS.map(p => f.platforms?.[p]),
                            ...AXES.map(a => (isNA(f.coverage[a]) ? '' : f.coverage[a].score)),
                            screensFor(f).length,
                            linkGroups(f).size,
                        ]
                            .map(q)
                            .join(','),
                    );
                const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'suite-features-filtered.csv';
                document.body.append(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            }

            /* ---------- detail ---------- */
            function pathHtml(text) {
                if (!text) return '<span class="muted">Not recorded</span>';
                return `<span class="path">${String(text)
                    .split(/\s*(?:>|›|→)\s*/)
                    .map(esc)
                    .join('<span class="sep">›</span>')}</span>`;
            }
            const shortPath = v => {
                const parts = String(v).split('/');
                return parts.length > 1 ? parts.slice(-2).join('/') : v;
            };
            function evidenceList(items, coverage) {
                if (!items.length) return '';
                return `<ul class="evl">${items
                    .map(e => {
                        const label = e.path + (e.line && e.line > 1 ? ':' + e.line : '');
                        const link = e.github_url
                            ? `<a href="${esc(e.github_url)}" target="_blank" rel="noopener" title="${esc(label)}">${esc(label)}</a>`
                            : `<span class="mono">${esc(label)}</span>`;
                        let sub = '';
                        if (coverage) {
                            const what =
                                e.verification && e.verification !== e.scenario
                                    ? `<div>${esc(e.verification)}</div>`
                                    : '';
                            sub = `<span class="s">${esc(e.scenario || '')}${e.execution ? ` · <i>${esc(e.execution)}</i>` : ''}${what}</span>`;
                        } else if (e.detail)
                            sub = `<span class="s">${esc(e.kind ? e.kind.replace('-', ' ') + ' · ' : '')}${esc(e.detail)}</span>`;
                        return `<li><span class="p">${ICON.code}${link}<button class="copy" data-copy="${esc(label)}" aria-label="Copy path ${esc(label)}">${ICON.copy}</button></span>${sub}</li>`;
                    })
                    .join('')}</ul>`;
            }
            function axisBlock(f, axis) {
                const c = f.coverage[axis];
                const a = AXIS[axis];
                const na = isNA(c);
                const score = c?.score;
                const color = na ? null : BUCKET_COLOR[bucket(score)];
                const meter = Array.from(
                    { length: 10 },
                    (_, i) =>
                        `<i class="${!na && i < score ? 'f' : ''}" style="${!na && i < score ? `background:${color}` : ''}"></i>`,
                ).join('');
                const tags = c
                    ? [
                          c.confidence && `${c.confidence} confidence`,
                          c.applicability,
                          c.basis && c.basis !== 'none' && `basis: ${c.basis}`,
                      ].filter(Boolean)
                    : [];
                const value = !c || score == null ? 'not assessed' : na ? 'n/a' : score + '/10';
                return `<details class="axis">
                    <summary><span class="an">${ICON[a.group === 'android' ? 'android' : 'desktop']}${a.label}</span>
                    <span class="meter" role="img" aria-label="${a.label}: ${esc(scoreText(c))}">${meter}<b>${value}</b></span>
                    <span class="sub">${esc(c?.rationale || '')}</span></summary>
                    <div class="body">
                        <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
                        ${c?.covered?.length ? `<h4>Covered intents</h4><ul>${c.covered.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
                        ${c?.gaps?.length ? `<h4>Gaps</h4><ul>${c.gaps.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
                        <h4>Test evidence</h4>${c?.evidence?.length ? evidenceList(c.evidence, true) : '<p class="muted" style="margin:0">None cited.</p>'}
                    </div></details>`;
            }
            function indicators(f) {
                const groups = ['desktop', 'android']
                    .map(g => AXES.filter(a => AXIS[a].group === g && axisVisible(a)))
                    .filter(g => g.length);
                return `<span class="ind"><span class="plats">${state.plat.map(p => avGlyph(f.platforms?.[p], PLATFORM_LABEL[p])).join('')}</span><span class="covs">${groups
                    .map(g => `<span class="pair">${g.map(a => scoreCell(f, a)).join('')}</span>`)
                    .join('')}</span></span>`;
            }
            function indicatorHead() {
                const groups = ['desktop', 'android']
                    .map(g => AXES.filter(a => AXIS[a].group === g && axisVisible(a)))
                    .filter(g => g.length);
                return `<div class="indhead" aria-hidden="true"><span></span><span class="ind"><span class="plats">${state.plat.map(p => `<span title="${PLATFORM_LABEL[p]}">${smallIcon(p)}</span>`).join('')}</span><span class="covs">${groups
                    .map(
                        g =>
                            `<span>${smallIcon(AXIS[g[0]].group === 'android' ? 'android' : 'desktop', 11)}<span class="pair">${g.map(a => `<span title="${AXIS[a].label}">${AXIS[a].short}</span>`).join('')}</span></span>`,
                    )
                    .join('')}</span></span></div>`;
            }
            function egoGraph(f, groups, width) {
                const entries = [...groups.values()];
                if (entries.length < 2 || width < 340) return '';
                const rank = e => Math.min(...e.types.map(t => LINK_TYPES.indexOf(t)));
                entries.sort(
                    (a, b) =>
                        rank(a) - rank(b) ||
                        b.types.length - a.types.length ||
                        dfsIndex.get(a.id) - dfsIndex.get(b.id),
                );
                const shown = entries.slice(0, 20);
                const half = Math.ceil(shown.length / 2);
                const sides = [shown.slice(0, half), shown.slice(half)];
                const pitch = 20;
                const H = Math.max(sides[0].length, sides[1].length) * pitch + 16;
                const W = Math.round(width);
                const cx = W / 2,
                    cy = H / 2;
                const colX = [cx - 26, cx + 26];
                const maxChars = Math.max(10, Math.floor((cx - 40) / 6.6));
                let edges = '',
                    nodes = '';
                sides.forEach((side, s) => {
                    const top = cy - ((side.length - 1) * pitch) / 2;
                    side.forEach((e, i) => {
                        const y = top + i * pitch;
                        const x = colX[s];
                        e.types.forEach((t, k) => {
                            const off = (k - (e.types.length - 1) / 2) * 3;
                            edges += `<path d="M${cx} ${cy + off} C ${(cx + x) / 2} ${cy + off}, ${(cx + x) / 2} ${y + off}, ${x} ${y + off}" fill="none" stroke="var(--l-${t})" stroke-width="1.5" opacity=".75"/>`;
                        });
                        const o = byId.get(e.id);
                        const name =
                            o.name.length > maxChars ? o.name.slice(0, maxChars - 1) + '…' : o.name;
                        const tx = s === 0 ? x - 9 : x + 9;
                        nodes += `<g class="nd" data-id="${esc(o.id)}" data-tip-feature="${esc(o.id)}"><circle cx="${x}" cy="${y}" r="4.5" fill="var(--l-${e.types[0]})" stroke="var(--panel)" stroke-width="2"/><text x="${tx}" y="${y + 4}" text-anchor="${s === 0 ? 'end' : 'start'}">${esc(name)}</text></g>`;
                    });
                });
                const center = `<circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)" stroke="var(--panel)" stroke-width="3"/>`;
                return `<svg class="ego" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${edges}${center}${nodes}</svg>${entries.length > shown.length ? `<p class="hint" style="margin-top:0">Graph shows ${shown.length} of ${entries.length}; all are listed below.</p>` : ''}`;
            }
            const GENERIC_NOTES = /^desktop: \w+; web: \w+; mobile: \w+$/;
            function viaText(t, list) {
                if (t === 'related') return '';
                if (t === 'screen')
                    return list
                        .map(id => DATA.screens[id])
                        .filter(Boolean)
                        .map(
                            s =>
                                PLATFORM_LABEL[s.platform] +
                                (s.device ? ' (' + s.device + ')' : '') +
                                ' screenshot: ' +
                                s.caption,
                        )
                        .join(' · ');
                return list.map(shortPath).join(' · ');
            }
            function renderDetail() {
                const el = $('detail');
                const layout = $('layout');
                const f = state.sel ? byId.get(state.sel) : null;
                document.body.classList.toggle('has-detail', !!f);
                applyInert();
                if (!f) {
                    layout.classList.add('no-detail');
                    el.innerHTML = '';
                    return;
                }
                layout.classList.remove('no-detail');
                const crumbs = f.ancestors
                    .map(
                        a =>
                            `<button data-id="${esc(a.id)}">${esc(a.name)}</button><span aria-hidden="true">›</span>`,
                    )
                    .join('');
                const plats = state.plat
                    .map(p => {
                        const st = AV_LABEL[f.platforms?.[p]] ? f.platforms[p] : 'unknown';
                        const nav = f.navigation?.[p];
                        const alts = (f.navigation_alternatives?.[p] || []).filter(
                            x => x && x !== nav,
                        );
                        const conds =
                            f.conditions?.[p === 'mobile' ? 'mobile' : 'desktop-web'] || [];
                        const parity = (f.parity || []).filter(
                            x => x.platform === p && x.reason && !conds.includes(x.reason),
                        );
                        return `<div class="prow"><span class="pi">${ICON[p]}</span>
