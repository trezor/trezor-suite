                            <div class="ph">${PLATFORM_LABEL[p]}<span class="st">${avGlyph(st)}${AV_LABEL[st]}</span></div>
                            <div class="pv">${st !== 'no' ? pathHtml(nav) : ''}
                            ${alts.length ? `<div class="muted" style="font-size:12px;margin-top:2px">Also: ${alts.map(esc).join(' · ')}</div>` : ''}
                            ${conds.length && st !== 'no' ? `<ul>${conds.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
                            ${parity.map(x => `<div style="font-size:12.5px;margin-top:2px">${esc(x.reason)}</div>`).join('')}</div></div>`;
                    })
                    .join('');
                const warnings = [];
                if (
                    state.plat.includes('mobile') &&
                    !['no', undefined].includes(f.platforms?.mobile) &&
                    isNA(f.coverage.android_automated) &&
                    isNA(f.coverage.android_manual) &&
                    f.coverage.android_automated?.applicability === 'not-supported'
                )
                    warnings.push(
                        'Mobile availability is not “no”, but both Android coverage axes are marked not supported.',
                    );
                if (
                    (f.platforms?.desktop !== 'no' || f.platforms?.web !== 'no') &&
                    f.coverage.desktop_automated?.applicability === 'not-supported' &&
                    f.coverage.desktop_manual?.applicability === 'not-supported'
                )
                    warnings.push(
                        'Desktop/web availability is not “no”, but both desktop coverage axes are marked not supported.',
                    );
                const covs = visibleAxes()
                    .map(a => axisBlock(f, a))
                    .join('');
                let shots = screensFor(f);
                let fromKids = false;
                if (!shots.length && f.kidCount) {
                    shots = [...new Set(descendants(f).flatMap(screensFor))].slice(0, 10);
                    fromKids = shots.length > 0;
                }
                const shotHtml = shots.length
                    ? `<div class="dshots">${shots
                          .map(id => {
                              const s = DATA.screens[id];
                              return `<figure><button data-shot="${esc(id)}" data-shots="${esc(shots.join(','))}" aria-label="Open screenshot: ${esc(s.caption)}"><img loading="lazy" src="${esc(s.src)}" alt=""></button><figcaption><span class="pbadge">${ICON[s.platform]}${esc(shotDevice(s))}</span> ${esc(s.caption)}</figcaption></figure>`;
                          })
                          .join('')}</div>`
                    : `<p class="muted" style="margin:0 0 8px">No current capture on the shown platforms.${f.screensAll.length ? ` ${f.screensAll.length} on hidden platforms.` : ''}</p>`;
                const flowShots = shots.filter(
                    id => DATA.screens[id].platform === 'mobile' && flowOf(id),
                );
                const flowHtml = flowShots.length
                    ? `<div class="flows"><h4>Capture flows <span class="muted num">${flowShots.length}</span></h4>${flowShots.map(flowBlock).join('')}</div>`
                    : '';
                const hist = f.historical_screenshot?.path
                    ? `<p class="hint">Historical repository image: <span class="mono">${esc(f.historical_screenshot.path)}</span></p>`
                    : '';
                const all = linkGroups(f, LINK_TYPES);
                const enabled = linkGroups(f);
                const typeCounts = Object.fromEntries(
                    LINK_TYPES.map(t => [
                        t,
                        [...all.values()].filter(g => g.types.includes(t)).length,
                    ]),
                );
                const lgroups = LINK_TYPES.filter(t => state.ltypes.includes(t) && typeCounts[t])
                    .map(t => {
                        const items = [...enabled.values()]
                            .filter(g => g.types.includes(t))
                            .sort((a, b) => dfsIndex.get(a.id) - dfsIndex.get(b.id));
                        return `<div class="lgroup"><h4><span class="ldot ${t}"></span>${LINK[t].plural} <span class="muted num">${items.length}</span></h4>${indicatorHead()}<div class="llist">${items
                            .map(g => {
                                const o = byId.get(g.id);
                                const via = viaText(t, g.via[t] || []);
                                return `<button class="litem" data-id="${esc(o.id)}"><span class="n">${esc(o.name)}</span>${indicators(o)}<span class="v" title="${esc(o.breadcrumb.join(' › '))}${via ? '\n' + esc(via) : ''}">${esc(o.breadcrumb.slice(0, -1).join(' › '))}${via ? ' · ' + esc(via) : ''}</span></button>`;
                            })
                            .join('')}</div></div>`;
                    })
                    .join('');
                const children = kids.get(f.id) || [];
                const childHtml = children.length
                    ? `<div class="dsec"><h3>Sub-features <span class="muted num">${children.length}</span></h3>${indicatorHead()}<div class="llist">${children
                          .map(
                              k =>
                                  `<button class="litem" data-id="${esc(k.id)}"><span class="n">${esc(k.name)}${k.kidCount ? ` <span class="muted num">· ${k.kidCount}</span>` : ''}</span>${indicators(k)}</button>`,
                          )
                          .join('')}</div></div>`
                    : '';
                const rootPlat = r =>
                    r.supported_platforms?.length
                        ? r.supported_platforms.map(p => PLATFORM_LABEL[p] || p).join(' & ')
                        : r.platform === 'mobile'
                          ? 'Mobile'
                          : 'Desktop & web';
                const roots = (f.roots || [])
                    .map(r => {
                        const label = r.path + (r.line ? ':' + r.line : '');
                        const owners = r.codeowners
                            ? Array.isArray(r.codeowners.owners)
                                ? r.codeowners.owners.join(', ')
                                : typeof r.codeowners === 'string'
                                  ? r.codeowners
                                  : ''
                            : '';
                        return `<div class="root"><span class="rp">${ICON[r.platform === 'mobile' ? 'mobile' : 'desktop']}${r.github_url ? `<a href="${esc(r.github_url)}" target="_blank" rel="noopener" title="${esc(label)}"><bdi>${esc(label)}</bdi></a>` : `<span class="mono">${esc(label)}</span>`}<button class="copy" data-copy="${esc(label)}" aria-label="Copy path ${esc(label)}">${ICON.copy}</button></span>
                        <span class="muted" style="font-size:12px">${r.symbol ? `<span class="mono">${esc(r.symbol)}</span> · ` : ''}${esc(rootPlat(r))} · ${esc((r.role || '').replace(/-/g, ' '))}${owners ? ' · CODEOWNERS ' + esc(owners) : ''}</span></div>`;
                    })
                    .join('');
                const own = f.ownership || {};
                const erratumHtml = e => {
                    const shot = e.screenshot_id && DATA.screens[e.screenshot_id];
                    return `<div class="erratum">${shot ? `<button data-shot="${esc(e.screenshot_id)}" aria-label="Open corrected screenshot: ${esc(shot.caption)}"><img loading="lazy" src="${esc(shot.src)}" alt=""></button>` : ''}<span>${e.removes_this_feature ? '<span class="tag">capture does not show this feature</span> ' : ''}${esc(e.description)} <span class="muted">${esc(e.reason || '')}</span></span></div>`;
                };
                const obs = (f.observations || [])
                    .map(o => {
                        const errs = (f.errata || []).filter(
                            e => e.observation_id && e.observation_id === o.id,
                        );
                        return `<li><b>${esc(PLATFORM_LABEL[o.platform] || o.platform)}${o.model ? ' · ' + esc(o.model) : ''}${o.firmware ? ' · fw ' + esc(o.firmware) : ''}</b>${o.superseded ? ' <span class="tag">screenshot scope corrected</span>' : ''} <span class="${o.superseded ? 'superseded' : ''}">${esc(o.description)}</span>${o.navigation ? `<div class="muted" style="font-size:12px">${esc(o.navigation)}</div>` : ''}${o.conditions?.length ? `<div class="muted" style="font-size:12px">${o.conditions.map(esc).join(' · ')}</div>` : ''}${errs.map(erratumHtml).join('')}</li>`;
                    })
                    .join('');
                const obsIds = new Set((f.observations || []).map(o => o.id));
                const errata = (f.errata || [])
                    .filter(e => !obsIds.has(e.observation_id))
                    .map(e => `<li>${erratumHtml(e)}</li>`)
                    .join('');
                const variants = (f.variants || [])
                    .map(
                        v =>
                            `<li><b>${esc(v.platform === 'mobile' ? 'Mobile' : 'Desktop & web')}</b> <span class="mono muted">${esc(v.source_id)}</span><div>${esc(v.description)}</div></li>`,
                    )
                    .join('');
                const evid = (f.evidence || []).filter(
                    e => e.kind === 'implementation' || e.kind === 'route',
                );
                const evidT = (f.evidence || []).filter(
                    e => e.kind !== 'implementation' && e.kind !== 'route',
                );
                const list = stepList();
                const pos = list.findIndex(x => x.id === f.id);
                const detailWidth = Math.min(el.clientWidth || 460, 620) - 36;
                el.innerHTML = `<div class="dhead">
                    <div class="dnav"><button class="icon-btn" data-act="prev" ${pos <= 0 ? 'disabled' : ''} aria-label="Previous feature" title="Previous (k)">${ICON.up}</button><button class="icon-btn" data-act="next" ${pos < 0 || pos >= list.length - 1 ? 'disabled' : ''} aria-label="Next feature" title="Next (j)">${ICON.down}</button><button class="icon-btn" data-act="close" aria-label="Close detail" title="Close (Esc)">${ICON.x}</button></div>
                    <nav class="crumbs" aria-label="Breadcrumb">${crumbs}</nav>
                    <h2 tabindex="-1" id="detailTitle">${esc(f.name)}</h2>
                    <div class="dmeta"><button class="copy mono" data-copy="${esc(f.id)}" title="Copy ID">${esc(f.id)} ${ICON.copy}</button><span class="tag">${esc(f.level)}</span><span title="Frontend team / backend team">${ICON.team} ${esc(teamLabel(f))}</span></div>
                </div>
                <div class="dbody">
                    <p class="desc">${esc(f.description)}</p>
                    <div class="dsec"><h3>${ICON.image} ${fromKids ? 'Screens from sub-features' : 'Screens'} <span class="muted num">${shots.length}</span></h3>${shotHtml}${flowHtml}${hist}</div>
                    <div class="dsec"><h3>Where to find it</h3><div class="pgrid">${plats}</div></div>
                    <div class="dsec"><h3>Test coverage <span class="muted">· expand for gaps and tests</span></h3>${warnings.map(w => `<div class="warn">${ICON.warn}${esc(w)}</div>`).join('')}${covs || '<p class="muted">Show a platform to see its coverage.</p>'}</div>
                    <div class="dsec"><h3>${ICON.link} Connections <span class="muted num">${enabled.size}</span>${enabled.size ? `<button class="link-btn r" data-act="only-linked" aria-pressed="${state.linked === f.id}">${state.linked === f.id ? 'Remove connection filter' : 'Filter to connections'}</button>` : ''}</h3>
                        <div class="ltypes" role="group" aria-label="Connection types">${LINK_TYPES.map(t => `<button class="toggle-btn" data-ltype="${t}" aria-pressed="${state.ltypes.includes(t)}" ${typeCounts[t] || state.ltypes.includes(t) ? '' : 'disabled'} title="${esc(LINK[t].desc)}"><span class="ldot ${t}"></span>${LINK[t].label} <span class="num muted">${typeCounts[t]}</span></button>`).join('')}</div>
                        ${enabled.size ? egoGraph(f, enabled, detailWidth) + lgroups : '<p class="muted" style="margin:0 0 8px">No connections of the selected types.</p>'}
                    </div>
                    ${childHtml}
                    <div class="dsec"><h3>${ICON.code} Root components <span class="muted num">${(f.roots || []).length}</span></h3><div class="roots">${roots || '<p class="muted" style="margin:0">No dedicated root component; see evidence.</p>'}</div></div>
                    <div class="dsec"><h3>${ICON.team} Ownership</h3><dl class="kv"><dt>Frontend team</dt><dd>${esc(f.team)}</dd><dt>Backend team</dt><dd>${esc(f.backend_team)}</dd><dt>Confidence</dt><dd>${esc(own.confidence || '–')}</dd></dl><p class="hint">${esc(own.basis || '')}</p>${own.backend_basis && f.backend_team !== f.team ? `<p class="hint">Backend: ${esc(own.backend_basis)}</p>` : ''}</div>
                    <div class="dsec"><h3>More evidence</h3>
                        ${obs ? `<details class="more"><summary>Runtime observations (${f.observations.length}${f.observations.some(o => o.superseded) ? `, ${f.observations.filter(o => o.superseded).length} with corrected screenshot scope` : ''})</summary><ul>${obs}</ul></details>` : ''}
                        ${errata ? `<details class="more"><summary>Other screenshot errata (${(f.errata || []).filter(e => !obsIds.has(e.observation_id)).length})</summary><ul>${errata}</ul></details>` : ''}
                        ${variants ? `<details class="more"><summary>Platform source records (${f.variants.length})</summary><ul>${variants}</ul></details>` : ''}
                        ${evid.length ? `<details class="more"><summary>Implementation evidence (${evid.length})</summary>${evidenceList(evid)}</details>` : ''}
                        ${evidT.length ? `<details class="more"><summary>Test scenario references (${evidT.length})</summary>${evidenceList(evidT)}</details>` : ''}
                        ${f.platform_notes && !GENERIC_NOTES.test(f.platform_notes) ? `<p class="hint">${esc(f.platform_notes)}</p>` : ''}
                    </div>
                </div>`;
            }

            /* ---------- capture flows (native mobile) ---------- */
            const FLOWS = DATA.capture_flows || null;
            const flowOf = id => {
                const s = DATA.screens[id];
                return (s && FLOWS?.flows?.[s.group || id]) || null;
            };
            const ordinal = n =>
                n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');
            const stepTarget = st => {
                const parts = [];
                if (st.id) parts.push(`<span class="mono">#${esc(st.id)}</span>`);
                if (st.text) parts.push(`“${esc(st.text)}”`);
                if (st.nth) parts.push(`(${ordinal(st.nth)})`);
                if (st.right_of != null) parts.push(`${esc(st.right_of)} pt right of it`);
                if (st.x_from_right != null)
                    parts.push(`${esc(st.x_from_right)} pt from right edge`);
                if (st.dx || st.dy) parts.push(`offset ${esc(st.dx || 0)},${esc(st.dy || 0)}`);
                return parts.join(' ');
            };
            const stepHtml = st => {
                const t = stepTarget(st);
                const action = {
                    launch: () => 'launch app',
                    tap: () => `tap ${t}`,
                    scroll_to: () => `scroll to ${t}`,
                    scroll: () => `scroll ${esc(st.direction || 'down')}${t ? ' ' + t : ''}`,
                    type: () => `type “${esc(st.value ?? '')}”${t ? ' into ' + t : ''}`,
                    wait_text: () => `wait for ${t}`,
                    alert: () => `alert ${esc(st.value || '')}`,
                    back: () => 'back',
                }[st.do];
                const testId =
                    st.test_id && st.test_id !== st.id
                        ? ` <span class="muted mono" title="testID in source">${esc(st.test_id)}</span>`
                        : '';
                return `<li>${action ? action() : esc(st.do)}${testId} <span class="to">→ <span class="mono">${esc(st.lands_on)}</span></span></li>`;
            };
            const fmtDate = d =>
                String(d || '')
                    .replace('T', ' ')
                    .replace(/:\d\d(\.\d+)?(Z|[+-]\d\d:\d\d)?$/, '');
            function flowBlock(id) {
                const fl = flowOf(id);
                if (!fl) return '';
                const s = DATA.screens[id];
                const r = fl.latest_replay;
                const checks = fl.checks || [];
                const check = checks.find(c => c.image === s.src) || null;
                const replayed = r
                    ? `<span class="fstatus ${esc(r.result)}">${esc(r.result)}</span> landing <span class="fstatus ${esc(r.landing)}">${esc(r.landing)}</span> · ${esc(r.device)} · ${esc(fmtDate(r.date))}${fl.replay_count > 1 ? ` <span class="muted">(${fl.replay_count} replays)</span>` : ''}${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}`
                    : '<span class="muted">Not replayed yet</span>';
                const landmark = (l, missing) =>
                    `<span class="flm${missing ? ' miss' : ''}"${missing ? ' title="Not found by OCR"' : ''}>${esc(l)}</span>`;
                const ocr = check
                    ? `<span class="fstatus ${esc(check.result)}">${esc(check.result)}</span> ${esc(check.device)}${(check.missing || []).length ? ` · missing ${(check.missing || []).map(l => landmark(l, true)).join('')}` : ''}`
                    : checks.length
                      ? `<span class="muted">No check for this ${esc(shotDevice(s))} image</span>`
                      : '';
                const missing = new Set(check?.missing || []);
                return `<details class="more flow" data-flow="${esc(s.group || id)}"><summary><span class="fl-name">Capture flow · ${esc(s.group || id)}</span><span class="fstatus ${esc(fl.status)}">${esc(fl.status)}</span></summary><div class="fbody">
                    <dl class="kv"><dt>Start state</dt><dd><span class="mono">${esc(fl.start_state)}</span>${FLOWS.start_states?.[fl.start_state] ? `<div class="muted">${esc(FLOWS.start_states[fl.start_state])}</div>` : ''}</dd>
                    <dt>Latest replay</dt><dd>${replayed}</dd>
                    ${ocr ? `<dt>OCR landing</dt><dd>${ocr}</dd>` : ''}
                    <dt>Arrival</dt><dd><span class="mono">${esc(fl.arrival.route)}</span><div>${fl.arrival.landmarks.map(l => landmark(l, missing.has(l))).join('')}</div></dd></dl>
                    <ol class="fsteps">${fl.steps.map(stepHtml).join('')}</ol>
                    ${fl.note ? `<p class="hint">${esc(fl.note)}</p>` : ''}
                </div></details>`;
            }

            /* ---------- tooltip ---------- */
            const tip = $('tip');
            function tipFeature(f) {
                return `<b>${esc(f.name)}</b><div class="tb">${esc(f.breadcrumb.slice(0, -1).join(' › ') || 'Area')}</div><div class="tr">${state.plat
                    .map(p => `${smallIcon(p, 13)}${avGlyph(f.platforms?.[p])}`)
                    .join(' ')}</div>${visibleAxes()
                    .map(
                        a =>
                            `<div class="tr">${scoreCell(f, a)}<span class="muted" style="font-size:11px">${AXIS[a].label}</span></div>`,
                    )
                    .join('')}`;
            }
            function tipContent(t) {
                if (t.dataset.tipFeature) return tipFeature(byId.get(t.dataset.tipFeature));
                if (t.dataset.tipScore) {
                    const [id, axis] = t.dataset.tipScore.split('|');
                    const c = byId.get(id).coverage[axis];
                    return `<b>${AXIS[axis].label}: ${esc(scoreText(c))}</b><div style="margin-top:4px">${esc(c?.rationale || '')}</div>`;
                }
                if (t.dataset.tipAv) {
                    const [id, p] = t.dataset.tipAv.split('|');
                    const f = byId.get(id);
                    const st = AV_LABEL[f.platforms?.[p]] ? f.platforms[p] : 'unknown';
                    return `<b>${PLATFORM_LABEL[p]}: ${AV_LABEL[st]}</b>${f.navigation?.[p] && st !== 'no' ? `<div style="margin-top:4px">${esc(f.navigation[p])}</div>` : ''}`;
                }
                if (t.dataset.tipRoll) {
                    const c = rollup(byId.get(t.dataset.tipRoll), state.axis);
                    return `<b>${esc(AXIS[state.axis].label)} in subtree</b>${BUCKETS.filter(
                        b => c[b.k],
                    )
                        .map(
                            b =>
                                `<div class="tr"><span class="sc b${b.k}">${b.label}</span>${c[b.k]} × ${esc(b.name.toLowerCase())}</div>`,
                        )
                        .join(
                            '',
                        )}${c.na ? `<div class="tr"><span class="sc na">–</span>${c.na} not on platform</div>` : ''}${c.un ? `<div class="tr"><span class="sc un">?</span>${c.un} not assessed</div>` : ''}`;
                }
                if (t.dataset.tipLink && state.sel) {
                    const g = selGroups.get(t.dataset.tipLink);
                    if (!g) return '';
                    return `<b>Connected to the selected feature</b>${g.types.map(x => `<div class="tr"><span class="ldot ${x}"></span>${LINK[x].label}</div>`).join('')}`;
                }
                return '';
            }
            const TIP_SEL =
                '[data-tip-feature],[data-tip-score],[data-tip-av],[data-tip-roll],[data-tip-link]';
            let tipTarget = null;
            function placeTip(x, y) {
                const r = tip.getBoundingClientRect();
                let left = x + 14,
                    top = y + 16;
                if (left + r.width > innerWidth - 8) left = x - r.width - 14;
                if (top + r.height > innerHeight - 8) top = y - r.height - 12;
                tip.style.left = Math.max(8, left) + 'px';
                tip.style.top = Math.max(8, top) + 'px';
            }
            function showTip(t) {
                tipTarget = t;
                const html = t ? tipContent(t) : '';
                if (!html) return tip.classList.remove('on');
                tip.innerHTML = html;
                tip.classList.add('on');
            }
            document.addEventListener('mouseover', e => {
                const t = e.target.closest(TIP_SEL);
                if (t !== tipTarget) showTip(t);
            });
            document.addEventListener('mousemove', e => {
                if (tipTarget) placeTip(e.clientX, e.clientY);
            });
            document.addEventListener('focusin', e => {
                const t = e.target.matches(TIP_SEL) ? e.target : null;
                if (!t) return showTip(null);
                showTip(t);
                const r = t.getBoundingClientRect();
                placeTip(r.left, r.bottom - 8);
            });
            document.addEventListener('scroll', () => showTip(null), true);

            /* ---------- lightbox ---------- */
            const lb = $('lb');
            let lbList = [],
                lbIndex = 0,
                lbOpener = null;
            function buildLightbox() {
                lb.innerHTML = `<div class="lbin"><div class="lbimg" data-act="lb-close">
                    <button class="navb prev" data-act="lb-prev" aria-label="Previous screenshot">${ICON.chevron}</button>
                    <img id="lbImg" src="" alt="">
                    <button class="navb next" data-act="lb-next" aria-label="Next screenshot">${ICON.chevron}</button></div>
                    <aside class="lbside"><div class="close-row"><span class="num" id="lbCount" aria-live="polite"></span><button class="icon-btn" data-act="lb-close" aria-label="Close">${ICON.x}</button></div>
                    <span class="pbadge" id="lbMeta"></span>
                    <div class="seg" id="lbDev" role="group" aria-label="iPhone model" hidden></div>
                    <p style="margin:0;font-size:14px" id="lbCaption"></p>
                    <p class="hint" style="margin:0" id="lbContext"></p>
                    <div><div class="row-label" id="lbShows"></div><div class="fchips" id="lbChips"></div></div>
                    <a id="lbOpen" href="#" target="_blank" rel="noopener" style="font-size:12.5px">Open full-size image ${ICON.ext}</a></aside></div>`;
            }
            function renderShot() {
                const s = DATA.screens[lbList[lbIndex]];
                if (!s) return;
                $('lbImg').src = s.src;
                $('lbImg').alt = s.caption;
                $('lbCount').textContent = `${lbIndex + 1} / ${lbList.length}`;
                $('lbMeta').innerHTML =
                    `${ICON[s.platform]}${PLATFORM_LABEL[s.platform]}${s.model ? ' · ' + esc(s.model) : ''}${s.device ? ' · ' + esc(s.device) : ''}${s.firmware ? ' · firmware ' + esc(s.firmware) : ''}`;
                const variants = variantsOf(lbList[lbIndex]);
                $('lbDev').hidden = variants.length < 2;
                $('lbDev').innerHTML =
                    variants.length < 2
                        ? ''
                        : [...variants]
                              .sort(
                                  (a, b) =>
                                      deviceRank(DATA.screens[a].device) -
                                          deviceRank(DATA.screens[b].device) ||
                                      String(DATA.screens[a].device).localeCompare(
                                          String(DATA.screens[b].device),
                                      ),
                              )
                              .map(
                                  id =>
                                      `<button data-lb-dev="${esc(id)}" aria-pressed="${id === lbList[lbIndex]}">${esc(DATA.screens[id].device || 'Other')}</button>`,
                              )
                              .join('');
                $('lbCaption').textContent = s.caption;
                $('lbContext').textContent = s.context || '';
                $('lbShows').textContent =
                    `Shows ${s.features.length} feature${s.features.length === 1 ? '' : 's'}`;
                $('lbChips').innerHTML = s.features
                    .filter(id => byId.has(id))
                    .map(
                        id =>
                            `<button class="fchip" data-id="${esc(id)}" data-lb-go="1">${esc(byId.get(id).name)}</button>`,
                    )
                    .join('');
                $('lbOpen').href = s.src;
                for (const b of lb.querySelectorAll('.navb')) b.hidden = lbList.length < 2;
            }
            function openShot(id, list, opener) {
                lbList = list && list.length ? list : [id];
                lbIndex = Math.max(0, lbList.indexOf(id));
                lbOpener = opener || null;
                if (!lb.firstChild) buildLightbox();
                renderShot();
                if (!lb.open) lb.showModal();
            }
            function lbStep(d) {
                lbIndex = (lbIndex + d + lbList.length) % lbList.length;
                renderShot();
            }
            lb.addEventListener('click', e => {
                const go = e.target.closest('[data-lb-go]');
                if (go) {
                    lb.close();
                    select(go.dataset.id, { reveal: true, focusDetail: true });
                    return;
                }
                const dev = e.target.closest('[data-lb-dev]');
                if (dev) {
                    lbList[lbIndex] = dev.dataset.lbDev;
                    renderShot();
                    return;
                }
                const a = e.target.closest('[data-act]');
                if (!a) return;
                if (a.dataset.act === 'lb-close' && (e.target === a || a.tagName === 'BUTTON'))
                    lb.close();
                else if (a.dataset.act === 'lb-prev') lbStep(-1);
                else if (a.dataset.act === 'lb-next') lbStep(1);
            });
            lb.addEventListener('close', () => {
                if (lbOpener && document.contains(lbOpener))
                    lbOpener.focus({ preventScroll: true });
            });

            /* ---------- help ---------- */
            function openHelp() {
                const h = $('help');
                const r = Object.entries(DATA.rubric?.scale || {}).sort(
                    ([a], [b]) => parseInt(a, 10) - parseInt(b, 10),
                );
                h.innerHTML = `<div style="max-width:760px;margin:6vh auto;background:var(--panel);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow);max-height:86vh;overflow:auto">
                    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:17px">How to read the map</h2><button class="icon-btn" data-act="help-close" aria-label="Close">${ICON.x}</button></div>
                    <h3 style="font-size:13px;margin:18px 0 8px">Test-coverage scores (0–10)</h3>
                    <dl class="kv" style="grid-template-columns:60px 1fr">${r
                        .map(
                            ([k, v]) =>
                                `<dt><span class="sc b${bucket(parseInt(k, 10))}">${esc(k)}</span></dt><dd>${esc(v)}</dd>`,
                        )
                        .join(
                            '',
                        )}<dt><span class="sc na">–</span></dt><dd>The feature does not exist on that platform.</dd><dt><span class="sc un">?</span></dt><dd>Not assessed.</dd></dl>
                    <p class="hint">Scores rate written test verification (automated E2E and manual procedures), not current pass rates. Android axes exclude iOS-only tests. Columns: Desktop E2E, Desktop manual, Android E2E, Android manual.</p>
                    <h3 style="font-size:13px;margin:18px 0 8px">Availability</h3>
                    <div class="legend"><span class="item">${avGlyph('yes')} Available</span><span class="item">${avGlyph('conditional')} Conditional (device, OS, network, account, provider, firmware or flag)</span><span class="item">${avGlyph('no')} Not available</span><span class="item">${avGlyph('unknown')} Unknown</span></div>
                    <h3 style="font-size:13px;margin:18px 0 8px">Connections</h3>
                    <dl class="kv" style="grid-template-columns:150px 1fr">${LINK_TYPES.map(t => `<dt><span class="ldot ${t}"></span> ${LINK[t].label}</dt><dd>${esc(LINK[t].desc)}</dd>`).join('')}</dl>
                    <p class="hint">With a feature selected, coloured dots in the tree mark connected rows; “+N” on a collapsed row counts connections inside it. On the map, connections are drawn as coloured curves and outlines; a dashed grey curve points to a collapsed branch that contains connected features.</p>

                const f = byId.get(id);
                const rows = visibleRows();
                const i = rows.findIndex(r => r.id === id);
                const go = target =>
                    target && select(target.id, { focusRow: true, history: 'replace' });
                if (e.key === 'ArrowDown') go(rows[i + 1]);
                else if (e.key === 'ArrowUp') go(rows[i - 1]);
                else if (e.key === 'Home') go(rows[0]);
                else if (e.key === 'End') go(rows[rows.length - 1]);
                else if (e.key === 'ArrowRight') {
                    if (showsKids(f) && !expanded.has(id)) {
                        expanded.add(id);
                        userExpanded = null;
                        renderView();
                        rowEl(id)?.focus({ preventScroll: true });
                    } else if (showsKids(f)) go(rows[i + 1]);
                } else if (e.key === 'ArrowLeft') {
                    if (expanded.has(id) && showsKids(f)) {
                        expanded.delete(id);
                        userExpanded = null;
                        renderView();
                        rowEl(id)?.focus({ preventScroll: true });
                    } else if (f.parent) go(byId.get(f.parent));
                } else if (e.key === 'Enter' || e.key === ' ') {
                    if (state.sel !== id) go(f);
                    else if (showsKids(f)) {
                        expanded.has(id) ? expanded.delete(id) : expanded.add(id);
                        userExpanded = null;
                        renderView();
                        rowEl(id)?.focus({ preventScroll: true });
                    }
                } else return false;
                return true;
            }
            document.addEventListener('keydown', e => {
                if (lb.open) {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        lbStep(-1);
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        lbStep(1);
                    }
                    return;
                }
                if (document.querySelector('dialog[open]')) return;
                const target = e.target;
                const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName);
                if (e.key === 'Escape') {
                    if (typing && $('filters').classList.contains('open')) return closeFilters();
                    if (typing) return target.blur();
                    if ($('filters').classList.contains('open')) return closeFilters();
                    if (state.sel) {
                        const id = state.sel;
                        select(null);
                        rowEl(id)?.focus({ preventScroll: true });
                    }
                    return;
                }
                if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
                const row = target.closest?.('.tree .trow, .mstage .mnode');
                if (
                    row &&
                    row === target &&
                    (row.matches('.mnode') ? mapKey(e, row) : treeKey(e, row))
                )
                    return e.preventDefault();
                if (state.view === 'map' && ['+', '=', '-', '_', '0'].includes(e.key)) {
                    e.preventDefault();
                    return mapCommand(
                        e.key === '0' ? 'fit' : e.key === '-' || e.key === '_' ? 'out' : 'in',
                    );
                }
                if (e.key === '/') {
                    e.preventDefault();
                    if (drawerMode()) openFilters(true);
                    else $('q')?.focus();
                } else if (e.key === 'j' || e.key === 'k') {
                    e.preventDefault();
                    step(e.key === 'j' ? 1 : -1, { focusRow: !!row, keepFocus: !row });
                } else if (
                    (e.key === 'ArrowDown' || e.key === 'ArrowUp') &&
                    (target === document.body || target === $('main'))
                ) {
                    e.preventDefault();
                    step(e.key === 'ArrowDown' ? 1 : -1, {
                        focusRow: state.view === 'tree' || state.view === 'map',
                    });
                } else if (
                    ['1', '2', '3', '4', '5'].includes(e.key) &&
                    !target.closest?.('#detail .ltypes')
                ) {
                    state.view = VIEWS[+e.key - 1];
                    update({ filters: false });
                } else if (e.key === '?') openHelp();
            });
            $('helpBtn').addEventListener('click', openHelp);
            $('themeBtn').addEventListener('click', () => {
                const cur =
                    document.documentElement.dataset.theme ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                const next = cur === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = next;
                store('theme', next);
            });
            function applyHash() {
                if (location.hash === lastAppliedHash) return;
                lastAppliedHash = location.hash;
                Object.assign(state, readHash());
                lastHist = { view: state.view, sel: state.sel };
                if (state.sel) reveal(state.sel);
                update();
                scrollToSelected('center');
            }
            window.addEventListener('hashchange', applyHash);
            window.addEventListener('popstate', applyHash);
            matchMedia('(max-width: 980px)').addEventListener('change', () => renderDetail());
            matchMedia('(max-width: 1280px)').addEventListener('change', e => {
                if (!e.matches) closeFilters();
            });

            /* ---------- boot ---------- */
            const savedTheme = load('theme');
            if (savedTheme === 'light' || savedTheme === 'dark')
                document.documentElement.dataset.theme = savedTheme;
            $('sub').textContent =
                `${fmt(F.length)} features in ${ROOTS.length} areas · ${fmt(VARIANTS.size)} screens · ${fmt(DATA.links.length)} connections · audited ${DATA.meta.audit_date}`;
            Object.assign(state, readHash());
            if (state.sel) reveal(state.sel);
            update();
            lastHist = { view: state.view, sel: state.sel };
            scrollToSelected('center');
        </script>
    </body>
</html>
