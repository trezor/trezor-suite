<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Suite feature map</title>
        <meta
            name="description"
            content="Interactive map of Trezor Suite user features with platform availability, ownership, screenshots, cross-links and test-coverage scores."
        />
        <style>
            :root {
                color-scheme: light;
                --bg: #f4f4f1;
                --panel: #fcfcfb;
                --panel-2: #efeeea;
                --hover: #ebeae5;
                --selected: #e2ebe5;
                --ink: #121211;
                --ink-2: #4b4a46;
                --ink-3: #66655f;
                --line: #dfded8;
                --line-strong: #b9b8b0;
                --accent: #0b6e45;
                --accent-ink: #ffffff;
                --accent-soft: #dcefe4;
                --mark: #ffe58a;
                --shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 8px 24px rgb(0 0 0 / 8%);
                --s0: #fde3d4;
                --s0-ink: #8a2b0c;
                --av-no: #77766e;
                --s1: #cde2fb;
                --s3: #9ec5f4;
                --s5: #6da7ec;
                --s6: #3987e5;
                --s8: #256abf;
                --s10: #184f95;
                --s1-ink: #0d2b52;
                --s3-ink: #0d2b52;
                --s5-ink: #0b0b0b;
                --s6-ink: #0b0b0b;
                --s8-ink: #ffffff;
                --s10-ink: #ffffff;
                --l-related: #6250d6;
                --l-screen: #eb6834;
                --l-component: #1baf7a;
                --l-test: #7d7c75;
                --av-yes: #2b2a27;
                --font:
                    ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue',
                    Arial, sans-serif;
                --mono:
                    ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas,
                    monospace;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme='light']) {
                    color-scheme: dark;
                    --bg: #141413;
                    --panel: #1b1b1a;
                    --panel-2: #232321;
                    --hover: #2a2a27;
                    --selected: #1e3329;
                    --ink: #f0efec;
                    --ink-2: #c9c8c0;
                    --ink-3: #a3a29a;
                    --line: #33332f;
                    --line-strong: #55544e;
                    --accent: #45c58b;
                    --accent-ink: #08130e;
                    --accent-soft: #1d3a2c;
                    --mark: #6b5a12;
                    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 45%);
                    --s0: #4a2414;
                    --s0-ink: #ffb393;
                    --av-no: #7a7972;
                    --s1: #1c3f69;
                    --s3: #22579c;
                    --s5: #2f6fc4;
                    --s6: #3987e5;
                    --s8: #6da7ec;
                    --s10: #9ec5f4;
                    --s1-ink: #cde2fb;
                    --s3-ink: #ffffff;
                    --s5-ink: #ffffff;
                    --s6-ink: #0b0b0b;
                    --s8-ink: #0b0b0b;
                    --s10-ink: #0b0b0b;
                    --l-related: #9085e9;
                    --l-screen: #d95926;
                    --l-component: #199e70;
                    --l-test: #8d8c85;
                    --av-yes: #f0efec;
                }
            }
            :root[data-theme='dark'] {
                color-scheme: dark;
                --bg: #141413;
                --panel: #1b1b1a;
                --panel-2: #232321;
                --hover: #2a2a27;
                --selected: #1e3329;
                --ink: #f0efec;
                --ink-2: #c9c8c0;
                --ink-3: #a3a29a;
                --line: #33332f;
                --line-strong: #55544e;
                --accent: #45c58b;
                --accent-ink: #08130e;
                --accent-soft: #1d3a2c;
                --mark: #6b5a12;
                --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 45%);
                --s0: #4a2414;
                --s0-ink: #ffb393;
                --av-no: #7a7972;
                --s1: #1c3f69;
                --s3: #22579c;
                --s5: #2f6fc4;
                --s6: #3987e5;
                --s8: #6da7ec;
                --s10: #9ec5f4;
                --s1-ink: #cde2fb;
                --s3-ink: #ffffff;
                --s5-ink: #ffffff;
                --s6-ink: #0b0b0b;
                --s8-ink: #0b0b0b;
                --s10-ink: #0b0b0b;
                --l-related: #9085e9;
                --l-screen: #d95926;
                --l-component: #199e70;
                --l-test: #8d8c85;
                --av-yes: #f0efec;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font: 14px/1.45 var(--font);
                -webkit-font-smoothing: antialiased;
                overflow: hidden;
            }
            ::selection {
                background: var(--accent-soft);
                color: var(--ink);
            }
            a {
                color: var(--accent);
                text-underline-offset: 2px;
                text-decoration-thickness: 1px;
            }
            button,
            input,
            select {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
                border-radius: 4px;
            }
            * {
                scrollbar-width: thin;
                scrollbar-color: var(--line-strong) transparent;
            }
            svg.i {
                width: 16px;
                height: 16px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none;
                vertical-align: -3px;
            }
            .mono {
                font-family: var(--mono);
                font-size: 12px;
            }
            .muted {
                color: var(--ink-3);
            }
            .num {
                font-variant-numeric: tabular-nums;
            }
            mark {
                background: var(--mark);
                color: inherit;
                border-radius: 2px;
                padding: 0 1px;
            }
            [hidden] {
                display: none !important;
            }

            /* App frame */
            .app {
                display: grid;
                grid-template-rows: auto auto 1fr;
                height: 100vh;
                height: 100dvh;
            }
            .topbar {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 10px 16px;
                background: var(--panel);
                border-bottom: 1px solid var(--line);
                min-width: 0;
            }
            .brand {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .brand h1 {
                font-size: 15px;
                font-weight: 650;
                margin: 0;
                letter-spacing: -0.01em;
                white-space: nowrap;
            }
            .brand .sub {
                font-size: 12px;
                color: var(--ink-3);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .tabs {
                display: flex;
                gap: 2px;
                padding: 3px;
                background: var(--panel-2);
                border-radius: 8px;
                margin-left: auto;
            }
            .tabs button {
                display: flex;
                align-items: center;
                gap: 6px;
                border: 0;
                background: transparent;
                padding: 5px 10px;
                border-radius: 6px;
                color: var(--ink-2);
                font-weight: 520;
            }
            .tabs button:hover {
                color: var(--ink);
            }
            .tabs button[aria-selected='true'] {
                background: var(--panel);
                color: var(--ink);
                box-shadow: 0 1px 2px rgb(0 0 0 / 12%);
            }
            .icon-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                height: 30px;
                min-width: 30px;
                padding: 0 8px;
                border: 1px solid var(--line);
                border-radius: 7px;
                background: var(--panel);
                color: var(--ink-2);
            }
            .icon-btn:hover {
                color: var(--ink);
                border-color: var(--line-strong);
            }
            .icon-btn[aria-pressed='true'] {
                background: var(--accent-soft);
                color: var(--ink);
                border-color: transparent;
            }
            .filters-toggle {
                display: none;
            }

            /* Active filter bar */
            .statusbar {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                padding: 8px 16px;
                border-bottom: 1px solid var(--line);
                background: var(--panel);
                min-height: 44px;
            }
            .count {
                font-weight: 600;
                margin-right: 4px;
            }
            .qplat {
                display: inline-flex;
                gap: 2px;
                padding: 2px;
                border-radius: 8px;
                background: var(--panel-2);
                margin-right: 6px;
            }
            .qplat button {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                border: 0;
                border-radius: 6px;
                padding: 3px 8px;
                background: transparent;
                color: var(--ink-3);
                font-size: 12.5px;
            }
            .qplat button[aria-pressed='true'] {
                background: var(--panel);
                color: var(--ink);
                box-shadow: 0 1px 2px rgb(0 0 0 / 12%);
            }
            .qplat button[aria-pressed='false'] svg.i {
                opacity: 0.5;
            }
            .qplat button[aria-pressed='false'] span {
                text-decoration: line-through;
            }
            .warn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12.5px;
                color: var(--ink-2);
                background: var(--panel-2);
                border-radius: 6px;
                padding: 6px 8px;
                margin-bottom: 8px;
            }
            .sr {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
            .scrim {
                position: fixed;
                inset: 0;
                z-index: 19;
                background: rgb(10 10 9 / 30%);
            }
            .drawer-head {
                display: none;
                align-items: center;
                justify-content: space-between;
                padding: 0 0 8px;
                font-weight: 650;
            }
            .superseded {
                color: var(--ink-3);
            }
            .erratum {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                margin: 4px 0 6px;
                font-size: 12.5px;
                color: var(--ink-2);
            }
            .erratum button {
                flex: none;
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 4px;
                background: var(--panel-2);
                line-height: 0;
                overflow: hidden;
            }
            .erratum img {
                height: 44px;
                width: auto;
            }
            .chip {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 2px 4px 2px 9px;
                border-radius: 999px;
                background: var(--panel-2);
                border: 1px solid var(--line);
                font-size: 12.5px;
                color: var(--ink-2);
                max-width: 100%;
            }
            .chip button {
                display: inline-flex;
                border: 0;
                background: transparent;
                padding: 2px;
                border-radius: 999px;
                color: var(--ink-3);
            }
            .chip button:hover {
                color: var(--ink);
                background: var(--hover);
            }
            .chip svg.i {
                width: 12px;
                height: 12px;
            }
            .link-btn {
                border: 0;
                background: transparent;
                color: var(--accent);
                padding: 2px 4px;
                text-decoration: underline;
                text-underline-offset: 2px;
                font-size: 12.5px;
            }

            .layout {
                display: grid;
                grid-template-columns: 284px minmax(0, 1fr) minmax(380px, 34vw);
                min-height: 0;
            }
            .layout.no-detail {
                grid-template-columns: 284px minmax(0, 1fr) 0;
            }
            .layout > .filters {
                grid-column: 1;
                grid-row: 1;
            }
            .layout > .main {
                grid-column: 2;
                grid-row: 1;
            }
            .layout > .detail {
                grid-column: 3;
                grid-row: 1;
            }
            .layout.no-detail > .detail {
                display: none;
            }

            /* Filters */
            .filters {
                overflow-y: auto;
                border-right: 1px solid var(--line);
                background: var(--panel);
                padding: 12px 14px 32px;
            }
            .fgroup {
                padding: 12px 0;
                border-bottom: 1px solid var(--line);
            }
            .fgroup:last-child {
                border-bottom: 0;
            }
            .fgroup > h2 {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 12px;
                font-weight: 650;
                color: var(--ink-2);
                margin: 0 0 8px;
                letter-spacing: 0.01em;
            }
            .fgroup > h2 .link-btn {
                font-weight: 500;
            }
            .search {
                position: relative;
            }
            .search svg.i {
                position: absolute;
                left: 9px;
                top: 9px;
                color: var(--ink-3);
            }
            .search input {
                width: 100%;
                height: 34px;
                padding: 0 30px 0 32px;
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                background: var(--panel);
            }
            .search input::placeholder {
                color: var(--ink-3);
            }
            .search kbd {
                position: absolute;
                right: 8px;
                top: 8px;
            }
            kbd {
                font: 11px var(--mono);
                padding: 1px 5px;
                border: 1px solid var(--line-strong);
                border-bottom-width: 2px;
                border-radius: 4px;
                color: var(--ink-3);
                background: var(--panel);
            }
            .seg {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .seg button,
            .toggle-btn {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 4px 9px;
                border: 1px solid var(--line);
                border-radius: 7px;
                background: var(--panel);
                color: var(--ink-2);
                font-size: 12.5px;
            }
            .seg button:hover,
            .toggle-btn:hover {
                border-color: var(--line-strong);
                color: var(--ink);
            }
            .seg button[aria-pressed='true'],
            .toggle-btn[aria-pressed='true'] {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--ink);
            }
            .plat-toggles {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }
            .plat-toggles .toggle-btn {
                justify-content: center;
                padding: 6px 4px;
            }
            .hint {
                font-size: 12px;
                color: var(--ink-3);
                margin: 6px 0 0;
            }
            .row-label {
                font-size: 12px;
                color: var(--ink-2);
                margin: 10px 0 4px;
            }
            .check {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 3px 0;
                font-size: 13px;
                cursor: pointer;
            }
            .check input {
                accent-color: var(--accent);
                margin: 0;
            }
            .check .n {
                margin-left: auto;
                color: var(--ink-3);
                font-size: 12px;
            }
            /* Main */
            .main {
                min-width: 0;
                min-height: 0;
                overflow: auto;
                position: relative;
            }
            .viewbar {
                position: sticky;
                top: 0;
                z-index: 3;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                padding: 8px 16px;
                background: color-mix(in srgb, var(--bg) 92%, transparent);
                backdrop-filter: blur(6px);
                border-bottom: 1px solid var(--line);
            }
            .viewbar .spacer {
                flex: 1;
            }
            .viewbar label {
                font-size: 12.5px;
                color: var(--ink-2);
            }

            /* Score cells */
            .sc {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 24px;
                height: 20px;
                border-radius: 4px;
                font: 600 11.5px/1 var(--font);
                font-variant-numeric: tabular-nums;
                flex: none;
            }
            .sc.b0 {
                background: var(--s0);
                color: var(--s0-ink);
            }
            .sc.b1 {
                background: var(--s1);
                color: var(--s1-ink);
            }
            .sc.b3 {
                background: var(--s3);
                color: var(--s3-ink);
            }
            .sc.b5 {
                background: var(--s5);
                color: var(--s5-ink);
            }
            .sc.b6 {
                background: var(--s6);
                color: var(--s6-ink);
            }
            .sc.b8 {
                background: var(--s8);
                color: var(--s8-ink);
            }
            .sc.b10 {
                background: var(--s10);
                color: var(--s10-ink);
            }
            .sc.na,
            .tile.na {
                background: repeating-linear-gradient(
                    135deg,
                    transparent 0 3px,
                    var(--line) 3px 4.5px
                );
                color: var(--ink-3);
            }
            .sc.un {
                border: 1px dotted var(--line-strong);
                color: var(--ink-3);
            }
            .av {
                width: 12px;
                height: 12px;
                flex: none;
            }
            .legend {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 4px 12px;
                font-size: 12px;
                color: var(--ink-2);
            }
            .legend .item {
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }
            .legend .sc {
                width: 20px;
                height: 16px;
                font-size: 10.5px;
            }
            .ldot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex: none;
                display: inline-block;
            }
            .ldot.related {
                background: var(--l-related);
            }
            .ldot.screen {
                background: var(--l-screen);
            }
            .ldot.component {
                background: var(--l-component);
            }
            .ldot.test {
                background: var(--l-test);
            }

            /* Tree */
            .treewrap {
                --cols: minmax(0, 1fr) var(--plat-w, 66px) var(--cov-w, 120px) 104px 52px;
                padding-bottom: 48px;
            }
            .thead,
            .trow {
                display: grid;
                grid-template-columns: var(--cols);
                align-items: center;
                column-gap: 14px;
                padding: 0 16px;
            }
            .trow > :not(.thumbs) {
                grid-row: 1;
                min-height: 34px;
            }
            .trow > .roll {
                min-height: 0;
            }
            .trow > .thumbs {
                grid-row: 2;
                grid-column: 1 / -1;
                margin: 0 0 8px calc(var(--d, 0) * 20px + 26px);
            }
            .trow:focus-visible {
                outline-offset: -2px;
            }
            .thead {
                position: sticky;
                top: var(--vb-h, 47px);
                z-index: 2;
                background: var(--bg);
                border-bottom: 1px solid var(--line);
                font-size: 11.5px;
                color: var(--ink-3);
                height: 40px;
            }
            .thead .grp {
                display: flex;
                gap: 6px;
                justify-content: flex-start;
            }
            .thead .grp > span {
                width: 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
                line-height: 1.15;
                font-size: 10.5px;
            }
            .thead .grp.plats > span {
                width: 18px;
            }
            .thead .covhead {
                display: flex;
                gap: 8px;
            }
            .thead .covhead > div {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1px;
            }
            .thead .covhead svg.i {
                width: 13px;
                height: 13px;
            }
            .thead .covhead .pair {
                display: flex;
                gap: 4px;
            }
            .thead .covhead .pair span {
                width: 24px;
                text-align: center;
                font-size: 10.5px;
            }
            .trow {
                min-height: 34px;
                border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
                cursor: pointer;
            }
            .trow:hover {
                background: var(--hover);
            }
            .trow.sel {
                background: var(--selected);
            }
            .trow.ctx .tname .label {
                color: var(--ink-3);
            }
            .trow.ctx mark {
                color: var(--ink);
            }
            .trow.ctx > .plats,
            .trow.ctx > .covs,
            .trow.ctx > .lk {
                opacity: 0.35;
            }
            .lk-in {
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                padding: 0 4px;
                font-size: 11px;
                color: var(--ink-2);
                background: transparent;
                line-height: 15px;
            }
            .lk-in:hover {
                border-color: var(--accent);
                color: var(--ink);
            }
            .trow.area {
                min-height: 40px;
            }
            .trow.area .tname .label {
                font-weight: 650;
            }
            .tname {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-width: 0;
                padding: 0 0 0 calc(var(--d, 0) * 20px);
            }
            .tname .line {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .twisty {
                width: 20px;
                height: 20px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 0;
                background: transparent;
                color: var(--ink-3);
                border-radius: 4px;
                padding: 0;
                flex: none;
            }
            .twisty:hover {
                background: var(--panel-2);
                color: var(--ink);
            }
            .twisty svg.i {
                width: 14px;
                height: 14px;
                transition: transform 0.15s ease-out;
            }
            .twisty[aria-expanded='true'] svg.i {
                transform: rotate(90deg);
            }
            .twisty.leaf {
                visibility: hidden;
            }
            .label {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                min-width: 0;
            }
            .kids {
                font-size: 11.5px;
                color: var(--ink-3);
                flex: none;
            }
            .tag {
                font-size: 10.5px;
                padding: 0 5px;
                border-radius: 4px;
                border: 1px solid var(--line);
                color: var(--ink-3);
                flex: none;
                line-height: 16px;
            }
            .team {
                font-size: 11.5px;
                color: var(--ink-3);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 0 1 auto;
                margin-left: auto;
                padding-left: 8px;
            }
            .plats,
            .covs {
                display: flex;
                gap: 4px;
                align-items: center;
            }
            .plats {
                gap: 6px;
            }
            .plats .av {
                margin: 0 3px;
            }
            .covs {
                gap: 8px;
            }
            .covs .pair {
                display: flex;
                gap: 4px;
            }
            .lk {
                display: flex;
                align-items: center;
                gap: 3px;
                font-size: 12px;
                color: var(--ink-3);
                justify-content: flex-end;
            }
            .lk .ldot {
                width: 7px;
                height: 7px;
            }
            .roll {
                display: flex;
                height: 10px;
                gap: 2px;
                width: 100%;
            }
            .roll span {
                height: 100%;
                min-width: 2px;
                border-radius: 2px;
            }
            .roll .r0 {
                background: var(--s0);
                box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--s0-ink) 40%, transparent);
            }
            .roll .run {
                box-shadow: inset 0 0 0 1px var(--line-strong);
            }
            .roll .r1 {
                background: var(--s1);
            }
            .roll .r3 {
                background: var(--s3);
            }
            .roll .r5 {
                background: var(--s5);
            }
            .roll .r6 {
                background: var(--s6);
            }
            .roll .r8 {
                background: var(--s8);
            }
            .roll .r10 {
                background: var(--s10);
            }
            .thumbs {
                display: flex;
                gap: 6px;
                overflow: hidden;
                min-width: 0;
            }
            .thumbs button {
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 5px;
                background: var(--panel-2);
                overflow: hidden;
                flex: none;
                line-height: 0;
            }
            .thumbs button:hover {
                border-color: var(--accent);
            }
            .thumbs img {
                height: var(--thumb-h, 54px);
                width: auto;
                display: block;
            }
            .thumbs .more {
                align-self: center;
                font-size: 12px;
                color: var(--ink-3);
                line-height: 1;
                padding: 0 4px;
            }
            .empty {
                padding: 48px 24px;
                text-align: center;
                color: var(--ink-2);
            }
            .empty h3 {
                margin: 0 0 6px;
                font-size: 15px;
                color: var(--ink);
            }

            /* Overview */
            .ov {
                padding: 16px 16px 48px;
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 20px;
            }
            .ov > * {
                min-width: 0;
            }
            .ov td:first-child {
                min-width: 190px;
            }
            .card {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 10px;
            }
            .card > header {
                display: flex;
                align-items: baseline;
                gap: 12px;
                flex-wrap: wrap;
                padding: 12px 14px 8px;
            }
            .card > header h2 {
                font-size: 14px;
                margin: 0;
            }
            .card > header p {
                margin: 0;
                font-size: 12.5px;
                color: var(--ink-3);
            }
            .kpis {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                gap: 1px;
                background: var(--line);
                border-top: 1px solid var(--line);
                border-radius: 0 0 10px 10px;
                overflow: hidden;
            }
            .kpi {
                background: var(--panel);
                padding: 10px 14px 12px;
            }
            .kpi .t {
                font-size: 12px;
                color: var(--ink-2);
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .kpi .v {
                font-size: 20px;
                font-weight: 650;
                font-variant-numeric: tabular-nums;
                margin: 2px 0 6px;
            }
            .kpi .v small {
                font-size: 12px;
                font-weight: 500;
                color: var(--ink-3);
                margin-left: 4px;
            }
            .dist {
                display: flex;
                height: 12px;
                gap: 2px;
            }
            .dist span {
                border-radius: 2px;
                min-width: 2px;
            }
            .ovtable-wrap {
                overflow-x: auto;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                font-size: 13px;
            }
            th {
                text-align: left;
                font-weight: 600;
                font-size: 11.5px;
                color: var(--ink-2);
                padding: 8px 10px;
                border-bottom: 1px solid var(--line);
                white-space: nowrap;
                background: var(--panel);
            }
            td {
                padding: 6px 10px;
                border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
                vertical-align: middle;
            }
            tbody tr {
                cursor: pointer;
            }
            tbody tr:hover td {
                background: var(--hover);
            }
            tbody tr.sel td {
                background: var(--selected);
            }
            .heat {
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .heat .sc {
                width: 34px;
            }
            .heat small {
                color: var(--ink-3);
                font-size: 11.5px;
                font-variant-numeric: tabular-nums;
                min-width: 30px;
            }
            .avbar {
                display: flex;
                width: 90px;
                height: 10px;
                gap: 2px;
            }
            .avbar span {
                border-radius: 2px;
                min-width: 2px;
            }
            .avbar .yes {
                background: var(--ink-2);
            }
            .avbar .conditional {
                background: repeating-linear-gradient(
                    135deg,
                    var(--ink-2) 0 2px,
                    transparent 2px 4px
                );
                box-shadow: inset 0 0 0 1px var(--ink-2);
            }
            .avbar .no {
                box-shadow: inset 0 0 0 1px var(--line-strong);
            }
            .avbar .unknown {
                background: var(--line);
            }
            .land {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 12px;
                padding: 0 14px 14px;
            }
            .land section {
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 8px 10px 10px;
                min-width: 0;
            }
            .land h3 {
                display: flex;
                align-items: baseline;
                gap: 8px;
                font-size: 12.5px;
                margin: 0 0 8px;
            }
            .land h3 button {
                border: 0;
                background: none;
                padding: 0;
                font-weight: 650;
                text-align: left;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .land h3 button:hover {
                color: var(--accent);
            }
            .land h3 .muted {
                margin-left: auto;
                font-weight: 500;
                font-size: 11.5px;
                white-space: nowrap;
            }
            .tiles {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
            }
            .tile {
                width: 15px;
                height: 15px;
                border-radius: 3px;
                border: 0;
                padding: 0;
                display: block;
            }
            .tile.b0 {
                background: var(--s0);
                box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--s0-ink) 35%, transparent);
            }
            .tile.b1 {
                background: var(--s1);
            }
            .tile.b3 {
                background: var(--s3);
            }
            .tile.b5 {
                background: var(--s5);
            }
            .tile.b6 {
                background: var(--s6);
            }
            .tile.b8 {
                background: var(--s8);
            }
            .tile.b10 {
                background: var(--s10);
            }
            .tile.un {
                box-shadow: inset 0 0 0 1px var(--line-strong);
                background: transparent;
            }
            .tile.out {
                opacity: 0.14;
            }
            .tile.sel {
                outline: 2px solid var(--ink);
                outline-offset: 1px;
            }
            .tile.lvl-feature {
                border-radius: 50%;
            }
            .tile:hover {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }

            /* Gallery */
            .gallery {
                padding: 16px 16px 48px;
            }
            .gallery h3 {
                font-size: 13px;
                margin: 18px 0 8px;
                display: flex;
                gap: 8px;
                align-items: baseline;
            }
            .gallery h3:first-child {
                margin-top: 0;
            }
            .ggrid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(var(--gal-w, 220px), 1fr));
                gap: 12px;
            }
            .gcard {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .gcard > button {
                border: 0;
                padding: 0;
                background: var(--panel-2);
                height: var(--gal-h, 170px);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .gcard img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                display: block;
            }
            .gcard .meta {
                padding: 8px 10px 10px;
                font-size: 12.5px;
                display: grid;
                gap: 6px;
            }
            .gcard .cap {
                color: var(--ink-2);
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .fchips {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .fchip {
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: 6px;
                padding: 1px 7px;
                font-size: 12px;
                color: var(--ink);
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }
            .fchip:hover {
                border-color: var(--accent);
            }
            .pbadge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 11.5px;
                color: var(--ink-3);
            }
            .pbadge svg.i {
                width: 13px;
                height: 13px;
            }

            /* Table view */
            .tablev {
                padding: 0 0 48px;
            }
            .tablev table th {
                position: sticky;
                top: var(--vb-h, 47px);
                z-index: 1;
                user-select: none;
            }
            .tablev table th[aria-sort] {
                color: var(--ink);
            }
            .thbtn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border: 0;
                background: none;
                padding: 0;
                font: inherit;
                color: inherit;
                white-space: nowrap;
            }
            .thbtn:hover {
                color: var(--ink);
            }
            .tablev th:first-child,
            .tablev td:first-child {
                position: sticky;
                left: 0;
            }
            .tablev td:first-child {
                background: var(--bg);
            }
            .tablev th:first-child {
                z-index: 2;
            }
            .tablev tbody tr:hover td:first-child {
                background: var(--hover);
            }
            .tablev tbody tr.sel td:first-child {
                background: var(--selected);
            }
            .tablev td .bc {
                font-size: 11.5px;
                color: var(--ink-3);
                max-width: 360px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* Detail */
            .detail {
                border-left: 1px solid var(--line);
                background: var(--panel);
                overflow-y: auto;
                min-width: 0;
                position: relative;
            }
            .dhead {
                padding: 16px 18px 12px;
                border-bottom: 1px solid var(--line);
                position: sticky;
                top: 0;
                background: var(--panel);
                z-index: 2;
            }
            .crumbs {
                display: flex;
                flex-wrap: wrap;
                gap: 2px 4px;
                font-size: 12px;
                color: var(--ink-3);
                margin-bottom: 4px;
                padding-right: 36px;
            }
            .crumbs button {
                border: 0;
                background: none;
                padding: 0;
                color: var(--ink-2);
            }
            .crumbs button:hover {
                color: var(--accent);
                text-decoration: underline;
            }
            .dhead h2 {
                font-size: 19px;
                line-height: 1.25;
                margin: 0;
                letter-spacing: -0.01em;
                text-wrap: balance;
                padding-right: 36px;
            }
            .dmeta {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px 10px;
                margin-top: 8px;
                font-size: 12px;
                color: var(--ink-3);
            }
            .copy {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border: 0;
                background: none;
                padding: 0;
                color: var(--ink-3);
            }
            .copy:hover {
                color: var(--ink);
            }
            .copy svg.i {
                width: 13px;
                height: 13px;
            }
            .dnav {
                position: absolute;
                top: 12px;
                right: 12px;
                display: flex;
                gap: 4px;
            }
            .dbody {
                padding: 4px 18px 40px;
            }
            .dbody > p.desc {
                font-size: 14.5px;
                line-height: 1.5;
                margin: 12px 0 4px;
                max-width: 68ch;
            }
            .dsec {
                padding: 14px 0 6px;
                border-bottom: 1px solid var(--line);
            }
            .dsec:last-child {
                border-bottom: 0;
            }
            .dsec > h3 {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12.5px;
                font-weight: 650;
                margin: 0 0 10px;
                color: var(--ink);
            }
            .dsec > h3 .muted {
                font-weight: 500;
            }
            .dsec > h3 .r {
                margin-left: auto;
            }
            .pgrid {
                display: grid;
                gap: 10px;
            }
            .prow {
                display: grid;
                grid-template-columns: 22px 1fr;
                gap: 2px 8px;
                align-items: start;
            }
            .prow .pi {
                padding-top: 1px;
                color: var(--ink-2);
            }
            .prow .ph {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                font-size: 13px;
            }
            .prow .ph .st {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-weight: 500;
                color: var(--ink-2);
                font-size: 12.5px;
            }
            .prow .pv {
                grid-column: 2;
                font-size: 13px;
                color: var(--ink-2);
            }
            .prow .pv ul {
                margin: 2px 0 0;
                padding-left: 16px;
            }
            .path {
                font-size: 12.5px;
                color: var(--ink);
            }
            .path .sep {
                color: var(--ink-3);
                margin: 0 3px;
            }
            .axis {
                border: 1px solid var(--line);
                border-radius: 8px;
                margin-bottom: 8px;
                overflow: hidden;
            }
            .axis > summary {
                list-style: none;
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
                gap: 4px 10px;
                padding: 9px 10px;
                cursor: pointer;
            }
            .axis > summary::-webkit-details-marker {
                display: none;
            }
            .axis > summary:hover {
                background: var(--hover);
            }
            .axis .an {
                display: flex;
                align-items: center;
                gap: 7px;
                font-weight: 600;
                font-size: 13px;
            }
            .axis .meter {
                display: flex;
                gap: 2px;
                align-items: center;
            }
            .axis .meter i {
                width: 9px;
                height: 12px;
                border-radius: 2px;
                box-shadow: inset 0 0 0 1px var(--line);
            }
            .axis .meter i.f {
                box-shadow: none;
            }
            .axis .meter b {
                margin-left: 8px;
                font-size: 13px;
                font-variant-numeric: tabular-nums;
                min-width: 34px;
                text-align: right;
            }
            .axis .sub {
                grid-column: 1 / -1;
                font-size: 12.5px;
                color: var(--ink-2);
            }
            .axis:not([open]) .sub {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .indhead {
                display: grid;
                grid-template-columns: 1fr auto;
                padding: 0 6px 2px;
                font-size: 10.5px;
                color: var(--ink-3);
            }
            .ind .plats {
                gap: 4px;
            }
            .ind .covs {
                gap: 6px;
            }
            .ind .pair {
                display: flex;
                gap: 3px;
            }
            .indhead .ind .covs > span {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1px;
            }
            .indhead .ind .pair span,
            .indhead .ind .plats span {
                width: 20px;
                text-align: center;
                font-size: 9.5px;
            }
            .indhead .ind .plats span {
                width: 12px;
            }
            .indhead svg.i {
                width: 12px;
                height: 12px;
            }
            .axis .body {
                padding: 0 10px 10px;
                font-size: 13px;
                border-top: 1px solid var(--line);
            }
            .axis .body h4 {
                font-size: 11.5px;
                margin: 10px 0 4px;
                color: var(--ink-2);
                font-weight: 650;
            }
            .axis .body ul {
                margin: 0;
                padding-left: 16px;
            }
            .axis .body li {
                margin: 2px 0;
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-top: 8px;
            }
            .evl {
                list-style: none;
                padding: 0 !important;
                display: grid;
                gap: 6px;
            }
            .evl li {
                display: grid;
                gap: 1px;
            }
            .evl .p {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .evl .p a {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-family: var(--mono);
                font-size: 12px;
            }
            .evl .s {
                font-size: 12px;
                color: var(--ink-3);
            }
            .dshots {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: 124px;
                gap: 8px;
                overflow-x: auto;
                padding-bottom: 6px;
            }
            .dshots figure {
                margin: 0;
                min-width: 0;
            }
            .dshots button {
                width: 100%;
                height: 150px;
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: var(--panel-2);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .dshots button:hover {
                border-color: var(--accent);
            }
            .dshots img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }
            .dshots figcaption {
                font-size: 11.5px;
                color: var(--ink-3);
                margin-top: 4px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .ego {
                width: 100%;
                height: auto;
                display: block;
                margin: -4px 0 4px;
            }
            .ego text {
                font: 11.5px var(--font);
                fill: var(--ink-2);
                cursor: pointer;
            }
            .ego .nd {
                cursor: pointer;
            }
            .ego .nd:hover text {
                fill: var(--ink);
                text-decoration: underline;
            }
            .ltypes {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-bottom: 10px;
            }
            .lgroup h4 {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                margin: 10px 0 6px;
                color: var(--ink-2);
            }
            .llist {
                display: grid;
                gap: 2px;
            }
            .litem {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 0 8px;
                padding: 5px 6px;
                border-radius: 6px;
                cursor: pointer;
                border: 0;
                background: transparent;
                text-align: left;
                width: 100%;
            }
            .litem:hover {
                background: var(--hover);
            }
            .litem .n {
                font-size: 13px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .litem .v {
                grid-column: 1 / -1;
                font-size: 11.5px;
                color: var(--ink-3);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .litem .ind,
            .indhead .ind {
                display: flex;
                gap: 10px;
                align-items: center;
            }
            .litem .ind .sc {
                width: 20px;
                height: 16px;
                font-size: 10.5px;
            }
            .roots {
                display: grid;
                gap: 8px;
            }
            .root {
                display: grid;
                gap: 2px;
                font-size: 12.5px;
            }
            .root .rp {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .root .rp a {
                font-family: var(--mono);
                font-size: 12px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                direction: rtl;
                text-align: left;
            }
            .kv {
                display: grid;
                grid-template-columns: 110px 1fr;
                gap: 4px 10px;
                font-size: 13px;
            }
            .kv dt {
                color: var(--ink-3);
            }
            .kv dd {
                margin: 0;
            }
            details.more > summary {
                cursor: pointer;
                font-size: 12.5px;
                color: var(--ink-2);
                padding: 4px 0;
            }
            details.more > summary:hover {
                color: var(--ink);
            }
            details.flow {
                border-top: 1px solid var(--line);
                font-size: 12.5px;
            }
            details.flow:last-of-type {
                border-bottom: 1px solid var(--line);
            }
            details.flow > summary {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            details.flow > summary::before {
                content: '▸';
                color: var(--ink-3);
                flex: none;
            }
            details.flow[open] > summary::before {
                content: '▾';
            }
            details.flow > summary .fl-name {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .flows {
                margin-top: 8px;
            }
            .flows > h4 {
                font-size: 12px;
                font-weight: 600;
                color: var(--ink-2);
                margin: 0 0 4px;
            }
            .fstatus {
                font-size: 10.5px;
                padding: 0 5px;
                border-radius: 4px;
                line-height: 16px;
                flex: none;
                border: 1px solid var(--line);
                color: var(--ink-2);
                background: var(--panel-2);
            }
            .fstatus.replayed,
            .fstatus.pass {
                border-color: var(--accent);
                color: var(--accent);
                background: var(--accent-soft);
            }
            .fstatus.drifted,
            .fstatus.drift,
            .fstatus.diverged {
                border-color: var(--s0-ink);
                color: var(--s0-ink);
                background: var(--s0);
            }
            .fstatus.not-reproducible {
                border-style: dashed;
                color: var(--ink-3);
                background: transparent;
            }
            .fbody {
                padding: 2px 0 10px;
            }
            .fbody .kv {
                grid-template-columns: 92px minmax(0, 1fr);
                font-size: 12.5px;
                margin-bottom: 6px;
            }
            .fbody .kv dd {
                overflow-wrap: anywhere;
            }
            .fsteps {
                margin: 0 0 6px;
                padding-left: 22px;
            }
            .fsteps li {
                margin: 2px 0;
                overflow-wrap: anywhere;
            }
            .fsteps li::marker {
                color: var(--ink-3);
                font-variant-numeric: tabular-nums;
            }
            .fsteps .to {
                color: var(--ink-3);
            }
            .fsteps .mono,
            .fbody .kv .mono {
                font-size: 11.5px;
            }
            .flm {
                display: inline-block;
                margin: 0 4px 2px 0;
                padding: 0 5px;
                border-radius: 4px;
                background: var(--panel-2);
                line-height: 18px;
            }
            .flm.miss {
                background: var(--s0);
                color: var(--s0-ink);
            }
            .placeholder {
                padding: 40px 24px;
                color: var(--ink-2);
            }
            .placeholder h2 {
                font-size: 16px;
                margin: 0 0 8px;
                color: var(--ink);
            }
            .placeholder p {
                max-width: 52ch;
                margin: 0 0 10px;
            }
            .placeholder .legend {
                margin: 16px 0 6px;
            }

            /* Tooltip and lightbox */
            .tip {
                position: fixed;
                z-index: 50;
                pointer-events: none;
                max-width: 340px;
                background: var(--panel);
                color: var(--ink);
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 8px 10px;
                font-size: 12.5px;
                opacity: 0;
                transform: translateY(2px);
                transition:
                    opacity 0.12s ease-out,
                    transform 0.12s ease-out;
            }
            .tip.on {
                opacity: 1;
                transform: none;
            }
            .tip b {
                display: block;
                font-size: 13px;
            }
            .tip .tb {
                color: var(--ink-3);
                font-size: 11.5px;
                margin-bottom: 6px;
            }
            .tip .tr {
                display: flex;
                gap: 6px;
                align-items: center;
                margin-top: 4px;
            }
            .tip .tr .sc {
                width: 20px;
                height: 16px;
                font-size: 10.5px;
            }
            dialog.lb {
                border: 0;
                padding: 0;
                background: transparent;
                max-width: 100vw;
                max-height: 100vh;
                width: 100vw;
                height: 100vh;
                color: var(--ink);
            }
            dialog.lb::backdrop {
                background: rgb(10 10 9 / 82%);
            }
            .lbin {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 340px;
                height: 100%;
            }
            .lbimg {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                min-height: 0;
                position: relative;
            }
            .lbimg img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 8px 40px rgb(0 0 0 / 50%);
                background: #fff;
            }
            .lbimg .navb {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 1px solid rgb(255 255 255 / 30%);
                background: rgb(20 20 19 / 72%);
                color: #fff;
                z-index: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .lbimg .navb:hover {
                background: rgb(20 20 19 / 92%);
            }
            .lbimg .prev {
                left: 16px;
            }
            .lbimg .prev svg.i {
                transform: rotate(180deg);
            }
            .lbimg .next {
                right: 16px;
            }
            .lbside {
                background: var(--panel);
                padding: 18px;
                overflow-y: auto;
                display: grid;
                align-content: start;
                gap: 12px;
                font-size: 13px;
            }
            .lbside .close-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: var(--ink-3);
                font-size: 12px;
            }

            /* Map */
            .main.is-map {
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .mapv {
                position: relative;
                flex: 1;
                min-height: 0;
                overflow: hidden;
                cursor: grab;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                background-color: var(--bg);
                background-image: radial-gradient(
                    circle,
                    color-mix(in srgb, var(--line-strong) 70%, transparent) 1px,
                    transparent 1.3px
                );
            }
            .mapv.panning,
            .mapv.panning .mnode {
                cursor: grabbing;
            }
            .mstage {
                position: absolute;
                left: 0;
                top: 0;
                transform-origin: 0 0;
            }
            .mstage > svg {
                position: absolute;
                left: 0;
                top: 0;
                width: 1px;
                height: 1px;
                overflow: visible;
                pointer-events: none;
            }
            .medges path {
                fill: none;
                stroke: var(--line-strong);
                stroke-width: 1.5;
                vector-effect: non-scaling-stroke;
            }
            .medges path.d0 {
                stroke-width: 2.25;
            }
            .medges path.ctx {
                stroke-dasharray: 4 3;
            }
            .medges path.on {
                stroke: var(--accent);
                stroke-width: 2.5;
                stroke-dasharray: none;
            }
            .mlinks path {
                fill: none;
                stroke-width: 2;
                vector-effect: non-scaling-stroke;
            }
            .mlinks path.all {
                stroke-width: 1.25;
                opacity: 0.32;
            }
            .mlinks.has-sel path.all {
                opacity: 0.14;
            }
            .mlinks path.in {
                stroke: var(--ink-3);
                stroke-dasharray: 5 4;
            }
            .mroot {
                position: absolute;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 999px;
                background: var(--ink);
                color: var(--bg);
                font-weight: 700;
                font-size: 15px;
                line-height: 1.25;
                box-shadow: var(--shadow);
            }
            .mroot small {
                font-weight: 500;
                font-size: 11.5px;
                opacity: 0.8;
            }
            .mnode {
                position: absolute;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 4px;
                padding: 6px 16px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 9px;
                box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
                cursor: pointer;
                --mb: transparent;
                --mbi: var(--ink);
            }
            .mnode::before {
                content: '';
                position: absolute;
                left: 5px;
                top: 7px;
                bottom: 7px;
                width: 5px;
                border-radius: 3px;
                background: var(--mb);
            }
            /* The score stripe sits on the edge facing the parent; the expand button on the outer edge. */
            .mnode.l::before {
                left: auto;
                right: 5px;
            }
            .mnode.mb0 {
                --mb: var(--s0);
                --mbi: var(--s0-ink);
            }
            .mnode.mb0::before {
                box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--s0-ink) 45%, transparent);
            }
            .mnode.mb1 {
                --mb: var(--s1);
                --mbi: var(--s1-ink);
            }
            .mnode.mb3 {
                --mb: var(--s3);
                --mbi: var(--s3-ink);
            }
            .mnode.mb5 {
                --mb: var(--s5);
                --mbi: var(--s5-ink);
            }
            .mnode.mb6 {
                --mb: var(--s6);
                --mbi: var(--s6-ink);
            }
            .mnode.mb8 {
                --mb: var(--s8);
                --mbi: var(--s8-ink);
            }
            .mnode.mb10 {
                --mb: var(--s10);
                --mbi: var(--s10-ink);
            }
            .mnode.mna::before {
                background: repeating-linear-gradient(
                    135deg,
                    transparent 0 2px,
                    var(--line-strong) 2px 3.5px
                );
            }
            .mnode.mun::before {
                background: none;
                border: 1px dotted var(--line-strong);
            }
            .mnode:hover {
                border-color: var(--line-strong);
            }
            .mnode.area {
                border-color: var(--line-strong);
            }
            .mnode.area .mn-name {
                font-weight: 700;
                font-size: 14px;
            }
            .mnode.lnk {
                border-color: var(--lc);
                box-shadow: 0 0 0 2px var(--lc);
            }
            .mnode.sel {
                background: var(--selected);
                border-color: var(--accent);
                box-shadow:
                    0 0 0 2px var(--accent),
                    var(--shadow);
                z-index: 1;
            }
            .mnode:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 4px;
            }
            .mnode.ctx .mn-name {
                color: var(--ink-3);
            }
            .mnode.ctx .mn-meta {
                opacity: 0.35;
            }
            .mn-name {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
                font-size: 13px;
                font-weight: 560;
                line-height: 18px;
            }
            .mn-name .label {
                flex: 0 1 auto;
            }
            .mn-meta {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 20px;
            }
            .mn-meta .covs {
                gap: 6px;
            }
            .mn-meta .covs .pair {
                gap: 3px;
            }
            .mn-meta .sc {
                width: 22px;
                height: 18px;
                font-size: 11px;
            }
            .mn-meta .plats {
                gap: 2px;
            }
            .mn-meta .lk {
                margin-left: auto;
            }
            .mnode .thumbs {
                gap: 4px;
            }
            .mnode .thumbs .more {
                padding: 0 2px;
            }
            .mtog {
                position: absolute;
                top: 50%;
                width: 24px;
                height: 24px;
                margin-top: -12px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                border: 1px solid var(--line-strong);
                border-radius: 50%;
                background: var(--panel);
                color: var(--ink-2);
                font: 650 10.5px/1 var(--font);
                font-variant-numeric: tabular-nums;
                z-index: 2;
            }
            .mnode.r .mtog {
                right: -13px;
            }
            .mnode.l .mtog {
                left: -13px;
            }
            .mtog:hover {
                border-color: var(--accent);
                color: var(--ink);
            }
            .mtog svg.i {
                width: 12px;
                height: 12px;
            }
            /* Zoomed out: hide details and fill each node with its score colour. */
            .mapv.far .mn-meta,
            .mapv.far .mnode .thumbs,
            .mapv.far .mn-name .tag {
                display: none;
            }
            .mapv.far .mnode {
                background: color-mix(in srgb, var(--mb) 85%, var(--panel));
            }
            .mapv.far .mnode.mna,
            .mapv.far .mnode.mun {
                background: var(--panel);
            }
            .mapv.far .mn-name {
                font-size: 18px;
                line-height: 21px;
                color: var(--mbi);
            }
            .mapv.far .mn-name .label {
                white-space: normal;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
            .mapv.far .mnode.mna .mn-name,
            .mapv.far .mnode.mun .mn-name {
                color: var(--ink-2);
            }
            .mapv.far .mnode.area .mn-name {
                font-size: 20px;
                line-height: 21px;
            }
            .mapv.far .mtog {
                transform: scale(1.8);
            }
            .mapv.far .mroot {
                font-size: 22px;
            }
            .mzoom {
                position: absolute;
                left: 12px;
                bottom: 12px;
                z-index: 3;
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 4px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 9px;
                box-shadow: var(--shadow);
                cursor: default;
            }
            .mzoom button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                height: 28px;
                min-width: 28px;
                padding: 0 7px;
                border: 0;
                border-radius: 6px;
                background: transparent;
                color: var(--ink-2);
                font-size: 12.5px;
            }
            .mzoom button:hover {
                background: var(--hover);
                color: var(--ink);
            }
            .mzoom button:disabled {
                opacity: 0.4;
                pointer-events: none;
            }
            .mzoom .sep {
                width: 1px;
                height: 18px;
                background: var(--line);
                margin: 0 3px;
            }
            .mzoom [data-map='reset'] {
                min-width: 48px;
                font-variant-numeric: tabular-nums;
            }
            .mmini {
                position: absolute;
                right: 12px;
                bottom: 12px;
                z-index: 3;
                width: 210px;
                height: 136px;
                background: color-mix(in srgb, var(--panel) 94%, transparent);
                border: 1px solid var(--line);
                border-radius: 9px;
                box-shadow: var(--shadow);
                overflow: hidden;
                cursor: crosshair;
            }
            .mmini svg {
                display: block;
                width: 100%;
                height: 100%;
            }
            .mmini .vp {
                fill: color-mix(in srgb, var(--accent) 12%, transparent);
                stroke: var(--accent);
                stroke-width: 1.5;
                vector-effect: non-scaling-stroke;
            }
            .mmini .sel {
                stroke: var(--accent);
                stroke-width: 3;
                vector-effect: non-scaling-stroke;
            }
            .mhint {
                position: absolute;
                left: 50%;
                bottom: 16px;
                transform: translateX(-50%);
                z-index: 2;
                padding: 4px 10px;
                border-radius: 999px;
                background: color-mix(in srgb, var(--panel) 88%, transparent);
                font-size: 12px;
                color: var(--ink-3);
                pointer-events: none;
                white-space: nowrap;
            }
            body.has-detail .mhint {
                display: none;
            }
            .mapv .empty {
                position: absolute;
                inset: 0;
                cursor: default;
            }

            /* Responsive */
            @media (max-width: 1440px) {
                .layout {
                    grid-template-columns: 256px minmax(0, 1fr) minmax(340px, 32vw);
                }
                .layout.no-detail {
                    grid-template-columns: 256px minmax(0, 1fr) 0;
                }
                .layout:not(.no-detail) .treewrap {
                    --cols: minmax(0, 1fr) var(--plat-w, 66px) var(--cov-w, 120px) 36px;
                }
                .layout:not(.no-detail) .trow > .roll,
                .layout:not(.no-detail) .thead > .h-roll,
                .layout:not(.no-detail) .axis-pick,
                .layout:not(.no-detail) .team {
                    display: none;
                }
            }
            @media (min-width: 1101px) and (max-width: 1280px) {
                body:not(.has-detail) .filters-toggle {
                    display: none !important;
                }
            }
            @media (max-width: 1280px) {
                .layout,
                .layout.no-detail {
                    grid-template-columns: 0 minmax(0, 1fr) minmax(340px, 38vw);
                }
                .layout.no-detail {
                    grid-template-columns: 0 minmax(0, 1fr) 0;
                }
                .filters-toggle {
                    display: inline-flex;
                }
                .filters {
                    position: fixed;
                    z-index: 20;
                    top: 0;
                    left: 0;
                    bottom: 0;
                    width: min(320px, 88vw);
                    box-shadow: var(--shadow);
                    transform: translateX(-102%);
                    visibility: hidden;
                    transition:
                        transform 0.2s ease-out,
                        visibility 0s linear 0.2s;
                }
                .filters.open {
                    transform: none;
                    visibility: visible;
                    transition: transform 0.2s ease-out;
                }
                .drawer-head {
                    display: flex;
                }
                .layout:not(.no-detail) .tree,
                .layout:not(.no-detail) .thead {
                    --cols: minmax(0, 1fr) var(--plat-w, 66px) var(--cov-w, 120px) 36px;
                }
                .layout:not(.no-detail) .trow > .roll,
                .layout:not(.no-detail) .thead > .h-roll,
                .layout:not(.no-detail) .team {
                    display: none;
                }
            }
            @media (min-width: 1101px) and (max-width: 1280px) {
                .layout.no-detail {
                    grid-template-columns: 256px minmax(0, 1fr) 0;
                }
                .layout.no-detail > .filters {
                    position: static;
                    transform: none;
                    visibility: visible;
                    box-shadow: none;
                    width: auto;
                    transition: none;
                }
                .layout.no-detail > .filters .drawer-head {
                    display: none;
                }
            }
            @media (max-width: 980px) {
                .layout,
                .layout.no-detail {
                    grid-template-columns: 0 minmax(0, 1fr) 0;
                }
                .detail {
                    position: fixed;
                    z-index: 15;
                    inset: 0 0 0 auto;
                    width: min(560px, 100vw);
                    box-shadow: var(--shadow);
                }
                .layout.no-detail .detail {
                    display: none;
