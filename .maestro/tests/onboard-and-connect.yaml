appId: io.trezor.suite.debug
name: Onboard and connect an emulated Trezor
tags:
    - suite-native
    - android
    - device
---
# Device setup via the HTTP->WS shim (mirrors prepareTrezorEmulator).
# Requires the shim on :9011 and `adb reverse tcp:21328 tcp:21328`.
- runScript: ../scripts/setupDevice.js

# App onboarding (mirrors onOnboarding.finishOnboarding)
- launchApp:
      clearState: true
- extendedWaitUntil:
      visible:
          id: '@onboarding/Welcome/nextBtn'
      timeout: 35000
- tapOn:
      id: '@onboarding/Welcome/nextBtn'
      retryTapIfNoChange: true
- tapOn:
      id: '@onboarding/AnalyticsConsent/nextBtn'
      retryTapIfNoChange: true
- tapOn:
      id: '@onboarding/Biometrics/skipBtn'
      retryTapIfNoChange: true
- waitForAnimationToEnd

# Dismiss the trading-residence prompt if the build shows it
- runFlow:
      when:
          visible:
              id: '@trading-residence'
      commands:
          - tapOn:
                text: 'Not now'
                retryTapIfNoChange: true

# Enable coins via the Get started button (mirrors onCoinEnabling.handleCoinEnablingInit).
# All coins start disabled here, so each toggle tap enables one.
- extendedWaitUntil:
      visible:
          id: '@screen/Home'
      timeout: 35000
- waitForAnimationToEnd
# Coin enabling opens via Get started, unless a connected device routed straight to it.
- runFlow:
      when:
          notVisible:
              id: '@screen/CoinEnablingInit'
      commands:
          - extendedWaitUntil:
                visible:
                    id: '@home/get-started-button'
                timeout: 20000
          - tapOn:
                id: '@home/get-started-button'
                retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: '@screen/CoinEnablingInit'
      timeout: 30000
- runFlow:
      file: ../subflows/enableAllCoins.yaml
- tapOn:
      id: '@coin-enabling/button-save'
      retryTapIfNoChange: true

# Wait for discovery to finish: Home + a populated portfolio graph
- extendedWaitUntil:
      visible:
          id: '@screen/Home'
      timeout: 60000
- extendedWaitUntil:
      visible:
          id: '@home/portfolio/graph'
      timeout: 120000

# Open the assets tab and the first discovered account
- tapOn:
      id: '@tabBar/AccountsStack'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: '@screen/Accounts'
      timeout: 30000
- extendedWaitUntil:
      visible:
          id: '@accountList/item/title'
      timeout: 30000
- tapOn:
      id: '@accountList/item/title'
      index: 0
      retryTapIfNoChange: true

# Token-bearing coins land on AccountAssets first; drill into AccountDetail
- runFlow:
      when:
          visible:
              id: '@screen/AccountAssets'
      commands:
          - tapOn:
                id: '@accountList/item/title'
                index: 0
                retryTapIfNoChange: true
# Landing on AccountDetail for a discovered account confirms the device connected
# and discovery finished. We stop here: in the E2E build the account has no balance
# or history (the portfolio graph is disabled for E2E tests), so asserting on the
# transaction list is not meaningful in CI.
- extendedWaitUntil:
      visible:
          id: '@screen/AccountDetail'
      timeout: 30000

- runScript: ../scripts/cleanupDevice.js
