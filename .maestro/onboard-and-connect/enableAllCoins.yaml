appId: io.trezor.suite.develop
---
# Toggle every mainnet coin on the CoinEnablingInit screen.
# Coins start disabled, so one tap each enables them. Order follows the
# networksConfig mainnet order so DOWN scrolling reaches each in turn.
- scrollUntilVisible:
      element:
          id: '@coin-enabling/toggle-btc'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 60
- tapOn:
      id: '@coin-enabling/toggle-btc'
      retryTapIfNoChange: true
- scrollUntilVisible:
