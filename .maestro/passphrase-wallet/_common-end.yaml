appId: io.trezor.suite.develop
name: (subflow) passphrase — save coins, discover, open passphrase wallet
env:
  PASSPHRASE: "a"
---
# Save the coin selection.
- tapOn:
    id: "@coin-enabling/button-save"
    retryTapIfNoChange: true

# Wait for the standard (no-passphrase) wallet to connect and discover.
- extendedWaitUntil:
    visible:
      id: "@screen/Home"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "@home/portfolio/graph"
    timeout: 300000

# Open the device manager and start a new passphrase wallet. The "add passphrase"
# button only appears once the standard wallet's discovery has finished, so wait
# for it rather than tapping immediately.
- tapOn:
    id: "@device-manager/device-switch"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "@device-manager/passphrase/add"
    timeout: 300000
- tapOn:
    id: "@device-manager/passphrase/add"
    retryTapIfNoChange: true

# Enter the passphrase.
- extendedWaitUntil:
    visible:
      id: "@screen/PassphraseForm"
    timeout: 20000
- tapOn:
    id: "@passphrase/passphraseInput"
- inputText: ${PASSPHRASE}
- tapOn:
    id: "@passphrase/confirmButton"
    retryTapIfNoChange: true

# Confirm the passphrase on the emulated Trezor (handles repeated prompts).
- extendedWaitUntil:
    visible:
      id: "@screen/PassphraseConfirmOnTrezor"
    timeout: 30000
- runScript: confirmPassphraseOnDevice.js

# Passphrase wallet dashboard is up.
- extendedWaitUntil:
    visible:
      id: "@screen/Home"
    timeout: 300000

# Open the assets tab and the first account of the passphrase wallet.
- tapOn:
    id: "@tabBar/AccountsStack"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "@screen/Accounts"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "@accountList/item/title"
    timeout: 30000
- tapOn:
    id: "@accountList/item/title"
    index: 0
    retryTapIfNoChange: true

# Token-bearing coins land on AccountAssets first; drill into AccountDetail.
- runFlow:
    when:
      visible:
        id: "@screen/AccountAssets"
    commands:
      - tapOn:
          id: "@accountList/item/title"
          index: 0
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "@screen/AccountDetail"
    timeout: 30000

# Scroll the transaction list toward ~the 15th transaction (we do NOT open it),
# loading more history when the footer button appears. Measured endpoint.
# Opening a transaction detail is intentionally avoided — a U+0 in the detail
# content crashes Maestro's view-hierarchy dump; scrolling the list is unaffected.
- extendedWaitUntil:
    visible:
      id: "@transactions/item/.*"
    timeout: 30000
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,80%"
          end: "50%,35%"
          duration: 400
      - runFlow:
          when:
            visible:
              id: "@transactions/list/more-button"
          commands:
            - tapOn:
                id: "@transactions/list/more-button"
                retryTapIfNoChange: true
            - waitForAnimationToEnd

# --- Warm reload: measure graph + fiat-rate render from persisted state ---
# Back to Home. AccountDetail hides the bottom tab bar, so pop back to Accounts
# first, then switch to the Home tab (the auto-eject/view-only prompt fires via a
# Home focus effect). Token accounts (e.g. ETH) have an extra AccountAssets level,
# so pop that too when present.
- pressKey: "back"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "@screen/AccountAssets"
    commands:
      - pressKey: "back"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "@screen/Accounts"
    timeout: 15000
- tapOn:
    id: "@tabBar/HomeStack"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "@screen/Home"
    timeout: 30000

# Disconnect the device. View-only is on by default, so balances stay visible; the
# auto-eject prompt appears — keep balances by pressing the primary button
# (secondary would enable auto-eject and drop the wallet).
- runScript: ../onboard-and-connect/teardownDevice.js
- extendedWaitUntil:
    visible:
      id: "@home/alert/view-only"
    timeout: 30000
- tapOn:
    id: "@alert-sheet/primary-button"
    retryTapIfNoChange: true

# Restart WITHOUT clearing state — the app loads persisted accounts (and, once
# implemented, persisted fiat rates). No device is connected, so there is no
# re-discovery: the reload time is essentially graph + fiat-rate rendering.
# stopApp: true (Maestro's default, made explicit) force-stops the running process
# first, so this is a genuine cold process restart, not just a foreground.
- launchApp:
    clearState: false
    stopApp: true

# Measured endpoint: the fiat balance is fully rendered (the loading Skeleton has
# been replaced by the real @home/portfolio/fiat-balance-header amount).
- extendedWaitUntil:
    visible:
      id: "@home/portfolio/fiat-balance-header"
    timeout: 120000
