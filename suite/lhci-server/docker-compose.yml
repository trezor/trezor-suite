# Suite perf LHCI server — full runbook in README.md.
# Host requirements: Docker + compose v2, 2 GB RAM, DNS A record for $LHCI_HOST pointing here, and
# a checkout of this repo (the lhci image is built from the monorepo root — see the build context).
# The mem_limit budget (256 + 768 + 512 MB) leaves headroom on a 2 GB box.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      # Overridable only so the stack can be smoke-tested on a dev machine; production uses
      # the defaults.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      LHCI_HOST: ${LHCI_HOST:?set LHCI_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      lhci:
        condition: service_healthy
    mem_limit: 256m
    logging: *default-logging

  lhci:
    build:
      # The image installs this workspace's deps from the monorepo lockfile, so the context is the
      # repo root; compose resolves it relative to this file, so the stack is still driven from
      # this directory. Needs BuildKit (compose v2 default) for Dockerfile.dockerignore.
      context: ../..
      dockerfile: suite/lhci-server/Dockerfile
    restart: unless-stopped
    environment:
      # The lhci CLI applies every LHCI_* variable to its own options (yargs env support: `__`
      # nests, `_` camelCases), which is why nothing is passed as a flag — see the Dockerfile CMD.
      LHCI_STORAGE__SQL_CONNECTION_URL: postgres://${POSTGRES_USER:-lhci}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lhci}
      # Empty password = no basic auth: the server drops the middleware when the password is falsy,
      # so the default deployment stays open exactly as before.
      LHCI_BASIC_AUTH__USERNAME: ${BASIC_AUTH_USERNAME:-lhci}
      LHCI_BASIC_AUTH__PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      # Loopback only: the admin surface (project creation, deletions, token rotation) is
      # reachable solely through an SSH tunnel to this port. The world goes through Caddy,
      # which 403s that surface — see Caddyfile.
      - "127.0.0.1:${LHCI_ADMIN_PORT:-9001}:9001"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lhci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lhci}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lhci} -d ${POSTGRES_DB:-lhci}"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    logging: *default-logging

  # Local-only Postgres access for a GUI client (DBeaver, a host psql). It publishes a forwarder
  # rather than a port on db itself, so production — which never passes a profile — keeps the
  # database unreachable from anywhere but the compose network, and even here it binds to loopback:
  #   docker compose --profile dev up -d db-forward
  db-forward:
    profiles: ["dev"]
    image: alpine/socat:1.8.1.3
    restart: "no"
    command: ["tcp-listen:5432,fork,reuseaddr", "tcp-connect:db:5432"]
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5434}:5432"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 32m
    logging: *default-logging

volumes:
  pgdata:
  caddy-data:
  caddy-config:
